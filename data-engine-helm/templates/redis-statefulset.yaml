apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.Cache }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.AppName }}
  serviceName: "{{ .Values.Cache }}"
  replicas: {{ .Values.replicaCount}}
  template:
    metadata:
      labels:
        app: {{ .Values.AppName }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: {{ .Values.Cache }}
        image: {{ .Values.Cache }}:latest
        ports:
        - containerPort: 19298
          name: {{ .Values.Cache }}
        volumeMounts:
        - name: {{ .Values.Cache }}-storage
          mountPath: /var/lib/{{ .Values.Cache }}/data
        env:
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.AppName }}-secret
              key: {{ .Values.Cache }}-root-username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.AppName }}-secret
              key: {{ .Values.Cache }}-root-password
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.AppName }}-configmap
              key: REDIS_DB
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.AppName }}-configmap
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.AppName }}-configmap
              key: REDIS_PORT
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.Cache }}-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi