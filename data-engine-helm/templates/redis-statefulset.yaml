apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app: data-engine
  serviceName: "redis"
  replicas: 3
  template:
    metadata:
      labels:
        app: data-engine
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: redis
        image: redis:latest
        ports:
        - containerPort: 19298
          name: redis
        volumeMounts:
        - name: redis-storage
          mountPath: /var/lib/redis/data
        env:
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: data-engine-secret
              key: redis-root-username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: data-engine-secret
              key: redis-root-password
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: data-engine-configmap
              key: REDIS_DB
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: data-engine-configmap
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: data-engine-configmap
              key: REDIS_PORT
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi