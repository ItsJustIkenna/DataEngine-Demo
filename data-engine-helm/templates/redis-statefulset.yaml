apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.cache }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  serviceName: "{{ .Values.cache }}"
  replicas: {{ .Values.replicaCount}}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: {{ .Values.cache }}
        image: {{ .Values.cache }}:latest
        ports:
        - containerPort: 19298
          name: {{ .Values.cache }}
        volumeMounts:
        - name: {{ .Values.cache }}-storage
          mountPath: /var/lib/{{ .Values.cache }}/data
        env:
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: {{ .Values.cache }}-root-username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: {{ .Values.cache }}-root-password
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: REDIS_DB
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: REDIS_PORT
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.cache }}-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi