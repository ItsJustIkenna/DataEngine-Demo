apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.AppName }}-configmap
data:
  POSTGRES_DB: "tsdb"
  POSTGRES_HOST: "a7rc4ub9o7.yd4ed8gjcp.tsdb.cloud.timescale.com"
  POSTGRES_PORT: "32935"
  REDIS_DB: "cache-LW5CEFX0"
  REDIS_HOST: "redis-19298.c91.us-east-1-3.ec2.redns.redis-cloud.com"
  REDIS_PORT: "19298"
  config.yaml: |
    data_engine_server_configuration:
      data_engine_server_settings:
        address: '127.0.0.1'
        port: 8002
    
    message_broker_server_configuration:
      message_broker_server_settings:
        address: '127.0.0.1'
        port: 8001

    topics:
      - 'order-data'
      - 'trade-data'
    
    exchanges:
      - exchange: 'Kraken'
        websocket_token: 'https://api.kraken.com/0/private/GetWebSocketsToken'
        symbols:
          - 'BTC/USD'
        apis:
          - websockets:
              - channel: 'level3'
                endpoint: 'wss://ws-auth.kraken.com/v2'
              - channel: 'trade'
                endpoint: 'wss://ws.kraken.com/v2'