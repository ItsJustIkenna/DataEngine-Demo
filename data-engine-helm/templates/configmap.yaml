apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-configmap
data:
  POSTGRES_DB: "tsdb_transaction"
  POSTGRES_HOST: "w5c229j381.yd4ed8gjcp.tsdb.cloud.timescale.com"
  POSTGRES_PORT: "39237"
  REDIS_DB: "cache-LW5CEFX0"
  REDIS_HOST: "redis-19298.c91.us-east-1-3.ec2.redns.redis-cloud.com"
  REDIS_PORT: "19298"
  config.yaml: |
    topics:
      - 'order-data'
      - 'trade-data'
    
    exchanges:
      - exchange: 'Kraken'
        websocket_token: 'https://api.kraken.com/0/private/GetWebSocketsToken'
        symbols:
          - 'BTC/USD'
          - 'SUI/USD'
        depth: 1000
        apis:
          - websockets:
              - channel: 'level3'
                endpoint: 'wss://ws-auth.kraken.com/v2'
              - channel: 'trade'
                endpoint: 'wss://ws.kraken.com/v2'