apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-configmap
data:
  POSTGRES_DB: "tsdb_transaction"
  POSTGRES_HOST: "lxrj1zznpt.yd4ed8gjcp.tsdb.cloud.timescale.com"
  POSTGRES_PORT: "{{ .Values.timescale.port }}"
  REDIS_DB: "cache-LW5CEFX0"
  REDIS_HOST: "redis-{{ .Values.redis.port }}.c91.us-east-1-3.ec2.redns.redis-cloud.com"
  REDIS_PORT: "{{ .Values.redis.port }}"
  config.yaml: |
    topics:
      - 'order-data'
      - 'trade-data'
    
    exchanges:
      - name: 'Kraken'
        websocket_token: 'https://api.kraken.com/0/private/GetWebSocketsToken'
        symbols:
          - 'BTC/USD'
          - 'SUI/USD'
        depth: 1000
        websockets:
          - channel: 'level3'
            endpoint: 'wss://ws-auth.kraken.com/v2'
          - channel: 'trade'
            endpoint: 'wss://ws.kraken.com/v2'