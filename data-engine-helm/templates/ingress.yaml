apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-engine-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
  - hosts:
    - localhost
    secretName: tls-secret
  rules:
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: data-engine-service
            port:
              number: 8080