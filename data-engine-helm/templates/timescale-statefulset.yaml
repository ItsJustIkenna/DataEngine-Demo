apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.Database }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.AppName }}
  serviceName: "{{ .Values.Database }}"
  replicas: {{ .Values.replicaCount}}
  template:
    metadata:
      labels:
        app: {{ .Values.AppName }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: {{ .Values.Database }}
        image: {{ .Values.Database }}/{{ .Values.Database }}db:latest-pg16
        ports:
        - containerPort: 32935
          name: {{ .Values.Database }}
        volumeMounts:
        - name: {{ .Values.Database }}-storage
          mountPath: /var/lib/postgresql/data
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.AppName }}-secret
              key: {{ .Values.Database }}-root-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.AppName }}-secret
              key: {{ .Values.Database }}-root-password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.AppName }}-configmap
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.AppName }}-configmap
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.AppName }}-configmap
              key: POSTGRES_PORT
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.Database }}-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi