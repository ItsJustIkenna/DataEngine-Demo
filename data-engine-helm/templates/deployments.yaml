apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.AppName }}-deployment"
  labels:
    app: {{ .Values.AppName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.AppName }}
  template:
    metadata:
      labels:
        app: {{ .Values.AppName }}
    spec:
      containers:
      - name: {{ .Values.AppName }}
        image: "{{ .Values.AzureContainerRegistry }}.azurecr.io/{{ .Values.AppName }}:latest"
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: "/etc/config/config.yaml"
        volumeMounts:
        - name: {{ .Values.VolumeName }}
          mountPath: /etc/config
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        imagePullPolicy: IfNotPresent
      volumes:
      - name: {{ .Values.VolumeName }}
        configMap:
          name: "{{ .Values.AppName }}-configmap"
          items:
            - key: config.yaml
              path: config.yaml