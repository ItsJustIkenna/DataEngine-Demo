apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
      - name: {{ .Values.appName }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 443
        env:
        - name: CONFIG_PATH
          value: "/etc/config/config.yaml"
        - name: REDIS_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: {{ .Values.cache }}-root-username
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: {{ .Values.cache }}-root-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: REDIS_PORT
        - name: REDIS_URL
          value: "redis://$(REDIS_USER):$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: {{ .Values.database }}-root-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: {{ .Values.database }}-root-password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.appName }}-configmap
              key: POSTGRES_PORT
        - name: DATABASE_URL
          value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/tsdb?sslmode=require"
        - name: KRAKEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: kraken-api-key
        - name: KRAKEN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: kraken-secret-key
        volumeMounts:
        - name: {{ .Values.volumeName }}
          mountPath: /etc/config
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -q '[s]erver' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -q '[s]erver' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
        imagePullPolicy: IfNotPresent
      volumes:
      - name: {{ .Values.volumeName }}
        configMap:
          name: {{ .Values.appName }}-configmap
          items:
            - key: config.yaml
              path: config.yaml