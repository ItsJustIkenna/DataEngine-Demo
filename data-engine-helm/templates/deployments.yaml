apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
      - name: {{ .Values.appName }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: "/etc/config/config.yaml"
        - name: KRAKEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: kraken-api-key
        - name: KRAKEN_API_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.appName }}-secret
              key: kraken-api-secret
        volumeMounts:
        - name: {{ .Values.volumeName }}
          mountPath: /etc/config
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        imagePullPolicy: IfNotPresent
      volumes:
      - name: {{ .Values.volumeName }}
        configMap:
          name: {{ .Values.appName }}-configmap
          items:
            - key: config.yaml
              path: config.yaml