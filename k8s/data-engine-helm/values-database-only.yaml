# =============================================================================
# DataEngine Database-Only Mode Configuration
# Optimized for data collection and storage without message broker publishing
# =============================================================================

environment: production
replicaCount: 2

# Database-only optimized resources
resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "1000m"
    memory: "2Gi"

# Limited autoscaling for database-only mode
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

# Database-only configuration
config:
  log_level: "info"
  rust_log: "data_engine=info,hostbuilder=debug"
  tokio_worker_threads: 8  # Optimized for database operations
  max_connections: 1000
  
  # Database-only mode flags
  database_only_mode: true
  disable_message_broker: true
  disable_publisher: true

# =============================================================================
# External Services Configuration (Database-Only)
# =============================================================================

# Use external database
externalDatabase:
  enabled: true
  host: "prod-postgres.internal"
  port: 5432
  username: "dataengine_db"
  database: "trading_platform"

# Use external Redis for caching
externalRedis:
  enabled: true
  host: "prod-redis.internal"
  port: 6379

# Disable embedded services
postgresql:
  enabled: false

redis:
  enabled: false

# =============================================================================
# Secrets Configuration (NO ACTUAL SECRETS STORED)
# =============================================================================

secrets:
  database:
    enabled: true
    username: "dataengine_db"
    # password: PROVIDED VIA --set-string AT DEPLOY TIME
    
  redis:
    enabled: true
    # password: PROVIDED VIA --set-string AT DEPLOY TIME
    
  api_keys:
    # kraken: PROVIDED VIA --set-string AT DEPLOY TIME
    
  tls:
    cert: ""
    key: ""

# =============================================================================
# Database-Only Specific Settings
# =============================================================================

# Security for database-only mode
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Monitoring focused on database operations
monitoring:
  enabled: true
  metrics:
    enabled: true
    port: 9090
    serviceMonitor:
      enabled: true

# Database-only environment variables
env:
  ENVIRONMENT: "production"
  DEBUG_MODE: "false"
  DATABASE_POOL_SIZE: "30"  # Higher for database-focused workload
  REDIS_POOL_SIZE: "15"
  ENABLE_QUERY_LOGGING: "true"
  ENABLE_PERFORMANCE_METRICS: "true"
  MAX_CONCURRENT_REQUESTS: "2000"
  
  # Database-only specific variables
  DATABASE_ONLY_MODE: "true"
  DISABLE_MESSAGE_BROKER: "true"
  DISABLE_PUBLISHER: "true"
