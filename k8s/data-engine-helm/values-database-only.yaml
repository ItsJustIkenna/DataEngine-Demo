# =============================================================================
# DataEngine Database-Only Mode Configuration
# Deploys DataEngine application in database-only mode (no message broker)
# External PostgreSQL (TimescaleDB) and Redis - Application runs with database only
# =============================================================================

# Global configuration
global:
  environment: development

# =============================================================================
# DataEngine Application - Database-Only Mode Enabled
# =============================================================================

# Enable the main DataEngine application (runs without message broker in database-only mode)
enabled: true

# Three replicas for high availability
replicaCount: 3
image:
  repository: data-engine
  tag: latest
  pullPolicy: Always

# Image pull secrets for private registry
imagePullSecrets:
  - name: ghcr-secret

# Service account configuration for GHCR access
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# =============================================================================
# Resource Management - Increased for stable operation
# =============================================================================

resources:
  limits:
    cpu: "500m"
    memory: "4Gi"
  requests:
    cpu: "200m"
    memory: "2Gi"

# Disable autoscaling for development
autoscaling:
  enabled: false

# =============================================================================
# Application Configuration - Database-Only Mode
# =============================================================================

config:
  # Database-only mode flags
  database_only_mode: true
  disable_message_broker: true
  disable_publisher: true
  websocket_only: true
  graceful_api_failure: true
  
  # Kraken exchange configuration
  exchanges:
    - name: Kraken
      enabled: true
      api_url: "https://api.kraken.com"
      websocket_url: "wss://ws.kraken.com"
      require_auth: false
      websocket_only: true
      websocket_token: 'https://api.kraken.com/0/private/GetWebSocketsToken'
      symbols:
        - "BTC/USD"
        - "SOL/USD"
        - "SUI/USD"
      depth: 100
      websockets:
        - channel: "level3"
          endpoint: "wss://ws-auth.kraken.com/v2"
        - channel: "trade"
          endpoint: "wss://ws.kraken.com/v2"
      timeout: 30
  
  # Topics for message routing in database-only mode
  topics:
    - "market.data.kraken.trades"
    - "market.data.kraken.level3"
    - "market.data.kraken.snapshots"
  topic_routing:
    balances: "portfolio.updates.balances"
    balances_snapshot: "portfolio.updates.snapshots"
    level3: "market.data.kraken.level3"
    level3_snapshot: "market.data.kraken.snapshots"
    trade_snapshot: "market.data.kraken.trade_snapshots"
    trades: "market.data.kraken.trades"

# =============================================================================
# Enable External Services
# =============================================================================

# Enable EXTERNAL database (TimescaleDB Cloud)
externalDatabase:
  enabled: true
  useCompleteUrl: false

# Enable EXTERNAL Redis
externalRedis:
  enabled: true

# =============================================================================
# Secrets Configuration
# =============================================================================

secrets:
  # External database configuration
  database:
    enabled: true
    # Password should be set via --set flag, never stored in YAML
    # Set via: --set secrets.database.password="$DB_PASSWORD" for production
  
  # External Redis configuration  
  redis:
    enabled: true
    # Set via: --set secrets.redis.url="$REDIS_URL" --set secrets.redis.password="$REDIS_PASSWORD"
  
  # API keys  
  api_keys:
    enabled: true
    kraken_api_key: ""  # Triggers secret lookup
    kraken_secret_key: ""  # Triggers secret lookup
    # Set via: --set secrets.api_keys.kraken_api_key="$KRAKEN_API_KEY" --set secrets.api_keys.kraken_secret_key="$KRAKEN_SECRET"

# Disable monitoring components for resource efficiency
grafana:
  enabled: false

prometheus:
  enabled: false

alertmanager:
  enabled: false

# Logging configuration
logging:
  level: "info"
  format: "json"
  outputs: ["stdout"]
  file_path: null
  max_file_size_mb: 100
  max_files: 5
  structured_logging: true

# =============================================================================
# Disable All Application Services
# =============================================================================

# Disable main application service
service:
  enabled: false

# Disable ingress for database-only CI/testing (no cert-manager dependency)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

# Disable all monitoring components
monitoring:
  enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Disable persistence (not needed for database-only deployment)
persistence:
  enabled: false

# =============================================================================
# Networking (Database Access Only)
# =============================================================================

# Network policy to allow database access
networkPolicy:
  enabled: false
  ingress:
    - from: []  # Allow all internal cluster traffic
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis

# =============================================================================
# Security Context (Minimal)
# =============================================================================

podSecurityContext:
  runAsNonRoot: false  # Allow postgres to run as postgres user
  fsGroup: 999  # postgres group

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# =============================================================================
# Health Probes - Using exec commands (app has no HTTP endpoints)
# =============================================================================

healthcheck:
  enabled: true
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "pgrep -f dataengine || exit 1"
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "pgrep -f dataengine || exit 1"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - "pgrep -f dataengine || exit 1"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1

# =============================================================================
# Resource Limits (Database Focus)
# =============================================================================

# No application resource limits since no application pods are deployed
# Resources are allocated to PostgreSQL and Redis components only

# =============================================================================
# Database Backup Configuration
# =============================================================================
backup:
  enabled: true
  schedule: "0 2 * * *"  # 2 AM UTC daily for database-only environment
  retentionDays: 30  # Keep backups for 30 days
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce

# =============================================================================
# TLS/Certificate Management
# =============================================================================
# Disabled for database-only CI/testing to avoid cert-manager CRD dependency
certManager:
  enabled: false
  email: ""
  server: ""
  solvers: []
