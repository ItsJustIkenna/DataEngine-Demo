# =============================================================================
# DataEngine Database and Cache Only Configuration
# Deploys only PostgreSQL (TimescaleDB) and Redis - No DataEngine application
# =============================================================================

# Global configuration
global:
  environment: development

# =============================================================================
# DataEngine Application - DISABLED for database-only mode
# =============================================================================

# Disable the main DataEngine application
enabled: false

# Minimal application configuration (ignored when enabled: false)
replicaCount: 0
image:
  repository: data-engine
  tag: "local"
  pullPolicy: Never

# =============================================================================
# Resource Management - Minimal since no application pods
# =============================================================================

resources:
  limits:
    cpu: "100m"
    memory: "128Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

# Disable autoscaling since no application
autoscaling:
  enabled: false
  
  # Database-only mode flags
  database_only_mode: true
  disable_message_broker: true
  disable_publisher: true
  
  # Empty exchanges for database-only mode
  exchanges: []
  topics: []
  topic_routing: {}
  
# =============================================================================
# Database and Cache Services Configuration
# =============================================================================

# Enable LOCAL PostgreSQL database
postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    postgresPassword: "local_dev_postgres_password"
    username: "dataengine_user"
    password: "local_dev_user_password"
    database: "trading_platform"
  primary:
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""  # Use default storage class
    # Install TimescaleDB extension
    initdb:
      scripts:
        init-timescaledb.sql: |
          -- Create TimescaleDB extension
          CREATE EXTENSION IF NOT EXISTS timescaledb;
          
          -- Create schemas for trading data
          CREATE SCHEMA IF NOT EXISTS market_data;
          CREATE SCHEMA IF NOT EXISTS trading;
          CREATE SCHEMA IF NOT EXISTS analytics;
          
          -- Grant permissions to dataengine_user
          GRANT ALL PRIVILEGES ON SCHEMA market_data TO dataengine_user;
          GRANT ALL PRIVILEGES ON SCHEMA trading TO dataengine_user;
          GRANT ALL PRIVILEGES ON SCHEMA analytics TO dataengine_user;

# Enable LOCAL Redis cache
redis:
  enabled: true
  auth:
    enabled: true
    password: "local_dev_redis_password"
  master:
    resources:
      limits:
        cpu: "500m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"
    persistence:
      enabled: true
      size: 10Gi
  replica:
    replicaCount: 1
    resources:
      limits:
        cpu: "250m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"

# =============================================================================
# Disable All Application Components
# =============================================================================

# Disable external services (using local embedded services)
externalDatabase:
  enabled: false

externalRedis:
  enabled: false

# Disable monitoring components for resource efficiency
grafana:
  enabled: false

prometheus:
  enabled: false

alertmanager:
  enabled: false

# Logging configuration
logging:
  level: "info"
  format: "json"
  outputs: ["stdout"]
  file_path: null
  max_file_size_mb: 100
  max_files: 5
  structured_logging: true

# =============================================================================
# Disable All Application Services
# =============================================================================

# Disable main application service
service:
  enabled: false

# Disable ingress
ingress:
  enabled: false

# Disable all monitoring components
monitoring:
  enabled: false
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Disable persistence (not needed for database-only deployment)
persistence:
  enabled: false

# =============================================================================
# Networking (Database Access Only)
# =============================================================================

# Network policy to allow database access
networkPolicy:
  enabled: true
  ingress:
    - from: []  # Allow all internal cluster traffic
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis

# =============================================================================
# Security Context (Minimal)
# =============================================================================

podSecurityContext:
  runAsNonRoot: false  # Allow postgres to run as postgres user
  fsGroup: 999  # postgres group

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# =============================================================================
# Resource Limits (Database Focus)
# =============================================================================

# No application resource limits since no application pods are deployed
# Resources are allocated to PostgreSQL and Redis components only
