# =============================================================================
# DataEngine Helm Chart Values
# High-Performance Market Data Processing System
# =============================================================================

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# =============================================================================
# Application Configuration
# =============================================================================

# Application metadata
appName: data-engine
fullnameOverride: ""
nameOverride: ""

# Image configuration
image:
  repository: dataengine  # Updated to use new optimized image
  tag: "latest"
  pullPolicy: IfNotPresent  # Changed for local development
  pullSecrets: []

# Database Migration Configuration
migration:
  enabled: true
  image:
    repository: ghcr.io/nwagbara-group-llc/databaseschema
    tag: "latest"
    pullPolicy: Always
  backoffLimit: 3
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  env: []
    # Additional environment variables for migration job
    # - name: MIGRATION_TIMEOUT
    #   value: "300"

# Deployment configuration  
replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# =============================================================================
# Resource Management
# =============================================================================

# Resource requests and limits
resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "1000m"
    memory: "2Gi"

# Node selection
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - data-engine
        topologyKey: kubernetes.io/hostname

# =============================================================================
# Networking & Service Configuration
# =============================================================================

# Service configuration
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: data-engine.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: data-engine-tls
      hosts:
        - data-engine.example.com

# Network policies
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# =============================================================================
# Persistence Configuration
# =============================================================================

# Persistent storage for data
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}
  mountPath: /data
  subPath: ""

# =============================================================================
# Health Checks & Probes
# =============================================================================

# Health check configuration
healthcheck:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    httpGet:
      path: /startup
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1

# =============================================================================
# Security Configuration
# =============================================================================

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# =============================================================================
# Configuration Management
# =============================================================================

# ConfigMap configuration
config:
  # Application configuration
  environment: "Production"
  log_level: "info"
  rust_log: "data_engine=info,hostbuilder=debug,performance=warn"
  
  # =============================================================================
  # Deployment Mode Configuration
  # =============================================================================
  
  # Database-Only Mode (disable message broker publishing)
  # Set to true for data collection without real-time distribution
  database_only_mode: false
  disable_message_broker: false
  disable_publisher: false
  
  # Performance tuning
  tokio_worker_threads: 8
  max_connections: 1000
  connection_timeout: 30
  buffer_size: 8192
  batch_size: 100
  flush_interval: "10ms"
  compression_enabled: true
  
  # Exchange configuration
  exchanges:
    - name: "Kraken"
      enabled: true
      api_url: "https://api.kraken.com"
      websocket_token: 'https://api.kraken.com/0/private/GetWebSocketsToken'
      symbols: ["BTC/USD", "ETH/USD", "BTC/EUR", "ETH/EUR"]
      depth: 100
      websockets:
        - channel: "level3"
          endpoint: "wss://ws.kraken.com"
          compression: true
          heartbeat_interval: "30s"
        - channel: "trade"
          endpoint: "wss://ws.kraken.com"
          compression: true
          heartbeat_interval: "30s"
      rate_limits:
        requests_per_second: 10
        burst_size: 20
        window_size: "60s"
      timeout: "30s"
      retry_config:
        max_attempts: 3
        initial_delay: "100ms"
        max_delay: "5s"
        backoff_multiplier: 2.0
        jitter_enabled: true
  
  # Message broker configuration  
  message_broker:
    address: "localhost"
    port: 8080
    max_connections: 1000
    buffer_size: 8192
    compression_enabled: true
    batch_size: 100
    flush_interval: "10ms"
  
  # Topics configuration
  topics:
    - "market.data.kraken"
    - "trading.orders"
    - "portfolio.updates"
  
  # Topic routing configuration for publishers
  topic_routing:
    trades: "market.data.kraken.trades"
    balances: "portfolio.updates.balances"
    balances_snapshot: "portfolio.updates.snapshots"
    level3: "market.data.kraken.level3"
    level3_snapshot: "market.data.kraken.snapshots"
    trade_snapshot: "market.data.kraken.trade_snapshots"
  
  # Database configuration (External)
  database:
    # URLs will be constructed from external database secrets
    postgres_url: ""  # Injected from secrets.database.url
    redis_url: ""     # Injected from secrets.redis.url
    max_connections: 50
    connection_timeout: "10s"
    query_timeout: "30s"
    retry_attempts: 3
    backup_enabled: false  # Managed externally
  
  # Redis configuration (External)
  redis:
    cluster_mode: false
    cluster_nodes: []
    password: ""      # Injected from secrets.redis.password
    db_index: 0
    key_prefix: "dataengine:"
    ttl_seconds: 3600
  
  # Security configuration
  security:
    api_key_required: true
    request_signing_required: true
    rate_limiting_enabled: true
    max_requests_per_minute: 1000
    blocked_ips: []
    allowed_ips: []
    encryption_enabled: true

# =============================================================================
# Performance Configuration
# =============================================================================

# Performance tuning settings
performance:
  # Performance configuration from config.yaml
  worker_threads: 8
  cpu_affinity_enabled: true
  cpu_cores: [0, 1, 2, 3, 4, 5, 6, 7]
  memory_limit_mb: 8192
  gc_threshold_mb: 1024
  metrics_enabled: true
  metrics_interval: "10s"
  simd_enabled: true
  
  # CPU affinity settings
  cpuAffinity:
    enabled: false
    cpuset: "0-3"
    
  # Memory settings
  hugepages:
    enabled: false
    size: "2Mi"
    
  # NUMA topology
  numa:
    enabled: false
    node: 0
    
  # Network optimizations
  networkOptimizations:
    enabled: false
    tcpNoDelay: true
    tcpQuickAck: true
    
  # Kernel bypass settings
  dpdk:
    enabled: false
    ports: []

# =============================================================================
# Logging Configuration
# =============================================================================

# Logging settings
logging:
  enabled: true
  level: "info"
  format: "json"
  outputs:
    - "stdout"
    - "file"
  file_path: "/var/log/dataengine/app.log"
  max_file_size_mb: 100
  max_files: 10
  structured_logging: true
  fileRotation:
    enabled: true
    maxSize: "100MB"
    maxFiles: 10

# Secret configuration
secrets:
  # Database credentials
  database:
    enabled: true  # Enable to use external database with secrets
    # Credentials injected via --set parameters at deployment time
    # Example: --set secrets.database.username=$POSTGRES_USER
    #          --set secrets.database.password=$POSTGRES_PASSWORD
    #          --set secrets.database.url=$POSTGRES_URL
    username: ""  # Injected at deployment
    password: ""  # Injected at deployment
    url: ""       # Injected at deployment
    
  # Redis credentials  
  redis:
    enabled: true  # Enable to use external redis with secrets
    # Credentials injected via --set parameters at deployment time
    # Example: --set secrets.redis.password=$REDIS_PASSWORD
    #          --set secrets.redis.url=$REDIS_URL
    password: ""  # Injected at deployment
    url: ""       # Injected at deployment
    
  # API keys
  api_keys:
    enabled: true
    # Credentials injected via --set parameters at deployment time
    # Example: --set secrets.api_keys.kraken_api_key=$KRAKEN_API_KEY
    #          --set secrets.api_keys.kraken_secret_key=$KRAKEN_SECRET_KEY
    kraken_api_key: ""     # Injected at deployment
    kraken_secret_key: ""  # Injected at deployment
    
  # TLS certificates (optional)
  tls:
    enabled: false
    cert: ""
    key: ""

# =============================================================================
# External Database Configuration (Using External PostgreSQL)
# =============================================================================

# External PostgreSQL Database
externalDatabase:
  enabled: true  # Enable external database
  host: ""       # Injected via secrets.database.url parsing
  port: 5432
  username: ""   # Injected via secrets.database.username
  database: "dataengine"
  # Password is provided via secrets.database.password
  # Connection string format: postgresql://username:password@host:port/database

# External Redis Cache
externalRedis:
  enabled: true  # Enable external Redis
  host: ""       # Injected via secrets.redis.url parsing
  port: 6379
  # Password is provided via secrets.redis.password
  # Connection string format: redis://:password@host:port

# =============================================================================
# Database Dependencies (Disabled - Using External Services)
# =============================================================================

# TimescaleDB (PostgreSQL) configuration - DISABLED for external use
postgresql:
  enabled: false  # Disabled - using external database
  # External database configuration is handled via externalDatabase section
  auth:
    postgresPassword: ""
    database: "dataengine"
    username: ""
    password: ""
  primary:
    persistence:
      enabled: false
      size: 100Gi
    resources:
      limits:
        cpu: "1000m"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "1Gi"
  metrics:
    enabled: false

# Redis configuration - DISABLED for external use
redis:
  enabled: false  # Disabled - using external Redis
  # External Redis configuration is handled via externalRedis section
  auth:
    enabled: false
    password: ""
  master:
    persistence:
      enabled: false
      size: 10Gi
    resources:
      limits:
        cpu: "500m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"
  metrics:
    enabled: false

# =============================================================================
# Monitoring & Observability
# =============================================================================

# Monitoring configuration
monitoring:
  enabled: true
  health_check_enabled: true
  health_check_interval: "30s"
  metrics_retention_days: 30
  alerting_enabled: true
  alert_thresholds:
    cpu_usage_percent: 80.0
    memory_usage_percent: 85.0
    latency_ms: 100.0
    error_rate_percent: 5.0
    connection_failures: 10
  
  # Metrics configuration
  metrics:
    enabled: false
    port: 9090
    path: /metrics
    serviceMonitor:
      enabled: false
      interval: 30s
      path: /metrics
      labels: {}

# =============================================================================
# Scaling & Performance
# =============================================================================

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80