{{- if and .Values.migration.enabled .Values.migration.runAsJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-engine.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "data-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "data-engine.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.customPostgresql.image.registry }}/{{ .Values.customPostgresql.image.repository }}:{{ .Values.customPostgresql.image.tag }}
          command:
            - sh
            - -c
            - |
              {{- if .Values.customPostgresql.enabled }}
              until pg_isready -h {{ include "data-engine.postgresql.host" . }} -p 5432 -U {{ .Values.customPostgresql.auth.username }}; do
              {{- else }}
              until pg_isready -h {{ include "data-engine.postgresql.host" . }} -p {{ .Values.externalDatabase.port }} -U {{ .Values.externalDatabase.username }}; do
              {{- end }}
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              {{- if .Values.customPostgresql.enabled }}
                {{- if .Values.customPostgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customPostgresql.auth.existingSecret }}
                  key: password
                {{- else }}
              value: {{ .Values.customPostgresql.auth.password | quote }}
                {{- end }}
              {{- else if .Values.externalDatabase.enabled }}
                {{- if .Values.externalDatabase.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: password
                {{- end }}
              {{- end }}
      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          env:
            - name: POSTGRES_HOST
              value: {{ include "data-engine.postgresql.host" . }}
            - name: POSTGRES_PORT
              {{- if .Values.customPostgresql.enabled }}
              value: "5432"
              {{- else }}
              value: {{ .Values.externalDatabase.port | quote }}
              {{- end }}
            - name: POSTGRES_DB
              {{- if .Values.customPostgresql.enabled }}
              value: {{ .Values.customPostgresql.auth.database }}
              {{- else }}
              value: {{ .Values.externalDatabase.database }}
              {{- end }}
            - name: POSTGRES_USERNAME
              {{- if .Values.customPostgresql.enabled }}
              value: {{ .Values.customPostgresql.auth.username }}
              {{- else }}
              value: {{ .Values.externalDatabase.username }}
              {{- end }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.customPostgresql.enabled }}
                {{- if .Values.customPostgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.customPostgresql.auth.existingSecret }}
                  key: password
                {{- else }}
              value: {{ .Values.customPostgresql.auth.password | quote }}
                {{- end }}
              {{- else if .Values.externalDatabase.enabled }}
                {{- if .Values.externalDatabase.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: password
                {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-engine.fullname" . }}
                  key: password
                {{- end }}
              {{- end }}
            # Build DATABASE_URL using Helm templating for reliability
            - name: DATABASE_URL
              {{- if .Values.customPostgresql.enabled }}
              value: "postgres://{{ .Values.customPostgresql.auth.username }}:{{ .Values.customPostgresql.auth.password }}@{{ include "data-engine.postgresql.host" . }}:5432/{{ .Values.customPostgresql.auth.database }}"
              {{- else if .Values.externalDatabase.enabled }}
              value: "postgres://{{ .Values.externalDatabase.username }}:{{ .Values.secrets.database.password }}@{{ .Values.externalDatabase.host }}:{{ .Values.externalDatabase.port }}/{{ .Values.externalDatabase.database }}"
              {{- end }}
            {{- with .Values.migration.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
