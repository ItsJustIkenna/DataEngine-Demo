{{- if .Values.customPostgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-engine.fullname" . }}-postgresql-primary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "data-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "data-engine.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "data-engine.fullname" . }}-postgresql-primary
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "data-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.customPostgresql.image.registry }}/{{ .Values.customPostgresql.image.repository }}:{{ .Values.customPostgresql.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: POSTGRES_USER
              value: {{ .Values.customPostgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.customPostgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.customPostgresql.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- with .Values.customPostgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.customPostgresql.persistence.size }}
{{- end }}
