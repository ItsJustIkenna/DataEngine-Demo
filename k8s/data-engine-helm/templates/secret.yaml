apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-engine.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.database.username }}
  POSTGRES_USER: {{ .Values.secrets.database.username | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.password }}
  POSTGRES_PASSWORD: {{ .Values.secrets.database.password | b64enc | quote }}
  {{- end }}
  {{/* REDIS_PASSWORD removed - no longer using Redis */}}
  {{- if and .Values.secrets.api_keys .Values.secrets.api_keys.kraken_api_key }}
  KRAKEN_API_KEY: {{ .Values.secrets.api_keys.kraken_api_key | b64enc | quote }}
  {{- end }}
  {{- if and .Values.secrets.api_keys .Values.secrets.api_keys.kraken_secret_key }}
  KRAKEN_SECRET_KEY: {{ .Values.secrets.api_keys.kraken_secret_key | b64enc | quote }}
  {{- end }}
  {{- if and .Values.secrets.elasticsearch .Values.secrets.elasticsearch.endpoint }}
  ELASTIC_CLOUD_ENDPOINT: {{ .Values.secrets.elasticsearch.endpoint | b64enc | quote }}
  {{- end }}
  {{- if and .Values.secrets.elasticsearch .Values.secrets.elasticsearch.username }}
  ELASTIC_CLOUD_USERNAME: {{ .Values.secrets.elasticsearch.username | b64enc | quote }}
  {{- end }}
  {{- if and .Values.secrets.elasticsearch .Values.secrets.elasticsearch.password }}
  ELASTIC_CLOUD_PASSWORD: {{ .Values.secrets.elasticsearch.password | b64enc | quote }}
  {{- end }}

{{- /* External database secret - only emit separator and resource when condition is true */}}
{{- if and .Values.secrets.database.enabled (or .Values.secrets.database.password .Values.secrets.database.url) }}
---
# External database secret (consolidated with main secret)
# This secret is no longer created separately - use main secret instead
{{- if false }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-engine.fullname" . }}-database
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.database.url }}
  url: {{ .Values.secrets.database.url | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.password }}
  password: {{ .Values.secrets.database.password | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}

{{- /* TLS secret - only emit separator and resource when cert and key are set */}}
{{- if and .Values.secrets.tls.cert .Values.secrets.tls.key }}
---
# TLS secret for HTTPS
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-engine.fullname" . }}-tls
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.secrets.tls.cert | b64enc | quote }}
  tls.key: {{ .Values.secrets.tls.key | b64enc | quote }}
{{- end }}