{{- if .Values.customRedis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-engine.redis.fullname" . }}-master
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    {{- include "data-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "data-engine.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "data-engine.redis.fullname" . }}-master
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "data-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.customRedis.image.registry }}/{{ .Values.customRedis.image.repository }}:{{ .Values.customRedis.image.tag }}"
          imagePullPolicy: Always
          command:
            - redis-server
          {{- if .Values.customRedis.auth.enabled }}
            - --requirepass
            - {{ .Values.customRedis.auth.password | quote }}
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.customRedis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.customRedis.persistence.size }}
{{- end }}
