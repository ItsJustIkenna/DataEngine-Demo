---
# PostgreSQL StatefulSet - Plain Kubernetes YAML
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: dataengine
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: dataengine
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgres
        image: ghcr.io/baosystems/postgis:15-3.3
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: "dataengine"
        - name: POSTGRES_PASSWORD
          value: "dataengine123"  # Use secret in production
        - name: POSTGRES_DB
          value: "dataengine"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      imagePullSecrets:
      - name: ghcr-secret
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
