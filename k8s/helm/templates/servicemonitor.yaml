{{- if and .Values.monitoring.metrics.enabled .Values.monitoring.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "data-engine.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "data-engine.labels" . | nindent 4 }}
    {{- with .Values.monitoring.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "data-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
  - port: metrics
    path: {{ .Values.monitoring.metrics.path }}
    interval: {{ .Values.monitoring.metrics.serviceMonitor.interval }}
    {{- if .Values.monitoring.metrics.serviceMonitor.scrapeTimeout }}
    scrapeTimeout: {{ .Values.monitoring.metrics.serviceMonitor.scrapeTimeout }}
    {{- end }}
    {{- if .Values.monitoring.metrics.serviceMonitor.honorLabels }}
    honorLabels: {{ .Values.monitoring.metrics.serviceMonitor.honorLabels }}
    {{- end }}
    {{- if .Values.monitoring.metrics.serviceMonitor.relabelings }}
    relabelings:
      {{- toYaml .Values.monitoring.metrics.serviceMonitor.relabelings | nindent 6 }}
    {{- end }}
    {{- if .Values.monitoring.metrics.serviceMonitor.metricRelabelings }}
    metricRelabelings:
      {{- toYaml .Values.monitoring.metrics.serviceMonitor.metricRelabelings | nindent 6 }}
    {{- end }}
{{- end }}
