# QA/Staging Environment Configuration
# Production-like but with reduced resources

# Moderate availability setup
replicaCount: 2

# QA-appropriate resources
resources:
  limits:
    cpu: "1000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

# Limited autoscaling for QA
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# QA database configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "qa123"
    database: "dataengine_qa"
    username: "dataengine_qa"
    password: "qa123"
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      limits:
        cpu: "500m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"

# QA Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "qa123"
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: "250m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"

# QA configuration
config:
  log_level: "debug"
  rust_log: "data_engine=debug,hostbuilder=info,performance=warn"
  tokio_worker_threads: 6
  max_connections: 500
  
  exchanges:
    - name: "Kraken"
      websocket_token: 'https://api.kraken.com/0/private/GetWebSocketsToken'
      symbols: ["BTC/USD", "ETH/USD"]  # Limited symbols for QA
      depth: 100
      websockets:
        - channel: "level3"
          endpoint: "wss://ws.kraken.com"

# QA monitoring  
monitoring:
  enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Production-like security but slightly relaxed for testing
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Enable network policies but allow more access for testing
networkPolicy:
  enabled: true

# QA ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: data-engine-qa.internal.com
      paths:
        - path: /
          pathType: Prefix

# Health checks optimized for testing
healthcheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 20

# Pod disruption budget for basic availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1