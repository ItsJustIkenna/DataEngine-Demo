# Production Environment Configuration
# High availability and performance optimized

# High availability setup
replicaCount: 3

# Production-grade resources
resources:
  limits:
    cpu: "4000m"
    memory: "8Gi"
  requests:
    cpu: "2000m"
    memory: "4Gi"

# Enable autoscaling for production load
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

# Production configuration
config:
  log_level: "info"
  rust_log: "data_engine=info,hostbuilder=warn,performance=warn"
  tokio_worker_threads: 16
  max_connections: 2000

# Production monitoring
monitoring:
  enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Strict security for production
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Enable network policies for production security
networkPolicy:
  enabled: true

# Pod disruption budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2