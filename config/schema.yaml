# DataEngine Configuration Schema
# This file defines the structure and validation rules for the configuration

# Application Configuration Schema
schema_version: "1.0.0"

# Environment settings
environment:
  type: string
  enum: ["Development", "Staging", "Production"]
  default: "Development"
  description: "Application environment"

# Exchange configuration schema
exchanges:
  type: array
  items:
    type: object
    required: ["name", "enabled", "symbols"]
    properties:
      name:
        type: string
        description: "Exchange name"
      enabled:
        type: boolean
        default: true
        description: "Whether the exchange is enabled"
      symbols:
        type: array
        items:
          type: string
          pattern: "^[A-Z]+/[A-Z]+$"
        minItems: 1
        description: "Trading pairs to monitor"
      depth:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
        description: "Order book depth"
      websocket_token:
        type: string
        format: uri
        description: "WebSocket token endpoint"
      websockets:
        type: array
        items:
          type: object
          required: ["channel", "endpoint"]
          properties:
            channel:
              type: string
              enum: ["level3", "trade", "ticker", "ohlc"]
            endpoint:
              type: string
              format: uri
            compression:
              type: boolean
              default: false
            heartbeat_interval:
              type: string
              pattern: "^[0-9]+[smh]$"
              default: "30s"
      rate_limits:
        type: object
        properties:
          requests_per_second:
            type: integer
            minimum: 1
            default: 10
          burst_size:
            type: integer
            minimum: 1
            default: 20
          window_size:
            type: string
            pattern: "^[0-9]+[smh]$"
            default: "60s"
      timeout:
        type: string
        pattern: "^[0-9]+[smh]$"
        default: "30s"
      retry_config:
        type: object
        properties:
          max_attempts:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
          initial_delay:
            type: string
            pattern: "^[0-9]+ms$"
            default: "100ms"
          max_delay:
            type: string
            pattern: "^[0-9]+[smh]$"
            default: "5s"
          backoff_multiplier:
            type: number
            minimum: 1.0
            maximum: 10.0
            default: 2.0
          jitter_enabled:
            type: boolean
            default: true

# Message broker configuration schema
message_broker:
  type: object
  required: ["address", "port"]
  properties:
    address:
      type: string
      default: "localhost"
    port:
      type: integer
      minimum: 1
      maximum: 65535
      default: 8080
    max_connections:
      type: integer
      minimum: 1
      default: 1000
    buffer_size:
      type: integer
      minimum: 1024
      default: 8192
    compression_enabled:
      type: boolean
      default: true
    batch_size:
      type: integer
      minimum: 1
      default: 100
    flush_interval:
      type: string
      pattern: "^[0-9]+ms$"
      default: "10ms"

# Database configuration schema
database:
  type: object
  properties:
    postgres_url:
      type: string
      format: uri
      default: "postgresql://localhost:5432/trading"
    redis_url:
      type: string
      format: uri
      default: "redis://localhost:6379"
    max_connections:
      type: integer
      minimum: 1
      default: 50
    connection_timeout:
      type: string
      pattern: "^[0-9]+[smh]$"
      default: "10s"
    query_timeout:
      type: string
      pattern: "^[0-9]+[smh]$"
      default: "30s"
    retry_attempts:
      type: integer
      minimum: 0
      default: 3
    backup_enabled:
      type: boolean
      default: true

# Performance configuration schema
performance:
  type: object
  properties:
    worker_threads:
      type: integer
      minimum: 1
      maximum: 256
      default: 8
    cpu_affinity_enabled:
      type: boolean
      default: false
    cpu_cores:
      type: array
      items:
        type: integer
        minimum: 0
      default: [0, 1, 2, 3, 4, 5, 6, 7]
    memory_limit_mb:
      type: integer
      minimum: 512
      default: 8192
    gc_threshold_mb:
      type: integer
      minimum: 64
      default: 1024
    metrics_enabled:
      type: boolean
      default: true
    metrics_interval:
      type: string
      pattern: "^[0-9]+[smh]$"
      default: "10s"
    simd_enabled:
      type: boolean
      default: true

# Security configuration schema
security:
  type: object
  properties:
    api_key_required:
      type: boolean
      default: true
    request_signing_required:
      type: boolean
      default: true
    rate_limiting_enabled:
      type: boolean
      default: true
    max_requests_per_minute:
      type: integer
      minimum: 1
      default: 1000
    blocked_ips:
      type: array
      items:
        type: string
        format: ipv4
      default: []
    allowed_ips:
      type: array
      items:
        type: string
        format: ipv4
      default: []
    encryption_enabled:
      type: boolean
      default: true

# Monitoring configuration schema
monitoring:
  type: object
  properties:
    health_check_enabled:
      type: boolean
      default: true
    health_check_interval:
      type: string
      pattern: "^[0-9]+[smh]$"
      default: "30s"
    metrics_retention_days:
      type: integer
      minimum: 1
      default: 30
    alerting_enabled:
      type: boolean
      default: true
    alert_thresholds:
      type: object
      properties:
        cpu_usage_percent:
          type: number
          minimum: 0
          maximum: 100
          default: 80.0
        memory_usage_percent:
          type: number
          minimum: 0
          maximum: 100
          default: 85.0
        latency_ms:
          type: number
          minimum: 0
          default: 100.0
        error_rate_percent:
          type: number
          minimum: 0
          maximum: 100
          default: 5.0
        connection_failures:
          type: integer
          minimum: 0
          default: 10

# Logging configuration schema
logging:
  type: object
  properties:
    level:
      type: string
      enum: ["trace", "debug", "info", "warn", "error", "critical"]
      default: "info"
    format:
      type: string
      enum: ["json", "plain", "structured"]
      default: "json"
    output:
      type: array
      items:
        type: string
        enum: ["stdout", "file", "syslog"]
      default: ["stdout", "file"]
    file_path:
      type: string
      default: "/var/log/dataengine/app.log"
    max_file_size_mb:
      type: integer
      minimum: 1
      default: 100
    max_files:
      type: integer
      minimum: 1
      default: 10
    structured_logging:
      type: boolean
      default: true
