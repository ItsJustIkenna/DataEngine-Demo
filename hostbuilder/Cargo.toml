[package]
name = "hostbuilder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
async-trait = "0.1.80"
base64 = "0.22.1"
bigdecimal = { version = "0.4.5", features = ["serde"] }
config = { path = "../config" }
chrono = { version = "0.4.19", features = ["serde"] }
databaseschema = { path = "../../databaseschema" }
deadpool = "0.12.1"
deadpool-redis = { version = "0.15.1", features = ["serde"] }
diesel = { version = "2.2.2", features = ["chrono", "uuid", "numeric"] }
diesel-async = { version = "0.5.0", features = ["deadpool", "postgres"] }
dotenv = "0.15.0"
futures-util = "0.3.30"
hmac = "0.12.1"
mockall = "0.12.1"
performance = { path = "../performance" }
publisher = { path = "../../MessageBrokerEngine/publisher" }
protocol = { path = "../../MessageBrokerEngine/protocol" }
redis = { version = "0.25.4", features = ["tokio-native-tls-comp"] }
redis_utils = { path = "../../redisutils" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10.8"
tokio = { version = "1.38.0", features = ["full"] }
tokio-retry = "0.3.0"
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5.2"
uuid = { version = "1.10.0", features = ["serde", "v4"] }
serde_yaml = "0.9.34"
# High-performance additions
simd-json = "0.13"
ahash = "0.8"
smallvec = { version = "1.11", features = ["serde"] }
dashmap = "5.5"
socket2 = "0.5"
# Ultra-high performance allocator
mimalloc = { version = "0.1", default-features = false }
# Lock-free data structures
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
# SIMD optimizations
wide = "0.7"
# Zero-copy serialization
rkyv = "0.7"
# CPU cache optimization
cache-padded = "1.3"
# High-performance collections
heapless = "0.8"
# Fast random number generation
fastrand = "2.0"
# CPU affinity and thread management
num_cpus = "1.16"
# Lock-free synchronization
parking_lot = "0.12"
# Global static initialization
once_cell = "1.19"
# Error handling enhancements
thiserror = "1.0"
# API server dependencies
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "winnt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
io-uring = "0.6"

[build-dependencies]
prost-build = "0.13.1"
