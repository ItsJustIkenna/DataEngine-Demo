name: DataEngine CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_deploy:
        description: 'Clean deploy (delete all resources first)'
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/data-engine
  NAMESPACE: data-engine

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows, x64]
    
    steps:
      # === CHECKOUT ===
      - name: Checkout repositories
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          path: MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # === BUILD ===
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f DataEngine/Dockerfile .
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # === DEPLOY ===
      - name: Clean deploy (optional)
        if: github.event.inputs.clean_deploy == 'true'
        run: |
          kubectl delete namespace ${{ env.NAMESPACE }} --ignore-not-found
          Start-Sleep -Seconds 30

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          kubectl create secret generic database-credentials --from-literal=password=$env:POSTGRES_PASSWORD -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic redis-credentials --from-literal=password=$env:REDIS_PASSWORD -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret --docker-server=ghcr.io --docker-username=${{ github.actor }} --docker-password=${{ secrets.PERSONAL_ACCESS_TOKEN }} -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f DataEngine/k8s/simple/postgresql.yaml
          kubectl wait --for=condition=ready pod -l app=postgresql -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Deploy Redis
        run: |
          kubectl apply -f DataEngine/k8s/simple/redis.yaml
          kubectl wait --for=condition=ready pod -l app=redis -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Run migrations
        run: |
          kubectl delete job database-migrations -n ${{ env.NAMESPACE }} --ignore-not-found
          Start-Sleep -Seconds 2
          kubectl apply -f DataEngine/k8s/simple/migrations.yaml
          kubectl wait --for=condition=complete job/database-migrations -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Deploy DataEngine
        run: |
          kubectl apply -f DataEngine/k8s/simple/dataengine.yaml
          kubectl wait --for=condition=ready pod -l app=dataengine -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Show status
        if: success()
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
