name: CI/CD - Build and Deploy DataEngine

# Trigger: Automatic on push, optional manual trigger with clean deploy option
on:
  push:
    branches: [main]
    paths:
      - 'DataEngine/**'
      - 'databaseschema/**'
      - 'redisutils/**'
      - 'LoggingEngine/**'
      - 'MessageBrokerEngine/publisher/**'
      - 'MessageBrokerEngine/protocol/**'
env:
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/dataengine
  NAMESPACE: dataengine

jobs:
  build-and-deploy:
    name: Build Image and Deploy to Kubernetes
    runs-on: [self-hosted, windows, x64]
    
    steps:
      # ============================================================================
      # PHASE 1: BUILD - Create and push Docker image
      # ============================================================================
      
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine
          clean: true

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        shell: powershell
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          
          Write-Host "Building DataEngine Docker image..." -ForegroundColor Cyan
          Write-Host "Build context: TradingPlatform root (required for dependencies)" -ForegroundColor Gray
          
          # Build from repository root (not DataEngine folder)
          # Dockerfile needs access to: databaseschema, redisutils, LoggingEngine, MessageBrokerEngine
          docker build `
            -f DataEngine/Dockerfile `
            -t ${env:IMAGE_NAME}:latest `
            -t ${env:IMAGE_NAME}:sha-$shortSha `
            .
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Docker build failed" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "SUCCESS: Build successful" -ForegroundColor Green

      - name: Push Image to GHCR
        shell: powershell
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          
          Write-Host "Pushing images to GHCR..." -ForegroundColor Cyan
          docker push ${env:IMAGE_NAME}:latest
          docker push ${env:IMAGE_NAME}:sha-$shortSha
          
          Write-Host "SUCCESS: Images pushed" -ForegroundColor Green
          Write-Host "   - ${env:IMAGE_NAME}:latest" -ForegroundColor White
          Write-Host "   - ${env:IMAGE_NAME}:sha-$shortSha" -ForegroundColor White

      # ============================================================================
      # PHASE 2: PREPARE - Set up Kubernetes environment
      # ============================================================================

      - name: Clean Deploy (Optional)
        if: github.event.inputs.clean_deploy == 'true'
        shell: powershell
        run: |
          Write-Host "CLEAN DEPLOY: Deleting all resources..." -ForegroundColor Yellow
          kubectl delete namespace ${env:NAMESPACE} --ignore-not-found=true
          
          Write-Host "Waiting for namespace deletion..." -ForegroundColor Yellow
          $timeout = 180
          $elapsed = 0
          while ((kubectl get namespace ${env:NAMESPACE} 2>$null) -and ($elapsed -lt $timeout)) {
            Start-Sleep -Seconds 5
            $elapsed += 5
            Write-Host "   Waiting... ($elapsed seconds)" -ForegroundColor Gray
          }
          
          Write-Host "SUCCESS: Clean slate ready" -ForegroundColor Green

      - name: Create Namespace
        shell: powershell
        run: |
          kubectl create namespace ${env:NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          Write-Host "SUCCESS: Namespace ready - ${env:NAMESPACE}" -ForegroundColor Green

      - name: Create Secrets
        shell: powershell
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'dataengine123' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || 'redis123' }}
        run: |
          Write-Host "Creating secrets..." -ForegroundColor Cyan
          
          # Database credentials
          kubectl create secret generic database-credentials `
            --from-literal=password=${env:POSTGRES_PASSWORD} `
            --namespace ${env:NAMESPACE} `
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Redis credentials
          kubectl create secret generic redis-credentials `
            --from-literal=password=${env:REDIS_PASSWORD} `
            --namespace ${env:NAMESPACE} `
            --dry-run=client -o yaml | kubectl apply -f -
          
          # GHCR image pull secret
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username=${{ github.actor }} `
            --docker-password=${{ secrets.PERSONAL_ACCESS_TOKEN }} `
            --namespace ${env:NAMESPACE} `
            --dry-run=client -o yaml | kubectl apply -f -
          
          Write-Host "SUCCESS: Secrets created" -ForegroundColor Green

      # ============================================================================
      # PHASE 3: INFRASTRUCTURE - Deploy PostgreSQL and Redis
      # ============================================================================

      - name: Deploy PostgreSQL
        shell: powershell
        run: |
          Write-Host "Deploying PostgreSQL..." -ForegroundColor Cyan
          kubectl apply -f DataEngine/k8s/simple/postgresql.yaml
          
          Write-Host "Waiting for PostgreSQL to be ready..." -ForegroundColor Yellow
          kubectl wait --for=condition=ready pod -l app=postgresql -n ${env:NAMESPACE} --timeout=300s
          
          Write-Host "SUCCESS: PostgreSQL is ready" -ForegroundColor Green

      - name: Deploy Redis
        shell: powershell
        run: |
          Write-Host "Deploying Redis..." -ForegroundColor Cyan
          kubectl apply -f DataEngine/k8s/simple/redis.yaml
          
          Write-Host "Waiting for Redis to be ready..." -ForegroundColor Yellow
          kubectl wait --for=condition=ready pod -l app=redis -n ${env:NAMESPACE} --timeout=300s
          
          Write-Host "SUCCESS: Redis is ready" -ForegroundColor Green

      # ============================================================================
      # PHASE 4: DATABASE - Run migrations
      # ============================================================================

      - name: Run Database Migrations
        shell: powershell
        run: |
          Write-Host "Running database migrations..." -ForegroundColor Cyan
          
          # Delete old migration job if it exists
          kubectl delete job database-migrations -n ${env:NAMESPACE} --ignore-not-found=true
          Start-Sleep -Seconds 2
          
          # Apply new migration job
          kubectl apply -f DataEngine/k8s/simple/migrations.yaml
          
          Write-Host "Waiting for migrations to complete..." -ForegroundColor Yellow
          kubectl wait --for=condition=complete job/database-migrations -n ${env:NAMESPACE} --timeout=300s
          
          # Show migration logs
          Write-Host "`nMigration logs:" -ForegroundColor Cyan
          kubectl logs job/database-migrations -n ${env:NAMESPACE}
          
          Write-Host "`nSUCCESS: Migrations completed" -ForegroundColor Green

      # ============================================================================
      # PHASE 5: APPLICATION - Deploy DataEngine
      # ============================================================================

      - name: Deploy DataEngine
        shell: powershell
        run: |
          Write-Host "Deploying DataEngine..." -ForegroundColor Cyan
          kubectl apply -f DataEngine/k8s/simple/dataengine.yaml
          
          Write-Host "Waiting for DataEngine pods to be ready..." -ForegroundColor Yellow
          kubectl wait --for=condition=ready pod -l app=dataengine -n ${env:NAMESPACE} --timeout=300s
          
          Write-Host "SUCCESS: DataEngine deployed" -ForegroundColor Green

      # ============================================================================
      # PHASE 6: VERIFY - Check deployment status
      # ============================================================================

      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "`n" -NoNewline
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "   DataEngine Deployment Status" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          
          Write-Host "`nPods:" -ForegroundColor Yellow
          kubectl get pods -n ${env:NAMESPACE} -o wide
          
          Write-Host "`nServices:" -ForegroundColor Yellow
          kubectl get services -n ${env:NAMESPACE}
          
          Write-Host "`nStatefulSets:" -ForegroundColor Yellow
          kubectl get statefulsets -n ${env:NAMESPACE}
          
          Write-Host "`nDeployments:" -ForegroundColor Yellow
          kubectl get deployments -n ${env:NAMESPACE}
          
          Write-Host "`nSUCCESS: Deployment Complete!" -ForegroundColor Green
          Write-Host "   Access DataEngine: kubectl port-forward -n ${env:NAMESPACE} svc/dataengine 8080:8080" -ForegroundColor Cyan
          Write-Host "   View logs: kubectl logs -f deployment/dataengine -n ${env:NAMESPACE}" -ForegroundColor Cyan

      - name: Show Recent Logs
        if: success()
        shell: powershell
        run: |
          Write-Host "`nRecent DataEngine logs:" -ForegroundColor Cyan
          kubectl logs -n ${env:NAMESPACE} deployment/dataengine --tail=50
