name: DataEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_deploy:
        description: 'Clean deploy (delete all resources first)'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      environment:
        description: 'Target environment'
        type: choice
        options: ['development', 'staging', 'production', 'database-only']
        default: 'development'

# Prevent concurrent deployments per environment
concurrency:
  group: dataengine-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

# Grant minimal required permissions
permissions:
  contents: read
  packages: write
  security-events: write  # For security scan results

env:
  # Core configuration
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/dataengine
  NAMESPACE: dataengine
  HELM_CHART_PATH: k8s/data-engine-helm
  
  # Deployment configuration  
  HELM_TIMEOUT: 10m
  HEALTH_CHECK_TIMEOUT: 300s
  ROLLBACK_TIMEOUT: 5m
  
  # Performance optimization
  PARALLEL_JOBS: 3
  DOCKER_BUILDKIT: 1
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # ===== VALIDATION & TESTING (Parallel) =====
  validate:
    name: Validate & Test
    runs-on: [self-hosted, windows, x64]
    outputs:
      helm-valid: ${{ steps.helm-check.outputs.valid }}
      tests-passed: ${{ steps.test-check.outputs.passed }}
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine
          fetch-depth: 0  # Full history for better caching

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema
          fetch-depth: 0  # Get full history to ensure all files are available

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          path: MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Validate Helm Chart
        id: helm-check
        run: |
          Write-Host "Validating Helm chart..."
          
          helm lint ${{ env.HELM_CHART_PATH }} --strict --quiet
          
          if ($LASTEXITCODE -eq 0) {
            echo "valid=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] Helm chart validation passed"
          } else {
            echo "valid=false" >> $env:GITHUB_OUTPUT
            Write-Error "[FAIL] Helm chart validation failed"
            exit 1
          }

      - name: Run Rust Tests
        id: test-check
        if: github.event.inputs.skip_tests != 'true'
        run: |
          Write-Host "Running Rust tests..."
          cd DataEngine
          
          # Parallel test execution with optimized flags
          cargo test --workspace --all-features --jobs ${{ env.PARALLEL_JOBS }} --quiet
          
          if ($LASTEXITCODE -eq 0) {
            echo "passed=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] All tests passed"
          } else {
            echo "passed=false" >> $env:GITHUB_OUTPUT
            Write-Error "[FAIL] Tests failed"
            exit 1
          }

  # ===== BUILD & SECURITY (Parallel) =====
  build:
    name: Build & Push
    runs-on: [self-hosted, windows, x64]
    needs: validate
    if: needs.validate.outputs.helm-valid == 'true' && (needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true')
    outputs:
      image-exists: ${{ steps.image-check.outputs.exists }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema
          fetch-depth: 0  # Get full history to ensure all files are available

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          path: MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Check Image Cache
        id: image-check
        run: |
          Write-Host "Checking if image exists..."
          
          $imageTag = "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          # Try to pull the image (more reliable than manifest inspect)
          $ErrorActionPreference = 'SilentlyContinue'
          docker pull $imageTag 2>&1 | Out-Null
          $pullResult = $LASTEXITCODE
          
          if ($pullResult -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] Image cache hit: $imageTag"
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "[INFO] Image cache miss, will build: $imageTag"
          }
          
          # Always exit successfully regardless of pull result
          exit 0

      - name: Build & Push Image
        id: build-push
        if: steps.image-check.outputs.exists != 'true'
        run: |
          Write-Host "Building Docker image..."
          $startTime = Get-Date
          
          # Optimized Docker build with BuildKit
          $env:DOCKER_BUILDKIT = 1
          
          # ENTERPRISE BUILD STRATEGY
          # Ensure consistent workspace structure for both local and CI/CD builds
          Write-Host "[ARCH] Setting up enterprise build environment..."
          
          # DEBUG: Verify current working directory and structure
          Write-Host "[DEBUG] Current working directory: $(Get-Location)"
          Write-Host "[DEBUG] Available items in current directory:"
          Get-ChildItem | ForEach-Object { Write-Host "  - $($_.Name) ($($_.GetType().Name))" }
          
          # 1. Verify all required dependencies are present
          $requiredDeps = @("databaseschema", "redisutils", "LoggingEngine", "MessageBrokerEngine")
          foreach ($dep in $requiredDeps) {
            if (Test-Path $dep) {
              Write-Host "[OK] Dependency found: $dep"
            } else {
              Write-Host "[MISSING] MISSING DEPENDENCY: $dep - Build will fail!"
              exit 1
            }
          }
          
          # 2. Deploy enterprise .dockerignore for consistent build context
          Write-Host "[SETUP] Deploying enterprise .dockerignore..."
          # .dockerignore is already at the current directory level
          Write-Host "[OK] Enterprise .dockerignore already present in build context root"
          
          # 3. Validate critical backtest_result files before build
          Write-Host "[VALIDATE] Checking critical business logic files..."
          $criticalFiles = @(
            "databaseschema\src\models\backtest_result.rs",
            "databaseschema\src\ops\backtest_result_ops.rs"
          )
          
          $allFilesPresent = $true
          foreach ($file in $criticalFiles) {
            if (Test-Path $file) {
              Write-Host "[OK] Critical file found: $file"
            } else {
              Write-Host "[MISSING] MISSING CRITICAL FILE: $file" -ForegroundColor Red
              $allFilesPresent = $false
            }
          }
          
          if (-not $allFilesPresent) {
            Write-Error "[FAIL] Critical business logic files missing - cannot proceed with build"
            exit 1
          }
          
          # 4. Execute enterprise Docker build with comprehensive logging
          Write-Host "[BUILD] Starting enterprise Docker build..." -ForegroundColor Green
          $buildStartTime = Get-Date
          
          # Ensure we're in the repository root (where all dependencies are checked out)
          Write-Host "[DEBUG] Current working directory: $(Get-Location)"
          Write-Host "[DEBUG] Available directories in current location:"
          Get-ChildItem -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          # Set optimal Docker BuildKit configuration
          $env:DOCKER_BUILDKIT = 1
          $env:BUILDKIT_PROGRESS = "plain"
          
          # Execute build with enterprise error handling
          try {
            docker build `
              --tag ${{ env.IMAGE_NAME }}:latest `
              --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} `
              --file Dockerfile `
              --build-arg BUILDKIT_INLINE_CACHE=1 `
              --cache-from ${{ env.IMAGE_NAME }}:latest `
              --progress=plain `
              .
              
            if ($LASTEXITCODE -ne 0) {
              throw "Docker build failed with exit code $LASTEXITCODE"
            }
            
            $buildDuration = (Get-Date) - $buildStartTime
            $durationMinutes = [math]::Round($buildDuration.TotalMinutes, 1)
            Write-Host "[OK] Enterprise Docker build completed successfully in $durationMinutes minutes" -ForegroundColor Green
            
          } catch {
            Write-Host "[FAIL] Enterprise Docker build failed!" -ForegroundColor Red
            Write-Host "[DEBUG] Build context analysis:" -ForegroundColor Yellow
            Write-Host "Working directory: $(Get-Location)"
            Write-Host "Available directories:" 
            Get-ChildItem -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
            Write-Host "Critical files check:"
            foreach ($file in $criticalFiles) {
              if (Test-Path $file) {
                Write-Host "  OK $file" -ForegroundColor Green
              } else {
                Write-Host "  MISSING $file" -ForegroundColor Red
              }
            }
            throw $_
          }
          
          # Push images to registry with enterprise logging
          Write-Host "[PUSH] Pushing images to registry..." -ForegroundColor Cyan
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Get image digest for security
          $digest = docker inspect ${{ env.IMAGE_NAME }}:${{ github.sha }} --format="{{index .RepoDigests 0}}"
          echo "digest=$digest" >> $env:GITHUB_OUTPUT
          
          $duration = (Get-Date) - $startTime
          $durationMinutes = [math]::Round($duration.TotalMinutes, 1)
          Write-Host "[OK] Build completed in $durationMinutes minutes"

      - name: Tag Existing Image
        if: steps.image-check.outputs.exists == 'true'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
          Write-Host "[OK] Tagged existing image as latest"

  security:
    name: Security Scan
    runs-on: [self-hosted, windows, x64]
    needs: build
    if: needs.build.outputs.image-exists != 'true'
    steps:
      - name: Trivy Security Scan
        run: |
          Write-Host "Running security scan..."
          
          # Install/update Trivy if needed
          if (-not (Get-Command trivy -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Trivy..."
            $trivyVersion = "0.55.0"
            $url = "https://github.com/aquasecurity/trivy/releases/download/v$trivyVersion/trivy_${trivyVersion}_Windows-64bit.zip"
            Invoke-WebRequest -Uri $url -OutFile trivy.zip -UseBasicParsing
            Expand-Archive trivy.zip -Force
            Move-Item trivy/trivy.exe . -Force
            Remove-Item trivy.zip, trivy -Recurse -Force
          }
          
          # Run comprehensive scan
          .\trivy.exe image `
            --severity HIGH,CRITICAL `
            --format sarif `
            --output trivy-results.sarif `
            --no-progress `
            --quiet `
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Upload results to GitHub Security
          if (Test-Path trivy-results.sarif) {
            Write-Host "[INFO] Security scan completed - results available"
          }
          
          Write-Host "[OK] Security scan completed"

  # ===== DEPLOYMENT (Production) =====  
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, windows, x64]
    needs: [validate, build, security]
    if: github.event_name != 'pull_request' && (needs.security.result == 'success' || needs.security.result == 'skipped')
    environment: 
      name: ${{ github.event.inputs.environment || 'development' }}
      url: https://dataengine.${{ github.event.inputs.environment || 'development' }}.yourdomain.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Secrets (Optimized)
        id: secrets
        run: |
          Write-Host "Fetching secrets from Azure Key Vault..."
          
          # Authenticate once with robust JSON parsing
          try {
            # Use environment variable to avoid GitHub secret masking issues
            $env:AZURE_CREDS = '${{ secrets.AZURE_CREDENTIALS }}'
            $creds = $env:AZURE_CREDS | ConvertFrom-Json
            
            if (-not $creds.clientId -or -not $creds.clientSecret -or -not $creds.tenantId) {
              throw "Invalid Azure credentials format. Missing required fields."
            }
          } catch {
            Write-Error "Failed to parse Azure credentials JSON: $_"
            Write-Error "Please ensure AZURE_CREDENTIALS secret contains valid JSON with clientId, clientSecret, and tenantId"
            exit 1
          }
          
          # Authenticate with Azure CLI with comprehensive error handling
          try {
            Write-Host "[INFO] Attempting Azure CLI login..."
            
            $loginResult = az login --service-principal `
              --username $creds.clientId `
              --password $creds.clientSecret `
              --tenant $creds.tenantId `
              --output json 2>&1
            
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Azure CLI login output: $loginResult"
              throw "Azure CLI login failed with exit code $LASTEXITCODE"
            }
            
            Write-Host "[OK] Successfully authenticated with Azure"
          } catch {
            Write-Error "Azure authentication failed: $_"
            Write-Error "Please verify AZURE_CREDENTIALS secret and Azure CLI installation"
            exit 1
          }
          
          # Batch secret fetching (optimized but sequential for reliability)
          $secretNames = @(
            "POSTGRES-HOST", "POSTGRES-PORT", "POSTGRES-USER", "POSTGRES-PASSWORD", "POSTGRES-DB",
            "REDIS-HOST", "REDIS-PORT", "REDIS-PASSWORD", 
            "KRAKEN-API-KEY", "KRAKEN-SECRET-KEY"
          )
          
          Write-Host "[INFO] Fetching $($secretNames.Count) secrets from Key Vault..."
          
          foreach ($secretName in $secretNames) {
            try {
              $envName = $secretName -replace "-", "_"
              Write-Host "[INFO] Fetching secret: $secretName"
              
              $value = az keyvault secret show --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" --name $secretName --query value -o tsv 2>&1
              
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Azure Key Vault error for secret $secretName : $value"
                throw "Failed to fetch secret $secretName from Key Vault"
              }
              
              if ($value -and $value -ne "null" -and $value.Trim() -ne "") {
                # Ensure no problematic characters in environment variable assignment
                $cleanValue = $value.Trim()
                Add-Content -Path $env:GITHUB_ENV -Value "$envName=$cleanValue"
                Write-Host "[OK] Successfully fetched $envName"
              } else {
                Write-Error "[FAIL] Secret $secretName is empty or null"
                exit 1
              }
            } catch {
              Write-Error "[FAIL] Failed to fetch secret $secretName : $_"
              exit 1
            }
          }
          
          Write-Host "[OK] All $($secretNames.Count) secrets fetched successfully"

      - name: Pre-deployment Cleanup
        if: github.event.inputs.clean_deploy == 'true'
        run: |
          Write-Host "[CLEANUP] Performing clean deployment..."
          
          # Parallel cleanup operations
          $cleanupJobs = @()
          $cleanupJobs += Start-Job { helm uninstall dataengine -n ${{ env.NAMESPACE }} --ignore-not-found --wait --timeout=${{ env.ROLLBACK_TIMEOUT }} }
          $cleanupJobs += Start-Job { kubectl delete pvc --all -n ${{ env.NAMESPACE }} --ignore-not-found --timeout=60s }
          $cleanupJobs += Start-Job { kubectl delete job -l app.kubernetes.io/component=migration -n ${{ env.NAMESPACE }} --ignore-not-found }
          
          $cleanupJobs | Wait-Job | Receive-Job
          $cleanupJobs | Remove-Job
          
          Write-Host "[SUCCESS] Clean deployment completed"

      - name: Setup Kubernetes Environment
        run: |
          Write-Host "[SETUP] Setting up Kubernetes environment..."
          
          # Create namespace and secrets in parallel
          $setupJobs = @()
          
          # Namespace creation
          $setupJobs += Start-Job {
            kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          }
          
          # Image pull secret
          $setupJobs += Start-Job {
            kubectl create secret docker-registry ghcr-secret `
              --docker-server=ghcr.io `
              --docker-username=${{ github.actor }} `
              --docker-password=${{ secrets.GHCR_TOKEN }} `
              -n ${{ env.NAMESPACE }} `
              --dry-run=client -o yaml | kubectl apply -f -
          }
          
          $setupJobs | Wait-Job | Receive-Job
          $setupJobs | Remove-Job
          
          Write-Host "[SUCCESS] Kubernetes environment ready"

      - name: Deploy with Helm
        id: helm-deploy
        timeout-minutes: 15
        run: |
          $environment = "${{ github.event.inputs.environment || 'development' }}"
          
          # Determine values file and release name based on environment
          $valuesFile = "k8s/data-engine-helm/values.yaml"  # Default
          $releaseName = "dataengine"
          
          switch ($environment) {
            "database-only" {
              $valuesFile = "k8s/data-engine-helm/values-database-only.yaml"
              $releaseName = "dataengine-db"
              Write-Host "[DATABASE] Deploying Database-Only Configuration using $valuesFile..."
            }
            "development" {
              $valuesFile = "k8s/data-engine-helm/values-dev.yaml"
              Write-Host "[DEV] Deploying Development Environment using $valuesFile..."
            }
            "staging" {
              $valuesFile = "k8s/data-engine-helm/values-qa.yaml"
              Write-Host "[STAGING] Deploying Staging Environment using $valuesFile..."
            }
            "production" {
              $valuesFile = "k8s/data-engine-helm/values-prod.yaml"
              Write-Host "[PROD] Deploying Production Environment using $valuesFile..."
            }
            default {
              Write-Host "[DEFAULT] Deploying with default values.yaml..."
            }
          }
          
          Write-Host "[INFO] Using values file: $valuesFile"
          Write-Host "[INFO] Release name: $releaseName"
          
          $deployStart = Get-Date
          
          # Deploy using the appropriate values file with minimal runtime overrides
          helm upgrade --install $releaseName ${{ env.HELM_CHART_PATH }} `
            --namespace ${{ env.NAMESPACE }} `
            --create-namespace `
            --atomic `
            --wait `
            --timeout ${{ env.HELM_TIMEOUT }} `
            --values $valuesFile `
            --set image.tag=${{ github.sha }} `
            --set secrets.database.username=${{ env.POSTGRES_USER }} `
            --set secrets.database.password=${{ env.POSTGRES_PASSWORD }} `
            --set secrets.redis.password=${{ env.REDIS_PASSWORD }} `
            --set secrets.api_keys.kraken_api_key=${{ env.KRAKEN_API_KEY }} `
            --set secrets.api_keys.kraken_secret_key=${{ env.KRAKEN_SECRET_KEY }} `
            --set externalDatabase.host=${{ env.POSTGRES_HOST }} `
            --set externalDatabase.port=${{ env.POSTGRES_PORT }} `
            --set externalDatabase.database=${{ env.POSTGRES_DB }} `
            --set externalDatabase.username=${{ env.POSTGRES_USER }} `
            --set externalRedis.host=${{ env.REDIS_HOST }} `
            --set externalRedis.port=${{ env.REDIS_PORT }}
            
            if ($LASTEXITCODE -eq 0) {
              $duration = (Get-Date) - $deployStart
              $durationMinutes = [math]::Round($duration.TotalMinutes, 1)
              Write-Host "[SUCCESS] Deployment completed in $durationMinutes minutes"
            } else {
              Write-Error "[FAILED] Helm deployment failed"
              exit 1
            }
          }

      - name: Verify Deployment
        timeout-minutes: 10
        run: |
          $environment = "${{ github.event.inputs.environment || 'development' }}"
          
          # Determine release name based on environment
          $releaseName = if ($environment -eq "database-only") { "dataengine-db" } else { "dataengine" }
          
          Write-Host "[VERIFY] Verifying $environment deployment (release: $releaseName)..."
          
          if ($environment -eq "database-only") {
            Write-Host "[VERIFY] Checking database-only deployment..."
            
            # Check if migration job completed successfully
            $migrationJob = kubectl get jobs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration -o name 2>$null
            
            if ($migrationJob) {
              kubectl wait --for=condition=complete $migrationJob -n ${{ env.NAMESPACE }} --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}
              Write-Host "[SUCCESS] Database migration completed"
            } else {
              Write-Host "[INFO] No migration job found (may not be needed)"
            }
            
            # Verify database connectivity (if migration pod exists)
            $migrationPod = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration -o jsonpath='{.items[0].metadata.name}' --field-selector=status.phase=Succeeded 2>$null
            
            if ($migrationPod) {
              Write-Host "[SUCCESS] Database migration pod found: $migrationPod"
            }
            
            Write-Host "[SUCCESS] Database-only deployment verification completed"
          } else {
            Write-Host "[VERIFY] Checking full application deployment..."
            
            # Wait for rollout completion
            kubectl rollout status deployment/$releaseName -n ${{ env.NAMESPACE }} --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}
            
            # Verify pods are ready
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=data-engine -n ${{ env.NAMESPACE }} --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}
            
            # Health check
            $podName = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=data-engine -o jsonpath='{.items[0].metadata.name}' --field-selector=status.phase=Running
            
            if ($podName) {
              kubectl exec -n ${{ env.NAMESPACE }} $podName -- wget -q -O- http://localhost:8080/health --timeout=10
              if ($LASTEXITCODE -eq 0) {
                Write-Host "[SUCCESS] Health check passed for $environment environment"
              } else {
                Write-Host "[WARNING] Health check failed (non-blocking) for $environment environment"
              }
            }
            
            Write-Host "[SUCCESS] Application deployment verification completed"
          }

  # ===== POST-DEPLOYMENT =====
  notify:
    name: Notify & Report
    runs-on: [self-hosted, windows, x64] 
    needs: [validate, build, security, deploy]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Deployment Report
        run: |
          $status = if ("${{ needs.deploy.result }}" -eq "success") { "SUCCESS" } else { "FAILED" }
          $statusIcon = if ($status -eq "SUCCESS") { "[SUCCESS]" } else { "[FAILED]" }
          
          Write-Host ""
          Write-Host "═══════════════════════════════════════"
          Write-Host "$statusIcon DATAENGINE DEPLOYMENT $status"
          Write-Host "═══════════════════════════════════════"
          Write-Host "Environment: ${{ github.event.inputs.environment || 'development' }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Actor: ${{ github.actor }}"
          Write-Host "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          Write-Host "Namespace: ${{ env.NAMESPACE }}"
          Write-Host "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Write-Host "═══════════════════════════════════════"

  cleanup:
    name: Cleanup Resources
    runs-on: [self-hosted, windows, x64]
    needs: [build, deploy, notify]
    if: always()
    steps:
      - name: Cleanup Docker Images
        run: |
          Write-Host "🧹 Cleaning up Docker resources..."
          
          # Keep last 3 versions of our image
          $images = docker images ${{ env.IMAGE_NAME }} --format "{{.ID}} {{.Tag}}" | 
            Where-Object { $_ -notmatch "latest" } | 
            Select-Object -Skip 3
          
          if ($images) {
            $images | ForEach-Object { 
              $imageId = ($_ -split " ")[0]
              docker rmi $imageId -f 2>$null 
            }
            Write-Host "[SUCCESS] Cleaned up old images"
          }
          
          # System cleanup
          docker system prune -f --filter "until=24h" 2>$null
          Write-Host "[SUCCESS] Docker cleanup completed"

