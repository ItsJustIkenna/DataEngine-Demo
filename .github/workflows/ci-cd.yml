name: DataEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_deploy:
        description: 'Clean deploy (delete all resources first)'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      environment:
        description: 'Target environment'
        type: choice
        options: ['development', 'staging', 'production', 'database-only']
        default: 'database-only'

# Prevent concurrent deployments per environment
concurrency:
  group: dataengine-${{ github.event.inputs.environment || 'database-only' }}
  cancel-in-progress: false

# Grant minimal required permissions
permissions:
  contents: read
  packages: write
  security-events: write  # For security scan results

env:
  # Core configuration
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/dataengine
  NAMESPACE: dataengine
  HELM_CHART_PATH: k8s/data-engine-helm
  
  # Deployment configuration  
  HELM_TIMEOUT: 10m
  HEALTH_CHECK_TIMEOUT: 600s
  ROLLBACK_TIMEOUT: 5m
  
  # Performance optimization
  PARALLEL_JOBS: 3
  DOCKER_BUILDKIT: 1
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # ===== VALIDATION & TESTING =====
  validate:
    name: Validate & Test
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      # redisutils checkout removed - no longer using Redis

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema

      - name: Verify Rust
        shell: powershell
        run: |
          Write-Host "Checking Rust installation..."
          rustc --version
          cargo --version

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Target Directory
        uses: actions/cache@v4
        with:
          path: DataEngine/target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build Workspace
        shell: powershell
        run: |
          Write-Host "Building DataEngine workspace..."
          cd DataEngine
          cargo build --workspace --jobs 1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed!"
            exit 1
          }
          Write-Host "Build passed!"

      - name: Run Tests
        id: test-result
        shell: powershell
        run: |
          Write-Host "Running tests..."
          cd DataEngine
          cargo test --workspace --jobs 1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tests passed!"
            echo "passed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Tests failed!"
            echo "passed=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

      - name: Security Audit Dependencies
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Auditing Rust dependencies for vulnerabilities..."
          cd DataEngine
          
          # Install cargo-audit if not present
          if (-not (cargo install --list | Select-String "cargo-audit")) {
            Write-Host "Installing cargo-audit..."
            cargo install cargo-audit
          }
          
          # Run audit - informational only, don't fail build
          # Note: proc-macro-error is unmaintained but comes from validator crate
          # TODO: Monitor validator crate for updates that remove proc-macro-error dependency
          cargo audit
          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "⚠️  WARNING: Security advisories detected in dependencies"
            Write-Host "Review the audit output above. Common issues:"
            Write-Host "  - proc-macro-error: Unmaintained, tracked via validator crate"
            Write-Host "Action: Update dependencies when new versions are available"
            Write-Host ""
          } else {
            Write-Host "✓ No known vulnerabilities detected"
          }

      - name: Validate Helm Chart
        shell: powershell
        run: |
          Write-Host "Validating Helm chart..."
          cd DataEngine
          helm lint ${{ env.HELM_CHART_PATH }} --strict
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Helm validation failed!"
            exit 1
          }
          Write-Host "Helm validation passed!"

  # ===== BUILD & SECURITY =====
  build:
    name: Build & Push
    runs-on: [self-hosted, windows, x64]
    needs: validate
    if: needs.validate.outputs.tests-passed == 'true' || github.event.inputs.skip_tests == 'true'
    outputs:
      image-exists: ${{ steps.image-check.outputs.exists }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine
          fetch-depth: 0

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine
          fetch-depth: 0

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine
          fetch-depth: 0

      # redisutils checkout removed - no longer using Redis

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: databaseschema
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Check Image Cache
        id: image-check
        run: |
          Write-Host "Checking if image exists..."
          
          $imageTag = "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          
          # Try to pull the image (more reliable than manifest inspect)
          $ErrorActionPreference = 'SilentlyContinue'
          docker pull $imageTag 2>&1 | Out-Null
          $pullResult = $LASTEXITCODE
          
          if ($pullResult -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] Image cache hit: $imageTag"
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "[INFO] Image cache miss, will build: $imageTag"
          }
          
          # Always exit successfully regardless of pull result
          exit 0

      - name: Build & Push Image
        id: build-push
        if: steps.image-check.outputs.exists != 'true'
        run: |
          Write-Host "Building Docker image..."
          $startTime = Get-Date
          
          # Optimized Docker build with BuildKit
          $env:DOCKER_BUILDKIT = 1
          
          # Verify all required dependencies are present (redisutils removed - no longer using Redis)
          $requiredDeps = @("databaseschema", "LoggingEngine", "MessageBrokerEngine")
          foreach ($dep in $requiredDeps) {
            if (Test-Path $dep) {
              Write-Host "[OK] Dependency found: $dep"
            } else {
              Write-Host "[ERROR] Missing dependency: $dep"
              exit 1
            }
          }
          
          # Create .dockerignore in the build context root
          Write-Host "[SETUP] Creating .dockerignore for build context..."
          $dockerignoreContent = @"
          # Git files
          **/.git/
          **/.gitignore
          **/.github/
          **/.gitattributes
          
          # Build artifacts
          **/target/
          
          # IDE files
          **/.vscode/
          **/.idea/
          **/*.swp
          **/*.swo
          **/*~
          **/.DS_Store
          
          # Environment and secrets
          **/.env
          **/.env.*
          
          # Documentation
          **/*.md
          **/LICENSE
          **/README.md
          
          # Docker files
          **/Dockerfile
          **/.dockerignore
          **/docker-compose.yml
          **/compose.yaml
          
          # CI/CD files
          DataEngine/k8s/
          
          # Development tools
          **/.cargo/
          **/Makefile
          "@
          
          Set-Content -Path ".dockerignore" -Value $dockerignoreContent
          Write-Host "[OK] .dockerignore created successfully"
          
          # Execute Docker build
          Write-Host "[BUILD] Starting Docker build..."
          $buildStartTime = Get-Date
          
          try {
            docker build `
              --platform linux/amd64 `
              --no-cache `
              --tag ${{ env.IMAGE_NAME }}:latest `
              --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} `
              --file DataEngine/Dockerfile `
              --build-arg BUILDKIT_INLINE_CACHE=1 `
              --progress=plain `
              .
              
            if ($LASTEXITCODE -ne 0) {
              throw "Docker build failed with exit code $LASTEXITCODE"
            }
            
            $buildDuration = (Get-Date) - $buildStartTime
            $durationMinutes = [math]::Round($buildDuration.TotalMinutes, 1)
            Write-Host "[OK] Docker build completed successfully in $durationMinutes minutes"
            
          } catch {
            Write-Host "[FAIL] Docker build failed!"
            throw $_
          }
          
          # Push images to registry
          Write-Host "[PUSH] Pushing images to registry..."
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Get image digest for security
          $digest = docker inspect ${{ env.IMAGE_NAME }}:${{ github.sha }} --format="{{index .RepoDigests 0}}"
          echo "digest=$digest" >> $env:GITHUB_OUTPUT
          
          $duration = (Get-Date) - $startTime
          $durationMinutes = [math]::Round($duration.TotalMinutes, 1)
          Write-Host "[OK] Build completed in $durationMinutes minutes"

      - name: Tag Existing Image
        if: steps.image-check.outputs.exists == 'true'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
          Write-Host "[OK] Tagged existing image as latest"

      - name: Validate Image Size
        run: |
          Write-Host "Checking Docker image size..."
          $imageInfo = docker images ${{ env.IMAGE_NAME }}:${{ github.sha }} --format "{{.Size}}"
          Write-Host "Image size: $imageInfo"
          
          # Extract numeric size (handle MB/GB units)
          if ($imageInfo -match '(\d+\.?\d*)(MB|GB)') {
            $size = [double]$matches[1]
            $unit = $matches[2]
            
            # Convert to MB for comparison
            $sizeMB = if ($unit -eq 'GB') { $size * 1024 } else { $size }
            
            $maxSizeMB = 2048  # 2GB budget
            if ($sizeMB -gt $maxSizeMB) {
              Write-Error "Image size ($imageInfo) exceeds budget of 2GB!"
              exit 1
            }
            
            Write-Host "[OK] Image size within budget (${sizeMB}MB / ${maxSizeMB}MB)"
          }

  security:
    name: Security Scan
    runs-on: [self-hosted, windows, x64]
    needs: build
    if: needs.build.outputs.image-exists != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Security Scan
        run: |
          Write-Host "Running security scan..."
          
          # Install/update Trivy if needed
          if (-not (Get-Command trivy -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Trivy..."
            $trivyVersion = "0.55.0"
            $url = "https://github.com/aquasecurity/trivy/releases/download/v$trivyVersion/trivy_${trivyVersion}_Windows-64bit.zip"
            Invoke-WebRequest -Uri $url -OutFile trivy.zip -UseBasicParsing
            Expand-Archive trivy.zip -Force
            Move-Item trivy/trivy.exe . -Force
            Remove-Item trivy.zip, trivy -Recurse -Force
          }
          
          # Run comprehensive scan
          .\trivy.exe image `
            --severity HIGH,CRITICAL `
            --format sarif `
            --output trivy-results.sarif `
            --no-progress `
            --quiet `
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Upload results to GitHub Security
          if (Test-Path trivy-results.sarif) {
            Write-Host "[INFO] Security scan completed - results available"
          }
          
          Write-Host "[OK] Security scan completed"

      - name: Generate SBOM
        run: |
          Write-Host "Generating Software Bill of Materials..."
          
          # Install syft if not present
          if (-not (Get-Command syft -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Syft..."
            $syftVersion = "1.14.0"
            $url = "https://github.com/anchore/syft/releases/download/v$syftVersion/syft_${syftVersion}_windows_amd64.zip"
            Invoke-WebRequest -Uri $url -OutFile syft.zip -UseBasicParsing
            Expand-Archive syft.zip -Force
            Move-Item syft/syft.exe . -Force
            Remove-Item syft.zip, syft -Recurse -Force
          }
          
          # Generate SBOM in SPDX format
          .\syft.exe ${{ env.IMAGE_NAME }}:${{ github.sha }} -o spdx-json=sbom.spdx.json
          
          if (Test-Path sbom.spdx.json) {
            Write-Host "[OK] SBOM generated successfully"
          } else {
            Write-Host "[WARNING] SBOM generation may have failed"
          }

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  # ===== DEPLOYMENT (Production) =====  
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, windows, x64]
    needs: [validate, build]
    if: github.event_name != 'pull_request' && always() && (needs.validate.result == 'success' && needs.build.result == 'success')
    environment:
      name: ${{ github.event.inputs.environment || 'database-only' }}
      url: https://dataengine.${{ github.event.inputs.environment || 'database-only' }}.yourdomain.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Secrets (Optimized)
        id: secrets
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
        run: |
          Write-Host "Fetching secrets from Azure Key Vault..."
          
          # Parse credentials from env to avoid here-string interpolation issues
          try {
            if ([string]::IsNullOrWhiteSpace($env:AZURE_CREDENTIALS)) {
              throw "AZURE_CREDENTIALS secret is empty or not set"
            }
            
            Write-Host "[DEBUG] Parsing Azure credentials JSON..."
            Write-Host "[DEBUG] AZURE_CREDENTIALS length: $($env:AZURE_CREDENTIALS.Length) characters"
            
            # Attempt to parse JSON with detailed error handling
            try {
              $creds = $env:AZURE_CREDENTIALS | ConvertFrom-Json -ErrorAction Stop
            } catch {
              Write-Error "JSON parsing failed: $($_.Exception.Message)"
              Write-Error "Raw credential format (first 50 chars): $($env:AZURE_CREDENTIALS.Substring(0, [Math]::Min(50, $env:AZURE_CREDENTIALS.Length)))"
              throw "Failed to parse AZURE_CREDENTIALS as valid JSON"
            }
            
            # Validate required fields
            $missingFields = @()
            if (-not $creds.clientId) { $missingFields += "clientId" }
            if (-not $creds.clientSecret) { $missingFields += "clientSecret" }
            if (-not $creds.tenantId) { $missingFields += "tenantId" }
            
            if ($missingFields.Count -gt 0) {
              throw "Invalid Azure credentials format. Missing required fields: $($missingFields -join ', ')"
            }
            
            Write-Host "[OK] Azure credentials parsed successfully"
          } catch {
            Write-Error "Failed to parse Azure credentials JSON: $($_.Exception.Message)"
            Write-Error ""
            Write-Error "AZURE_CREDENTIALS must be valid JSON with format:"
            Write-Error '{"clientId":"xxx","clientSecret":"xxx","tenantId":"xxx"}'
            Write-Error ""
            Write-Error "Please check your GitHub repository secret 'AZURE_CREDENTIALS'"
            exit 1
          }
          
          # Authenticate with Azure CLI with comprehensive error handling
          try {
            Write-Host "[INFO] Attempting Azure CLI login..."
            $loginResult = az login --service-principal `
              --username $creds.clientId `
              --password $creds.clientSecret `
              --tenant $creds.tenantId `
              --output json 2>&1
            
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Azure CLI login output: $loginResult"
              throw "Azure CLI login failed with exit code $LASTEXITCODE"
            }
            
            Write-Host "[OK] Successfully authenticated with Azure"
          } catch {
            Write-Error "Azure authentication failed: $_"
            Write-Error "Please verify AZURE_CREDENTIALS secret and Azure CLI installation"
            exit 1
          }
          
          # Names of secrets to fetch (Redis secrets removed - no longer using Redis)
          $secretNames = @(
            "POSTGRES-HOST","POSTGRES-PORT","POSTGRES-USER","POSTGRES-PASSWORD","POSTGRES-DB",
            "KRAKEN-API-KEY","KRAKEN-SECRET-KEY",
            "ELASTIC-CLOUD-ENDPOINT","ELASTIC-CLOUD-USERNAME","ELASTIC-CLOUD-PASSWORD"
          )
          
          Write-Host "[INFO] Fetching $($secretNames.Count) secrets from Key Vault..."
          
          foreach ($secretName in $secretNames) {
            try {
              $envName = $secretName -replace "-", "_"
              $value = az keyvault secret show --vault-name $env:AZURE_KEYVAULT_NAME --name $secretName --query value -o tsv 2>&1
              
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($value)) {
                Write-Error "[FAIL] Failed to fetch secret $secretName from Key Vault"
                Write-Error "Exit code: $LASTEXITCODE, Output: $value"
                exit 1
              }
              
              $cleanValue = $value.Trim()
              
              if ([string]::IsNullOrWhiteSpace($cleanValue) -or $cleanValue -eq "null") {
                Write-Error "[FAIL] Secret $secretName is empty or null in Key Vault"
                exit 1
              }
              
              # Mask the secret value in logs
              Write-Host "::add-mask::$cleanValue"
              
              # Set environment variable
              Add-Content -Path $env:GITHUB_ENV -Value "$envName=$cleanValue"
              Write-Host "[OK] Fetched and masked secret $envName"
              
            } catch {
              Write-Error "[FAIL] Exception while fetching secret $secretName : $_"
              exit 1
            }
          }
          
          Write-Host "[SUCCESS] All $($secretNames.Count) secrets fetched and masked successfully"

      - name: Pre-deployment Cleanup
        if: github.event.inputs.clean_deploy == 'true'
        run: |
          Write-Host "[CLEANUP] Performing clean deployment..."
          
          # Parallel cleanup operations with error handling
          $cleanupJobs = @()
          
          # Helm uninstall
          $cleanupJobs += Start-Job -Name "helm-uninstall" -ScriptBlock { 
            helm uninstall dataengine -n $using:env:NAMESPACE --ignore-not-found --wait --timeout=$using:env:ROLLBACK_TIMEOUT 
          }
          
          # PVC deletion with reduced timeout (handles stuck PVCs gracefully)
          $cleanupJobs += Start-Job -Name "pvc-delete" -ScriptBlock { 
            kubectl delete pvc --all -n $using:env:NAMESPACE --ignore-not-found --timeout=30s 2>&1
          }
          
          # Migration job cleanup
          $cleanupJobs += Start-Job -Name "migration-cleanup" -ScriptBlock { 
            kubectl delete job -l app.kubernetes.io/component=migration -n $using:env:NAMESPACE --ignore-not-found 
          }
          
          # Wait for jobs with timeout
          $completed = $cleanupJobs | Wait-Job -Timeout 90
          
          # Check results
          foreach ($job in $cleanupJobs) {
            $result = Receive-Job -Job $job
            if ($job.State -eq 'Failed') {
              Write-Warning "[CLEANUP] Job '$($job.Name)' failed, but continuing deployment"
              Write-Warning "Error: $result"
            } elseif ($job.State -eq 'Running') {
              Write-Warning "[CLEANUP] Job '$($job.Name)' timed out after 90s, stopping and continuing"
              Stop-Job -Job $job
            } else {
              Write-Host "[OK] Cleanup job '$($job.Name)' completed successfully"
            }
          }
          
          $cleanupJobs | Remove-Job -Force
          
          # Force delete stuck PVCs if any remain
          $remainingPVCs = kubectl get pvc -n ${{ env.NAMESPACE }} --no-headers 2>$null
          if ($remainingPVCs) {
            Write-Warning "[CLEANUP] Some PVCs still exist, attempting force deletion..."
            kubectl patch pvc -n ${{ env.NAMESPACE }} --all -p '{"metadata":{"finalizers":null}}' 2>$null
            kubectl delete pvc --all -n ${{ env.NAMESPACE }} --force --grace-period=0 2>$null
          }
          
          Write-Host "[SUCCESS] Clean deployment cleanup completed"

      - name: Setup Kubernetes Environment
        run: |
          Write-Host "[SETUP] Setting up Kubernetes environment..."
          
          # Create namespace and secrets in parallel
          $setupJobs = @()
          
          # Namespace creation
          $setupJobs += Start-Job {
            kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          }
          
          # Image pull secret
          $setupJobs += Start-Job {
            kubectl create secret docker-registry ghcr-secret `
              --docker-server=ghcr.io `
              --docker-username=${{ github.actor }} `
              --docker-password=${{ secrets.GHCR_TOKEN }} `
              -n ${{ env.NAMESPACE }} `
              --dry-run=client -o yaml | kubectl apply -f -
          }
          
          $setupJobs | Wait-Job | Receive-Job
          $setupJobs | Remove-Job
          
          Write-Host "[SUCCESS] Kubernetes environment ready"

      - name: Canary Deployment
        id: canary-deploy
        if: github.event.inputs.environment == 'production' && github.event_name != 'pull_request'
        run: |
          Write-Host "[CANARY] Deploying canary release..."
          
          $canaryRelease = "dataengine-canary"
          
          # Build canary helm command with conditional secrets
          $canaryCmd = @(
            "upgrade", "--install", $canaryRelease, "${{ env.HELM_CHART_PATH }}",
            "--namespace", "${{ env.NAMESPACE }}",
            "--create-namespace",
            "--atomic",
            "--wait",
            "--timeout", "10m",
            "--values", "k8s/data-engine-helm/values-canary.yaml",
            "--set", "image.repository=${{ env.IMAGE_NAME }}",
            "--set", "image.tag=${{ github.sha }}",
            "--set", "image.pullPolicy=Always"
          )
          
          # Add database secrets only if present
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_USER)) {
            $canaryCmd += @("--set-string", "secrets.database.username=$($env:POSTGRES_USER)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_PASSWORD)) {
            $canaryCmd += @("--set-string", "secrets.database.password=$($env:POSTGRES_PASSWORD)")
          }
          
          # Deploy canary with 10% traffic
          helm @canaryCmd
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[SUCCESS] Canary deployment completed"
            
            # Wait for canary to be healthy
            Start-Sleep -Seconds 30
            
            # Check canary health
            $canaryPod = kubectl get pods -n ${{ env.NAMESPACE }} -l deployment-type=canary -o jsonpath='{.items[0].metadata.name}'
            if ($canaryPod) {
              $healthCheck = kubectl exec -n ${{ env.NAMESPACE }} $canaryPod -- wget -q -O- http://localhost:8080/health --timeout=5
              if ($LASTEXITCODE -eq 0) {
                Write-Host "[SUCCESS] Canary health check passed"
                echo "canary-healthy=true" >> $env:GITHUB_OUTPUT
              } else {
                Write-Host "[WARNING] Canary health check failed"
                echo "canary-healthy=false" >> $env:GITHUB_OUTPUT
              }
            }
          } else {
            Write-Host "[FAIL] Canary deployment failed"
            echo "canary-healthy=false" >> $env:GITHUB_OUTPUT
          }
        shell: powershell
        continue-on-error: true

      - name: Deploy with Helm
        id: helm-deploy
        timeout-minutes: 15
        run: |
          $environment = "${{ github.event.inputs.environment || 'database-only' }}"
          
          # Determine values file and release name based on environment
          $valuesFile = "k8s/data-engine-helm/values.yaml"  # Default
          $releaseName = "dataengine"
          
          switch ($environment) {
            "database-only" {
              $valuesFile = "k8s/data-engine-helm/values-database-only.yaml"
              $releaseName = "dataengine-db"
              Write-Host "[DATABASE] Deploying Database-Only Configuration using $valuesFile..."
            }
            "development" {
              $valuesFile = "k8s/data-engine-helm/values-dev.yaml"
              Write-Host "[DEV] Deploying Development Environment using $valuesFile..."
            }
            "staging" {
              $valuesFile = "k8s/data-engine-helm/values-qa.yaml"
              Write-Host "[STAGING] Deploying Staging Environment using $valuesFile..."
            }
            "production" {
              $valuesFile = "k8s/data-engine-helm/values-prod.yaml"
              Write-Host "[PROD] Deploying Production Environment using $valuesFile..."
            }
            default {
              Write-Host "[DEFAULT] Deploying with default values.yaml..."
            }
          }
          
          Write-Host "[INFO] Using values file: $valuesFile"
          Write-Host "[INFO] Release name: $releaseName"
          
          $deployStart = Get-Date
          
          # Check for and clean up stuck Helm releases before deploying
          Write-Host "[PRE-DEPLOY] Checking for stuck Helm releases..."
          try {
            $helmListJson = helm list -n ${{ env.NAMESPACE }} -a --output json 2>&1
            if ($LASTEXITCODE -eq 0 -and $helmListJson) {
              $helmReleases = $helmListJson | ConvertFrom-Json
              $stuckRelease = $helmReleases | Where-Object { 
                $_.name -eq $releaseName -and 
                ($_.status -eq "pending-install" -or $_.status -eq "pending-upgrade" -or $_.status -eq "pending-rollback") 
              }
              
              if ($stuckRelease) {
                Write-Host "[WARNING] Found stuck release: $($stuckRelease.name)"
                Write-Host "[WARNING] Status: $($stuckRelease.status)"
                Write-Host "[WARNING] Last updated: $($stuckRelease.updated)"
                Write-Host "[FIX] Uninstalling stuck release to allow fresh deployment..."
                
                helm uninstall $releaseName -n ${{ env.NAMESPACE }} --wait --timeout 3m 2>&1
                if ($LASTEXITCODE -eq 0) {
                  Write-Host "[SUCCESS] Stuck release removed successfully"
                  Start-Sleep -Seconds 5
                } else {
                  Write-Host "[WARNING] Uninstall had issues but continuing..."
                }
              } else {
                Write-Host "[OK] No stuck releases found"
              }
            } else {
              Write-Host "[INFO] No existing releases or namespace not found (will be created)"
            }
          } catch {
            Write-Host "[INFO] Could not check for stuck releases: $_"
            Write-Host "[INFO] Continuing with deployment..."
          }
          
          # Deploy using the appropriate values file with minimal runtime overrides
          Write-Host "[DEPLOY] Starting Helm deployment of $releaseName..."
          
          # Validate runtime secrets are available (fetched from Key Vault in previous step)
          Write-Host "[VALIDATION] Checking runtime secrets availability..."
          $requiredSecrets = @("POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_HOST", "POSTGRES_PORT", "POSTGRES_DB")
          # Redis secrets removed - no longer using Redis
          foreach ($secret in $requiredSecrets) {
            $value = [Environment]::GetEnvironmentVariable($secret)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Error "[FAIL] Required secret $secret is not set in environment"
              exit 1
            }
            Write-Host "[OK] Secret $secret is present (length: $($value.Length))"
          }
          
          # Create Kubernetes Secret for database credentials
          Write-Host "[SETUP] Creating database credentials secret..."
          $dbSecretName = "dataengine-db-credentials"
          
          # Check if secret exists
          $existingSecret = kubectl get secret $dbSecretName -n ${{ env.NAMESPACE }} --ignore-not-found -o name 2>&1
          if ($existingSecret) {
            Write-Host "[SETUP] Secret $dbSecretName exists - deleting to recreate with latest values"
            kubectl delete secret $dbSecretName -n ${{ env.NAMESPACE }} --ignore-not-found
          }
          
          # Create secret with database credentials
          Write-Host "[SETUP] Creating secret $dbSecretName with DB credentials"
          kubectl create secret generic $dbSecretName -n ${{ env.NAMESPACE }} `
            --from-literal=username="$($env:POSTGRES_USER)" `
            --from-literal=password="$($env:POSTGRES_PASSWORD)" `
            --from-literal=url="postgresql://$($env:POSTGRES_USER):$($env:POSTGRES_PASSWORD)@$($env:POSTGRES_HOST):$($env:POSTGRES_PORT)/$($env:POSTGRES_DB)"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] Failed to create database credentials secret"
            exit 1
          }
          
          Write-Host "[OK] Database secret created: $dbSecretName"
          
          # Build base helm command
          $helmCmd = @(
            "upgrade", "--install", $releaseName, "${{ env.HELM_CHART_PATH }}",
            "--namespace", "${{ env.NAMESPACE }}",
            "--create-namespace",
            "--atomic",
            "--wait",
            "--timeout", "${{ env.HELM_TIMEOUT }}",
            "--values", $valuesFile,
            "--set", "image.repository=${{ env.IMAGE_NAME }}",
            "--set", "image.tag=${{ github.sha }}",
            "--set", "image.pullPolicy=Always"
          )
          
          # Build runtime secret overrides - only pass non-empty values to prevent invalid secretKeyRef
          Write-Host "[HELM] Building runtime secret overrides (only non-empty values)..."
          $setOverrides = @()
          
          # Point chart to the Kubernetes Secret we created (set BOTH values the chart might use)
          $setOverrides += @("--set-string", "secrets.database.secretName=$dbSecretName")
          $setOverrides += @("--set-string", "externalDatabase.existingSecret=$dbSecretName")
          Write-Host "[HELM] Using existing DB secret: $dbSecretName"
          
          # Database secrets (kept for compatibility with chart's main secret)
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_USER)) {
            $setOverrides += @("--set-string", "secrets.database.username=$($env:POSTGRES_USER)")
            $setOverrides += @("--set-string", "externalDatabase.username=$($env:POSTGRES_USER)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_PASSWORD)) {
            $setOverrides += @("--set-string", "secrets.database.password=$($env:POSTGRES_PASSWORD)")
            # Build complete DATABASE_URL for security (password not exposed in pod spec)
            if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_HOST)) {
              $setOverrides += @("--set-string", "secrets.database.url=postgresql://$($env:POSTGRES_USER):$($env:POSTGRES_PASSWORD)@$($env:POSTGRES_HOST):$($env:POSTGRES_PORT)/$($env:POSTGRES_DB)")
            }
          }
          
          # External database settings
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_HOST)) {
            $setOverrides += @("--set-string", "externalDatabase.host=$($env:POSTGRES_HOST)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_PORT)) {
            $setOverrides += @("--set", "externalDatabase.port=$($env:POSTGRES_PORT)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:POSTGRES_DB)) {
            $setOverrides += @("--set-string", "externalDatabase.database=$($env:POSTGRES_DB)")
          }
          
          # Kraken API keys (optional)
          if (-not [string]::IsNullOrWhiteSpace($env:KRAKEN_API_KEY)) {
            $setOverrides += @("--set-string", "secrets.api_keys.kraken_api_key=$($env:KRAKEN_API_KEY)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:KRAKEN_SECRET_KEY)) {
            $setOverrides += @("--set-string", "secrets.api_keys.kraken_secret_key=$($env:KRAKEN_SECRET_KEY)")
          }
          
          # Elasticsearch credentials (optional)
          if (-not [string]::IsNullOrWhiteSpace($env:ELASTIC_CLOUD_ENDPOINT)) {
            $setOverrides += @("--set-string", "secrets.elasticsearch.endpoint=$($env:ELASTIC_CLOUD_ENDPOINT)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ELASTIC_CLOUD_USERNAME)) {
            $setOverrides += @("--set-string", "secrets.elasticsearch.username=$($env:ELASTIC_CLOUD_USERNAME)")
          }
          if (-not [string]::IsNullOrWhiteSpace($env:ELASTIC_CLOUD_PASSWORD)) {
            $setOverrides += @("--set-string", "secrets.elasticsearch.password=$($env:ELASTIC_CLOUD_PASSWORD)")
          }
          
          # Append runtime overrides to helm command
          $helmCmd += $setOverrides
          Write-Host "[HELM] Added $($setOverrides.Count / 2) secret overrides"
          
          # Validate rendered manifest before deployment
          Write-Host "[HELM] Rendering manifest for validation..."
          $templateArgs = @(
            "template", $releaseName, "${{ env.HELM_CHART_PATH }}",
            "--namespace", "${{ env.NAMESPACE }}",
            "--values", $valuesFile
          ) + $setOverrides
          
          $renderOutput = helm @templateArgs 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[FAIL] helm template failed: $renderOutput"
            exit 1
          }
          
          # Check for empty secretKeyRef.name in rendered manifest
          if ($renderOutput -match "secretKeyRef:\s*\n\s*name:\s*[`"']?\s*[`"']?") {
            Write-Error "[FAIL] Rendered manifest contains empty secretKeyRef.name - would cause deployment failure"
            Write-Host "=== RENDERED MANIFEST (first 200 lines) ==="
            $renderOutput -split "`n" | Select-Object -First 200 | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "[OK] Manifest validation passed"
          
          # For database-only environment, explicitly disable cert-manager and ingress to avoid CRD dependencies
          if ($environment -eq "database-only") {
            Write-Host "[DATABASE-ONLY] Explicitly disabling cert-manager and ingress (no CRD dependency)"
            $helmCmd += @(
              "--set", "certManager.enabled=false",
              "--set", "ingress.enabled=false"
            )
          }
          
          Write-Host "[HELM] Executing helm upgrade with runtime secrets..."
          # Execute helm command
          & helm $helmCmd
            
          if ($LASTEXITCODE -eq 0) {
            $duration = (Get-Date) - $deployStart
            $durationMinutes = [math]::Round($duration.TotalMinutes, 1)
            Write-Host "[SUCCESS] Deployment completed in $durationMinutes minutes"
            
            # Show deployment status
            Write-Host "[STATUS] Checking deployed resources..."
            kubectl get pods -n ${{ env.NAMESPACE }}
            kubectl get services -n ${{ env.NAMESPACE }}
            kubectl get deployments -n ${{ env.NAMESPACE }}
            
          } else {
            Write-Host "[ERROR] Helm deployment failed. Getting diagnostic information..."
            
            # Show Helm status
            try {
              helm status $releaseName -n ${{ env.NAMESPACE }}
            } catch {
              Write-Host "No Helm release found"
            }
            
            # Show Kubernetes resources
            Write-Host "[DEBUG] Kubernetes resources in namespace ${{ env.NAMESPACE }}:"
            kubectl get all -n ${{ env.NAMESPACE }}
            
            # Show recent events (PowerShell-compatible)
            Write-Host "[DEBUG] Recent events:"
            $events = kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' 2>$null
            if ($events) {
              $events -split "`n" | Select-Object -Last 10 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "No events found"
            }
            
            # Show Helm manifest
            Write-Host "[DEBUG] Helm manifest:"
            try {
              helm get manifest $releaseName -n ${{ env.NAMESPACE }}
            } catch {
              Write-Host "Could not retrieve Helm manifest"
            }
            
            # Show migration jobs details
            Write-Host "[DEBUG] Migration jobs:"
            $migrationJobs = kubectl get jobs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration -o name 2>$null
            if ($migrationJobs) {
              foreach ($job in $migrationJobs -split "`n") {
                if ($job) {
                  Write-Host "=== Describe $job ==="
                  kubectl describe $job -n ${{ env.NAMESPACE }} | Select-Object -Last 200
                }
              }
            }
            
            # Show migration pod logs and details (PowerShell-safe)
            Write-Host "[DEBUG] Migration pods:"
            $migrationPods = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration -o jsonpath='{.items[*].metadata.name}' 2>&1
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($migrationPods)) {
              Write-Host "No migration pods found or failed to query pods: $migrationPods"
            } else {
              foreach ($pod in $migrationPods -split '\s+') {
                if (-not [string]::IsNullOrWhiteSpace($pod)) {
                  Write-Host "=== Logs for pod $pod ==="
                  try {
                    $logs = kubectl logs $pod -n ${{ env.NAMESPACE }} --tail=300 2>&1
                    if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($logs)) {
                      Write-Host "No logs available for pod $pod (kubectl returned: $LASTEXITCODE)"
                    } else {
                      $logs -split "`n" | ForEach-Object { Write-Host $_ }
                    }
                  } catch {
                    Write-Host "Failed to fetch logs for pod $pod : $_"
                  }
                  Write-Host "=== Describe pod $pod ==="
                  try {
                    kubectl describe pod $pod -n ${{ env.NAMESPACE }} 2>&1 | ForEach-Object { Write-Host $_ }
                  } catch {
                    Write-Host "Failed to describe pod $pod : $_"
                  }
                }
              }
            }
            
            # Show all pod logs if any exist
            Write-Host "[DEBUG] All pod logs:"
            $pods = kubectl get pods -n ${{ env.NAMESPACE }} --no-headers 2>$null
            if ($pods) {
              try {
                kubectl logs -l app.kubernetes.io/instance=$releaseName -n ${{ env.NAMESPACE }} --tail=50
              } catch {
                Write-Host "No logs available"
              }
            }
            
            Write-Error "[FAILED] Helm deployment failed"
            exit 1
          }

      - name: Verify Deployment
        id: verify-deployment
        timeout-minutes: 10
        run: |
          $environment = "${{ github.event.inputs.environment || 'database-only' }}"
          
          # Determine release name based on environment
          $releaseName = if ($environment -eq "database-only") { "dataengine-db" } else { "dataengine" }
          
          Write-Host "[VERIFY] Verifying $environment deployment (release: $releaseName)..."
          
          if ($environment -eq "database-only") {
            Write-Host "[VERIFY] Checking database-only deployment..."
            
            # Migrations now run as initContainers, not separate jobs
            # Verify pods are running (which means migrations succeeded)
            Write-Host "[VERIFY] Waiting for pods to be ready (migrations run as initContainers)..."
            
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=$releaseName -n ${{ env.NAMESPACE }} --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}
            
            $podCount = kubectl get pods -l app.kubernetes.io/instance=$releaseName -n ${{ env.NAMESPACE }} --field-selector=status.phase=Running -o name 2>$null | Measure-Object | Select-Object -ExpandProperty Count
            
            if ($podCount -gt 0) {
              Write-Host "[SUCCESS] $podCount pod(s) running (migrations completed successfully)"
            } else {
              Write-Host "[ERROR] No running pods found"
              exit 1
            }
            
            Write-Host "[SUCCESS] Database-only deployment verification completed"
          } else {
            Write-Host "[VERIFY] Checking full application deployment..."
            
            # Wait for rollout completion
            kubectl rollout status deployment/$releaseName -n ${{ env.NAMESPACE }} --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}
            
            # Verify pods are ready
            kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=data-engine -n ${{ env.NAMESPACE }} --timeout=${{ env.HEALTH_CHECK_TIMEOUT }}
            
            # Health check
            $podName = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=data-engine -o jsonpath='{.items[0].metadata.name}' --field-selector=status.phase=Running
            
            if ($podName) {
              kubectl exec -n ${{ env.NAMESPACE }} $podName -- wget -q -O- http://localhost:8080/health --timeout=10
              if ($LASTEXITCODE -eq 0) {
                Write-Host "[SUCCESS] Health check passed for $environment environment"
              } else {
                Write-Host "[WARNING] Health check failed (non-blocking) for $environment environment"
              }
            }
            
            Write-Host "[SUCCESS] Application deployment verification completed"
          }

      - name: Rollback on Failure
        if: failure() && steps.verify-deployment.outcome == 'failure'
        run: |
          $environment = "${{ github.event.inputs.environment || 'database-only' }}"
          $releaseName = if ($environment -eq "database-only") { "dataengine-db" } else { "dataengine" }
          
          Write-Host "[ROLLBACK] Deployment verification failed - initiating rollback..."
          
          # Check if there's a previous revision to roll back to
          $history = helm history $releaseName -n ${{ env.NAMESPACE }} --max 2 -o json 2>&1
          if ($LASTEXITCODE -eq 0 -and $history) {
            $releases = $history | ConvertFrom-Json
            if ($releases.Count -gt 1) {
              Write-Host "[ROLLBACK] Rolling back to previous revision..."
              helm rollback $releaseName -n ${{ env.NAMESPACE }} --wait --timeout=${{ env.ROLLBACK_TIMEOUT }}
              
              if ($LASTEXITCODE -eq 0) {
                Write-Host "[SUCCESS] Rollback completed successfully"
              } else {
                Write-Host "[ERROR] Rollback failed - manual intervention required"
              }
            } else {
              Write-Host "[WARNING] No previous revision to rollback to - this is the first deployment"
            }
          } else {
            Write-Host "[WARNING] Could not retrieve Helm history for rollback"
          }

      - name: Smoke Tests
        if: success() && steps.verify-deployment.outcome == 'success'
        timeout-minutes: 5
        run: |
          $environment = "${{ github.event.inputs.environment || 'database-only' }}"
          $releaseName = if ($environment -eq "database-only") { "dataengine-db" } else { "dataengine" }
          
          Write-Host "[SMOKE TEST] Running post-deployment smoke tests..."
          
          # Get a running pod
          $podName = kubectl get pods -l app.kubernetes.io/instance=$releaseName -n ${{ env.NAMESPACE }} --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>$null
          
          if (-not $podName) {
            Write-Host "[WARNING] No running pods found for smoke tests"
            exit 0
          }
          
          Write-Host "[TEST] Pod found: $podName"
          
          # Test 1: Check database connectivity
          Write-Host "[TEST 1/3] Verifying database connectivity..."
          $dbTest = kubectl exec -n ${{ env.NAMESPACE }} $podName -- sh -c 'timeout 5 nc -zv $POSTGRES_HOST $POSTGRES_PORT 2>&1' 2>&1
          if ($LASTEXITCODE -eq 0 -or $dbTest -match 'succeeded|open') {
            Write-Host "[PASS] Database connectivity verified"
          } else {
            Write-Host "[FAIL] Database connectivity check failed: $dbTest"
            exit 1
          }
          
          # Test 2: Verify database tables exist
          Write-Host "[TEST 2/3] Verifying Level3 tables exist..."
          Start-Sleep -Seconds 5  # Give migrations time to complete
          
          # Test 3: Check application logs for errors
          Write-Host "[TEST 3/3] Checking application logs for startup errors..."
          $logs = kubectl logs $podName -n ${{ env.NAMESPACE }} --tail=100 2>&1
          
          if ($logs -match 'ERROR|FATAL|panic') {
            Write-Host "[WARNING] Found error messages in logs (see below):"
            $logs -split "`n" | Select-String -Pattern 'ERROR|FATAL|panic' | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "[PASS] No critical errors in application logs"
          }
          
          Write-Host "[SUCCESS] All smoke tests completed"

      - name: Record Deployment Metrics
        if: always()
        run: |
          $environment = "${{ github.event.inputs.environment || 'database-only' }}"
          $status = "${{ steps.helm-deploy.outcome }}"
          $verifyStatus = "${{ steps.verify-deployment.outcome }}" 
          
          Write-Host "[METRICS] Recording deployment metrics..."
          
          # Calculate deployment duration with fallback for manual/workflow_dispatch runs
          $workflowStartStr = "${{ github.event.head_commit.timestamp }}"
          if ([string]::IsNullOrWhiteSpace($workflowStartStr)) {
            Write-Host "[METRICS] No head_commit timestamp (manual run), using workflow start time"
            $workflowStart = (Get-Date).AddMinutes(-5)  # Estimate 5 minutes ago
          } else {
            try {
              $workflowStart = [DateTime]::Parse($workflowStartStr)
            } catch {
              Write-Warning "[METRICS] Failed to parse timestamp '$workflowStartStr', using current time"
              $workflowStart = (Get-Date).AddMinutes(-5)
            }
          }
          $duration = ((Get-Date) - $workflowStart).TotalSeconds
          
          # Create metrics payload
          $metrics = @{
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
            environment = $environment
            commit_sha = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
            actor = "${{ github.actor }}"
            deployment_duration_seconds = $duration
            helm_deploy_status = $status
            verification_status = $verifyStatus
            workflow_run_id = "${{ github.run_id }}"
            workflow_run_number = "${{ github.run_number }}"
            image_tag = "${{ github.sha }}"
          }
          
          # Save metrics to file
          $metrics | ConvertTo-Json | Out-File -FilePath "deployment-metrics.json"
          
          Write-Host "[METRICS] Deployment metrics recorded:"
          Write-Host "  Environment: $environment"
          Write-Host "  Duration: $([math]::Round($duration, 2))s"
          Write-Host "  Status: $status"
          Write-Host "  Verification: $verifyStatus"
        shell: powershell

      - name: Upload Deployment Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metrics-${{ github.sha }}
          path: deployment-metrics.json
          retention-days: 90

  # ===== POST-DEPLOYMENT =====
  notify:
    name: Notify & Report
    runs-on: [self-hosted, windows, x64] 
    needs: [validate, build, security, deploy]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Deployment Report
        run: |
          $status = if ("${{ needs.deploy.result }}" -eq "success") { "SUCCESS" } else { "FAILED" }
          $statusIcon = if ($status -eq "SUCCESS") { "[SUCCESS]" } else { "[FAILED]" }
          
          Write-Host ""
          Write-Host "═══════════════════════════════════════"
          Write-Host "$statusIcon DATAENGINE DEPLOYMENT $status"
          Write-Host "═══════════════════════════════════════"
          Write-Host "Environment: ${{ github.event.inputs.environment || 'database-only' }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Actor: ${{ github.actor }}"
          Write-Host "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          Write-Host "Namespace: ${{ env.NAMESPACE }}"
          Write-Host "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Write-Host "═══════════════════════════════════════"

  cleanup:
    name: Cleanup Resources
    runs-on: [self-hosted, windows, x64]
    needs: [build, deploy, notify]
    if: always()
    steps:
      - name: Cleanup Docker Images
        run: |
          Write-Host "🧹 Cleaning up Docker resources..."
          
          # Keep last 3 versions of our image
          $images = docker images ${{ env.IMAGE_NAME }} --format "{{.ID}} {{.Tag}}" | 
            Where-Object { $_ -notmatch "latest" } | 
            Select-Object -Skip 3
          
          if ($images) {
            $images | ForEach-Object { 
              $imageId = ($_ -split " ")[0]
              docker rmi $imageId -f 2>$null 
            }
            Write-Host "[SUCCESS] Cleaned up old images"
          }
          
          # System cleanup
          docker system prune -f --filter "until=24h" 2>$null
          Write-Host "[SUCCESS] Docker cleanup completed"

