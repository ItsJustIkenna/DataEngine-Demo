name: DataEngine CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_deploy:
        description: 'Clean deploy (delete all resources first)'
        type: boolean
        default: false
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false

# Prevent concurrent deployments
concurrency:
  group: dataengine-deployment
  cancel-in-progress: false

# Grant permissions for GHCR
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/nwagbara-group-llc/dataengine
  NAMESPACE: dataengine
  HELM_TIMEOUT: 15m
  HEALTH_CHECK_RETRIES: 5
  HEALTH_CHECK_INTERVAL: 10

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows, x64]
    
    steps:
      # === CHECKOUT ===
      - name: Checkout repositories
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          path: MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      # === BUILD ===
      - name: Validate Helm chart
        run: |
          Write-Host "Validating Helm chart..."
          helm lint DataEngine/k8s/data-engine-helm --strict
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Helm chart validation failed"
            exit 1
          }
          
          Write-Host "[OK] Helm chart validation passed"

      - name: Run Rust tests
        if: github.event.inputs.skip_tests != 'true'
        run: |
          Write-Host "Running Rust tests..."
          cd DataEngine
          cargo test --workspace --all-features
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed"
            exit 1
          }
          
          Write-Host "[OK] All tests passed"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GHCR_TOKEN }}

      - name: Check if image exists
        id: check_image
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "Checking if image exists: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }} 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            echo "image_exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "[OK] Image already exists, skipping build"
          } else {
            echo "image_exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "[INFO] Image not found, will build"
          }
          exit 0

      - name: Build and push Docker image
        if: steps.check_image.outputs.image_exists != 'true'
        run: |
          Write-Host "Building Docker image..."
          $startTime = Get-Date
          
          docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f DataEngine/Dockerfile .
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker build failed"
            exit 1
          }
          
          Write-Host "Pushing images to registry..."
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          $duration = (Get-Date) - $startTime
          Write-Host "[OK] Build completed in $($duration.TotalMinutes.ToString('F2')) minutes"

      - name: Scan Docker image for vulnerabilities
        if: steps.check_image.outputs.image_exists != 'true'
        run: |
          Write-Host "Scanning image for vulnerabilities with Trivy..."
          
          # Check if Trivy is installed
          $trivyInstalled = Get-Command trivy -ErrorAction SilentlyContinue
          if (-not $trivyInstalled) {
            Write-Host "Installing Trivy..."
            $ProgressPreference = 'SilentlyContinue'
            
            # Download Trivy for Windows
            $trivyVersion = "0.55.0"
            $trivyUrl = "https://github.com/aquasecurity/trivy/releases/download/v$trivyVersion/trivy_${trivyVersion}_Windows-64bit.zip"
            Invoke-WebRequest -Uri $trivyUrl -OutFile trivy.zip
            Expand-Archive -Path trivy.zip -DestinationPath . -Force
            Remove-Item trivy.zip
            
            Write-Host "[OK] Trivy installed"
          }
          
          # Scan the image
          .\trivy.exe image --severity HIGH,CRITICAL --exit-code 0 --no-progress ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[WARN] Vulnerabilities found, but continuing (exit-code set to 0 for non-blocking)"
          } else {
            Write-Host "[OK] Security scan completed"
          }

      - name: Tag existing image as latest
        if: steps.check_image.outputs.image_exists == 'true'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
          Write-Host "[OK] Tagged existing image as latest"

      # === DEPLOY ===
      - name: Skip deployment on PR
        if: github.event_name == 'pull_request'
        run: |
          Write-Host "Skipping deployment for pull request"
          Write-Host "Build completed successfully - image pushed to registry"
          exit 0

      - name: Clean deploy (optional)
        if: github.event.inputs.clean_deploy == 'true' && github.event_name != 'pull_request'
        run: |
          Write-Host "Performing clean deployment..."
          helm uninstall dataengine -n ${{ env.NAMESPACE }} --ignore-not-found --wait --timeout=5m
          kubectl delete pvc --all -n ${{ env.NAMESPACE }} --ignore-not-found
          Write-Host "[OK] Clean deploy completed"

      # === AZURE KEY VAULT AUTHENTICATION ===
      # NOTE: For production, pre-install Azure CLI on the self-hosted runner to avoid installation on every run
      # Installation command: winget install -e --id Microsoft.AzureCLI
      - name: Setup Azure CLI and Fetch Secrets
        if: github.event_name != 'pull_request'
        run: |
          Write-Host "Checking Azure CLI installation..."
          $azInstalled = Get-Command az -ErrorAction SilentlyContinue
          
          if (-not $azInstalled) {
            Write-Host "[WARN] Azure CLI not pre-installed. Installing (this adds ~2 min to build time)..."
            Write-Host "[WARN] Consider pre-installing on runner: winget install -e --id Microsoft.AzureCLI"
            
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri https://aka.ms/installazurecliwindowsx64 -OutFile AzureCLI.msi
            Start-Process msiexec.exe -Wait -ArgumentList '/I AzureCLI.msi /quiet /norestart'
            Remove-Item AzureCLI.msi
            
            # Refresh PATH in current session
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
            Write-Host "[OK] Azure CLI installed"
          } else {
            Write-Host "[OK] Azure CLI already installed"
          }
          
          # Verify installation
          $azVersion = az version --output json | ConvertFrom-Json
          Write-Host "[INFO] Azure CLI version: $($azVersion.'azure-cli')"
          
          Write-Host "Logging into Azure..."
          
          # Parse Azure credentials
          $creds = '${{ secrets.AZURE_CREDENTIALS }}' | ConvertFrom-Json
          
          # Login using service principal
          az login --service-principal `
            --username $creds.clientId `
            --password $creds.clientSecret `
            --tenant $creds.tenantId
          
          Write-Host "[OK] Logged into Azure"
          
          Write-Host "Fetching secrets from Azure Key Vault: ${{ secrets.AZURE_KEYVAULT_NAME }}"
          
          # Fetch all secrets and set as environment variables
          $env:POSTGRES_HOST = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "POSTGRES-HOST" --query value -o tsv
          $env:POSTGRES_PORT = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "POSTGRES-PORT" --query value -o tsv
          $env:POSTGRES_USER = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "POSTGRES-USER" --query value -o tsv
          $env:POSTGRES_PASSWORD = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "POSTGRES-PASSWORD" --query value -o tsv
          $env:POSTGRES_DB = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "POSTGRES-DB" --query value -o tsv
          
          $env:REDIS_HOST = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "REDIS-HOST" --query value -o tsv
          $env:REDIS_PORT = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "REDIS-PORT" --query value -o tsv
          $env:REDIS_PASSWORD = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "REDIS-PASSWORD" --query value -o tsv
          
          $env:KRAKEN_API_KEY = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "KRAKEN-API-KEY" --query value -o tsv
          $env:KRAKEN_SECRET_KEY = az keyvault secret show --vault-name ${{ secrets.AZURE_KEYVAULT_NAME }} --name "KRAKEN-SECRET-KEY" --query value -o tsv
          
          # Export to GitHub environment for subsequent steps
          echo "POSTGRES_HOST=$env:POSTGRES_HOST" >> $env:GITHUB_ENV
          echo "POSTGRES_PORT=$env:POSTGRES_PORT" >> $env:GITHUB_ENV
          echo "POSTGRES_USER=$env:POSTGRES_USER" >> $env:GITHUB_ENV
          echo "POSTGRES_PASSWORD=$env:POSTGRES_PASSWORD" >> $env:GITHUB_ENV
          echo "POSTGRES_DB=$env:POSTGRES_DB" >> $env:GITHUB_ENV
          echo "REDIS_HOST=$env:REDIS_HOST" >> $env:GITHUB_ENV
          echo "REDIS_PORT=$env:REDIS_PORT" >> $env:GITHUB_ENV
          echo "REDIS_PASSWORD=$env:REDIS_PASSWORD" >> $env:GITHUB_ENV
          echo "KRAKEN_API_KEY=$env:KRAKEN_API_KEY" >> $env:GITHUB_ENV
          echo "KRAKEN_SECRET_KEY=$env:KRAKEN_SECRET_KEY" >> $env:GITHUB_ENV
          
          Write-Host "[OK] Successfully fetched all 10 secrets from Key Vault"

      - name: Create namespace and image pull secret
        if: github.event_name != 'pull_request'
        run: |
          Write-Host "Creating namespace..."
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          
          Write-Host "Creating image pull secret..."
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username=${{ github.actor }} `
            --docker-password=${{ secrets.GHCR_TOKEN }} `
            -n ${{ env.NAMESPACE }} `
            --dry-run=client -o yaml | kubectl apply -f -
          
          Write-Host "[OK] Namespace and image pull secret ready"

      - name: Delete old migration job
        if: github.event_name != 'pull_request'
        run: |
          kubectl delete job -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration --ignore-not-found
          Write-Host "[OK] Old migration jobs cleaned up"

      - name: Validate cluster resources
        if: github.event_name != 'pull_request'
        run: |
          Write-Host "Validating cluster resources..."
          
          # Check node status
          $nodes = kubectl get nodes -o json | ConvertFrom-Json
          $readyNodes = $nodes.items | Where-Object { 
            $_.status.conditions | Where-Object { $_.type -eq "Ready" -and $_.status -eq "True" }
          }
          
          Write-Host "[INFO] Cluster has $($readyNodes.Count) ready node(s)"
          
          # Check namespace resource quotas (if any)
          $quotas = kubectl get resourcequota -n ${{ env.NAMESPACE }} -o json 2>$null | ConvertFrom-Json
          if ($quotas.items.Count -gt 0) {
            Write-Host "[INFO] Resource quotas found, checking limits..."
            $quotas.items | ForEach-Object {
              Write-Host "  Quota: $($_.metadata.name)"
            }
          }
          
          # Get current resource usage
          $pods = kubectl top pods -n ${{ env.NAMESPACE }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[INFO] Current pod resource usage:"
            Write-Host $pods
          }
          
          Write-Host "[OK] Cluster validation completed"

      - name: Clean up stuck Helm release
        if: github.event_name != 'pull_request'
        run: |
          Write-Host "Checking for stuck Helm releases..."
          
          # Check for any pending-* status releases
          $releases = helm list -n ${{ env.NAMESPACE }} -o json 2>$null | ConvertFrom-Json
          $stuckRelease = $releases | Where-Object { $_.name -eq "dataengine" -and $_.status -match "pending" }
          
          if ($stuckRelease) {
            Write-Host "[WARN] Found stuck release in status: $($stuckRelease.status)"
            
            # Get all Helm secrets for this release to check for locks
            $helmSecrets = kubectl get secrets -n ${{ env.NAMESPACE }} -l owner=helm,name=dataengine -o json | ConvertFrom-Json
            $pendingSecrets = $helmSecrets.items | Where-Object { $_.metadata.labels.status -match "pending" }
            
            if ($pendingSecrets) {
              Write-Host "[WARN] Found $($pendingSecrets.Count) pending Helm secrets, deleting them to clear lock..."
              $pendingSecrets | ForEach-Object {
                kubectl delete secret $_.metadata.name -n ${{ env.NAMESPACE }}
                Write-Host "  Deleted secret: $($_.metadata.name)"
              }
            }
            
            # Now try to clean up the release
            Write-Host "Attempting to uninstall stuck release..."
            helm uninstall dataengine -n ${{ env.NAMESPACE }} --wait --timeout=2m --ignore-not-found
            Write-Host "[OK] Stuck release cleaned up"
          } else {
            Write-Host "[OK] No stuck releases found"
          }

      - name: Monitor deployment progress (background)
        if: github.event_name != 'pull_request'
        run: |
          Start-Job -ScriptBlock {
            $namespace = "${{ env.NAMESPACE }}"
            Start-Sleep -Seconds 5
            
            for ($i = 0; $i -lt 90; $i++) {
              Write-Host "`n=== Deployment Progress (${i}0s) ==="
              kubectl get pods -n $namespace -o wide 2>$null
              kubectl get jobs -n $namespace 2>$null
              Start-Sleep -Seconds 10
            }
          } | Out-Null

      - name: Deploy with Helm
        if: github.event_name != 'pull_request'
        id: helm_deploy
        run: |
          Write-Host "Deploying DataEngine via Helm..."
          Write-Host "[INFO] Timeout: ${{ env.HELM_TIMEOUT }}"
          Write-Host "[INFO] Atomic rollback: DISABLED (for better debugging)"
          $deployStart = Get-Date
          
          # Deploy without --atomic for better error visibility
          helm upgrade --install dataengine DataEngine/k8s/data-engine-helm `
            --namespace ${{ env.NAMESPACE }} `
            --create-namespace `
            --set image.repository=${{ env.IMAGE_NAME }} `
            --set image.tag=${{ github.sha }} `
            --set image.pullSecrets[0].name=ghcr-secret `
            --set customPostgresql.enabled=false `
            --set customRedis.enabled=false `
            --set externalDatabase.enabled=true `
            --set externalDatabase.host=${{ env.POSTGRES_HOST }} `
            --set externalDatabase.port=${{ env.POSTGRES_PORT }} `
            --set externalDatabase.database=${{ env.POSTGRES_DB }} `
            --set externalDatabase.username=${{ env.POSTGRES_USER }} `
            --set externalDatabase.existingSecret=postgresql-credentials `
            --set externalRedis.enabled=true `
            --set externalRedis.host=${{ env.REDIS_HOST }} `
            --set externalRedis.port=${{ env.REDIS_PORT }} `
            --set externalRedis.existingSecret=redis-credentials `
            --set secrets.database.enabled=true `
            --set secrets.database.username=${{ env.POSTGRES_USER }} `
            --set secrets.database.password=${{ env.POSTGRES_PASSWORD }} `
            --set secrets.redis.enabled=true `
            --set secrets.redis.password=${{ env.REDIS_PASSWORD }} `
            --set secrets.api_keys.enabled=true `
            --set secrets.api_keys.kraken_api_key=${{ env.KRAKEN_API_KEY }} `
            --set secrets.api_keys.kraken_secret_key=${{ env.KRAKEN_SECRET_KEY }} `
            --set migration.enabled=true `
            --wait `
            --timeout ${{ env.HELM_TIMEOUT }} `
            --debug
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "`n[FAIL] Helm deployment failed - checking status..."
            
            # Show current state
            Write-Host "`nCurrent pods:"
            kubectl get pods -n ${{ env.NAMESPACE }} -o wide
            
            Write-Host "`nCurrent jobs:"
            kubectl get jobs -n ${{ env.NAMESPACE }}
            
            Write-Host "`nRecent events:"
            kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | Select-Object -Last 30
            
            Write-Error "Helm deployment failed"
            exit 1
          }
          
          $deployDuration = (Get-Date) - $deployStart
          Write-Host "[OK] Deployment completed in $($deployDuration.TotalMinutes.ToString('F2')) minutes"

      - name: Verify deployment
        if: success() && github.event_name != 'pull_request'
        run: |
          Write-Host "Verifying deployment health..."
          
          # Wait for pods to be ready
          Write-Host "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=data-engine -n ${{ env.NAMESPACE }} --timeout=300s
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Pods failed to become ready"
            exit 1
          }
          
          # Health check with retries
          Write-Host "`nChecking application health (with retries)..."
          $podName = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=data-engine -o jsonpath='{.items[0].metadata.name}'
          
          $maxRetries = ${{ env.HEALTH_CHECK_RETRIES }}
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            $retryCount++
            Write-Host "Health check attempt $retryCount of $maxRetries..."
            
            kubectl exec -n ${{ env.NAMESPACE }} $podName -- wget -q -O- http://localhost:8080/health 2>&1 | Out-Null
            
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              Write-Host "[OK] Health check passed"
            } else {
              if ($retryCount -lt $maxRetries) {
                Write-Host "Health check failed, retrying in ${{ env.HEALTH_CHECK_INTERVAL }} seconds..."
                Start-Sleep -Seconds ${{ env.HEALTH_CHECK_INTERVAL }}
              }
            }
          }
          
          if (-not $success) {
            Write-Host "[WARN] Warning: Health check endpoint not responding after $maxRetries attempts"
          }
          
          Write-Host "`n[OK] Deployment verification completed"

      - name: Rollback on failure
        if: failure() && steps.helm_deploy.outcome == 'failure'
        run: |
          Write-Host "[WARN] Deployment failed, attempting recovery..."
          
          # Check if there's a previous version to rollback to
          $history = helm history dataengine -n ${{ env.NAMESPACE }} -o json 2>$null | ConvertFrom-Json
          
          if ($history -and $history.Count -gt 1) {
            Write-Host "Found previous version (revision $($history[-2].revision)), rolling back..."
            helm rollback dataengine -n ${{ env.NAMESPACE }} --wait --timeout=5m
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "[OK] Successfully rolled back to previous version"
            } else {
              Write-Error "Rollback failed, deployment is in unstable state"
              exit 1
            }
          } else {
            Write-Host "No previous version to rollback to, uninstalling failed release..."
            helm uninstall dataengine -n ${{ env.NAMESPACE }} --wait --timeout=5m
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "[OK] Failed release uninstalled cleanly"
            } else {
              Write-Error "Uninstall failed, manual intervention may be required"
              exit 1
            }
          }

      - name: Show deployment status
        if: always() && github.event_name != 'pull_request'
        run: |
          Write-Host "`n=========================================="
          Write-Host "DEPLOYMENT STATUS REPORT"
          Write-Host "==========================================`n"
          
          Write-Host "=== Helm Release Status ==="
          helm status dataengine -n ${{ env.NAMESPACE }} 2>&1
          if ($LASTEXITCODE -ne 0) { 
            Write-Host "[WARN] Helm release not found" 
          }
          
          Write-Host "`n=== Kubernetes Resources ==="
          Write-Host "`nPods:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "No pods found" }
          
          Write-Host "`nServices:"
          kubectl get services -n ${{ env.NAMESPACE }} 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "No services found" }
          
          Write-Host "`nJobs:"
          kubectl get jobs -n ${{ env.NAMESPACE }} 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "No jobs found" }
          
          Write-Host "`n=== Recent Events (Last 20) ==="
          $events = kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' 2>&1
          if ($LASTEXITCODE -eq 0) {
            $events | Select-Object -Last 20
          } else {
            Write-Host "No events found"
          }
          
          # Show logs on failure
          if ("${{ steps.helm_deploy.outcome }}" -eq "failure") {
            Write-Host "`n=== Application Logs (Last 100 lines) ==="
            $pods = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=data-engine -o jsonpath='{.items[*].metadata.name}' 2>&1
            if ($LASTEXITCODE -eq 0 -and $pods) {
              foreach ($pod in $pods.Split(' ')) {
                Write-Host "`n--- Pod: $pod ---"
                kubectl logs -n ${{ env.NAMESPACE }} $pod --tail=100 2>&1
              }
            } else {
              Write-Host "No application pods found"
            }
            
            Write-Host "`n=== Migration Job Logs ==="
            $jobPods = kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/component=migration -o jsonpath='{.items[*].metadata.name}' 2>&1
            if ($LASTEXITCODE -eq 0 -and $jobPods) {
              foreach ($jobPod in $jobPods.Split(' ')) {
                Write-Host "`n--- Job Pod: $jobPod ---"
                kubectl logs -n ${{ env.NAMESPACE }} $jobPod --tail=50 2>&1
              }
            } else {
              Write-Host "No migration job pods found"
            }
          }
          
          Write-Host "`n=========================================="
          Write-Host "END OF DEPLOYMENT STATUS REPORT"
          Write-Host "=========================================="

      - name: Send deployment notification
        if: always() && github.event_name != 'pull_request'
        run: |
          $status = if ("${{ steps.helm_deploy.outcome }}" -eq "success") { "SUCCESS" } else { "FAILED" }
          $emoji = if ($status -eq "SUCCESS") { "[OK]" } else { "[FAIL]" }
          $color = if ($status -eq "SUCCESS") { "green" } else { "red" }
          
          Write-Host "`n=========================================="
          Write-Host "$emoji DEPLOYMENT $status"
          Write-Host "=========================================="
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Triggered by: ${{ github.actor }}"
          Write-Host "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          Write-Host "Namespace: ${{ env.NAMESPACE }}"
          Write-Host "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Write-Host "=========================================="
          
          # TODO: Add Slack/Teams/Discord webhook notification here
          # Example for future implementation:
          # $webhookUrl = "${{ secrets.SLACK_WEBHOOK_URL }}"
          # if ($webhookUrl) {
          #   $payload = @{
          #     text = "$emoji Deployment $status - ${{ github.repository }}"
          #     attachments = @(
          #       @{
          #         color = $color
          #         fields = @(
          #           @{ title = "Branch"; value = "${{ github.ref_name }}"; short = $true }
          #           @{ title = "Status"; value = $status; short = $true }
          #           @{ title = "Commit"; value = "${{ github.sha }}".Substring(0,7); short = $true }
          #           @{ title = "Author"; value = "${{ github.actor }}"; short = $true }
          #         )
          #       }
          #     )
          #   } | ConvertTo-Json -Depth 10
          #   Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType 'application/json'
          # }

      - name: Deployment Summary
        if: always()
        run: |
          Write-Host "`n=========================================="
          Write-Host "WORKFLOW SUMMARY"
          Write-Host "==========================================" 
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Branch: ${{ github.ref_name }}"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Actor: ${{ github.actor }}"
          Write-Host "Event: ${{ github.event_name }}"
          
          if ("${{ github.event_name }}" -eq "pull_request") {
            Write-Host "`n[OK] BUILD ONLY - Pull Request"
            Write-Host "Image built and pushed to registry"
            Write-Host "Deployment skipped for PR builds"
          } elseif ("${{ steps.helm_deploy.outcome }}" -eq "success") {
            Write-Host "`n[OK] DEPLOYMENT SUCCESSFUL"
            Write-Host "Namespace: ${{ env.NAMESPACE }}"
            Write-Host "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
            Write-Host "Helm Release: dataengine"
          } elseif ("${{ steps.helm_deploy.outcome }}" -eq "failure") {
            Write-Host "`n[INFO] DEPLOYMENT FAILED"
            Write-Host "Check logs above for details"
            Write-Host "Rollback status: See 'Rollback on failure' step"
          } else {
            Write-Host "`n[WARN] DEPLOYMENT SKIPPED OR INCOMPLETE"
          }
          
          Write-Host "=========================================="

      - name: Cleanup runner workspace
        if: always()
        run: |
          Write-Host "Cleaning up runner workspace..."
          
          # Remove old Docker images (keep last 3 versions)
          $images = docker images ${{ env.IMAGE_NAME }} --format "{{.ID}} {{.Tag}}" | Where-Object { $_ -notmatch "latest" }
          if ($images) {
            $imageList = $images -split "`n" | Select-Object -Skip 3
            if ($imageList.Count -gt 0) {
              Write-Host "Removing $($imageList.Count) old image(s)..."
              $imageList | ForEach-Object {
                $imageId = ($_ -split " ")[0]
                docker rmi $imageId -f 2>$null
              }
              Write-Host "[OK] Old images cleaned up"
            } else {
              Write-Host "[INFO] No old images to clean up"
            }
          }
          
          # Clean up dangling images
          $danglingImages = docker images -f "dangling=true" -q
          if ($danglingImages) {
            Write-Host "Removing dangling images..."
            docker rmi $danglingImages -f 2>$null
            Write-Host "[OK] Dangling images removed"
          }
          
          # Show disk space
          Write-Host "`nDisk space after cleanup:"
          Get-PSDrive C | Select-Object @{Name="Drive";Expression={$_.Name}}, @{Name="Used(GB)";Expression={[math]::Round($_.Used/1GB,2)}}, @{Name="Free(GB)";Expression={[math]::Round($_.Free/1GB,2)}}, @{Name="Total(GB)";Expression={[math]::Round(($_.Used+$_.Free)/1GB,2)}}
          
          Write-Host "[OK] Cleanup completed"
