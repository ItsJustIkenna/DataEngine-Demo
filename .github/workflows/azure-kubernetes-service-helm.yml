# Comprehensive CI/CD pipeline for DataEngine with testing, security, and deployment
# This workflow implements secure deployment practices with comprehensive test coverage

name: Build, Test, and Deploy DataEngine to AKS

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

env:
  AZURE_CONTAINER_REGISTRY: "tradingbotregistry"
  CONTAINER_NAME: "dataengine"
  RESOURCE_GROUP: "aks-trading-bot-rg"
  CLUSTER_NAME: "trading-bot-cluster"
  CHART_PATH: "./k8s/data-engine-helm"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Comprehensive Testing Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [1.80.0, 1.82.0]
        include:
          - rust-version: 1.82.0
            continue-on-error: false
          - rust-version: 1.80.0
            continue-on-error: true

    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils
      
      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          path: MessageBrokerEngine

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy
          override: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            DataEngine
            databaseschema
            redisutils
            LoggingEngine
            MessageBrokerEngine
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libpq-dev

      - name: Run cargo test on all workspaces
        run: |
          echo "🧪 Running cargo test on DataEngine workspace..."
          cd DataEngine && cargo test --verbose
          
          echo "🧪 Running cargo test on databaseschema..."
          cd ../databaseschema && cargo test --verbose
          
          echo "🧪 Running cargo test on redisutils..."
          cd ../redisutils && cargo test --verbose
          
          echo "🧪 Running cargo test on LoggingEngine..."
          cd ../LoggingEngine && cargo test --verbose
          
          echo "🧪 Running cargo test on MessageBrokerEngine..."
          cd ../MessageBrokerEngine && cargo test --verbose

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: DataEngine
        run: |
          echo "🔒 Running security audit..."
          cargo audit

      - name: Check for vulnerabilities
        working-directory: DataEngine
        run: |
          echo "🛡️ Checking for known vulnerabilities..."
          cargo audit --deny warnings

  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      secrets-valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          missing_secrets=""
          
          # Azure Authentication Secrets
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            missing_secrets="$missing_secrets AZURE_CLIENT_ID"
          fi
          
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            missing_secrets="$missing_secrets AZURE_TENANT_ID"
          fi
          
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            missing_secrets="$missing_secrets AZURE_SUBSCRIPTION_ID"
          fi
          
          # Production Database Secrets
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            missing_secrets="$missing_secrets DATABASE_URL"
          fi

          # Redis Secrets
          if [ -z "${{ secrets.REDIS_PASSWORD }}" ]; then
            missing_secrets="$missing_secrets REDIS_PASSWORD"
          fi

          if [ -n "$missing_secrets" ]; then
            echo "❌ Missing required secrets:$missing_secrets"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All required secrets are present"
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

  determine-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    needs: [test, security-audit, validate-secrets]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      namespace: ${{ steps.env.outputs.namespace }}
      values-file: ${{ steps.env.outputs.values-file }}
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="production"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          
          if [ "$ENV" = "production" ]; then
            echo "namespace=trading-platform-prod" >> $GITHUB_OUTPUT
            echo "values-file=values-prod.yaml" >> $GITHUB_OUTPUT
          else
            echo "namespace=trading-platform-dev" >> $GITHUB_OUTPUT
            echo "values-file=values-dev.yaml" >> $GITHUB_OUTPUT
          fi
          
          echo "🎯 Target environment: $ENV"

  buildImage:
    name: Build and Push Optimized Container
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [test, security-audit, determine-environment]
    steps:
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          
      - uses: actions/checkout@v4

      - name: Checkout dependencies
        run: |
          echo "📦 Checking out all workspace dependencies..."
          git clone https://github.com/Nwagbara-Group-LLC/databaseschema.git
          git clone https://github.com/Nwagbara-Group-LLC/redisutils.git
          git clone https://github.com/Nwagbara-Group-LLC/LoggingEngine.git
          git clone https://github.com/Nwagbara-Group-LLC/MessageBrokerEngine.git

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
      - name: Build and push optimized image
        run: |
          echo "🏗️ Building ultra-optimized DataEngine container..."
          az acr build \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:latest \
            --registry ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --file DataEngine/Dockerfile \
            --platform linux/amd64 \
            .
          echo "✅ Optimized image built and pushed successfully"

  deploy:
    name: Deploy to Kubernetes
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [buildImage, determine-environment]
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Create namespace
        run: |
          kubectl create namespace ${{ needs.determine-environment.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace ready: ${{ needs.determine-environment.outputs.namespace }}"
            
      - name: Deploy with Helm
        run: |
          echo "🚀 Deploying DataEngine to ${{ needs.determine-environment.outputs.environment }}..."
          
          helm upgrade --install dataengine ${{ env.CHART_PATH }} \
            --namespace ${{ needs.determine-environment.outputs.namespace }} \
            --create-namespace \
            --values ${{ env.CHART_PATH }}/${{ needs.determine-environment.outputs.values-file }} \
            --set image.repository=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set-string secrets.database.url="${{ secrets.DATABASE_URL }}" \
            --set-string secrets.redis.password="${{ secrets.REDIS_PASSWORD }}" \
            --set secrets.database.enabled=true \
            --set secrets.redis.enabled=true \
            --timeout 10m \
            --wait
          
          echo "✅ DataEngine deployed successfully"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment health..."
          kubectl get pods -n ${{ needs.determine-environment.outputs.namespace }} -l app=dataengine
          kubectl get services -n ${{ needs.determine-environment.outputs.namespace }} -l app=dataengine
          
          kubectl wait --for=condition=ready pod \
            -l app=dataengine \
            -n ${{ needs.determine-environment.outputs.namespace }} \
            --timeout=300s
          
          echo "✅ Deployment verification complete"
