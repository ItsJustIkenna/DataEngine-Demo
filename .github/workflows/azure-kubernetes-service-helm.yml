# Secure Azure Kubernetes Service deployment workflow for DataEngine
# This workflow implements secure deployment practices with proper secret management

name: Build and deploy DataEngine to AKS with Helm (Secure)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

env:
  AZURE_CONTAINER_REGISTRY: "tradingbotregistry"
  CONTAINER_NAME: "data-engine"
  RESOURCE_GROUP: "aks-trading-bot-rg"
  CLUSTER_NAME: "trading-bot-cluster"
  CHART_PATH: "./k8s/data-engine-helm"

jobs:
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    outputs:
      secrets-valid: ${{ steps.check.outputs.valid }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          missing_secrets=""
          
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            missing_secrets="$missing_secrets AZURE_CLIENT_ID"
          fi
          
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            missing_secrets="$missing_secrets AZURE_TENANT_ID"
          fi
          
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            missing_secrets="$missing_secrets AZURE_SUBSCRIPTION_ID"
          fi
          
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            missing_secrets="$missing_secrets DATABASE_URL"
          fi
          
          if [ -z "${{ secrets.REDIS_PASSWORD }}" ]; then
            missing_secrets="$missing_secrets REDIS_PASSWORD"
          fi
          
          # Note: You might need separate secrets for dev/prod environments
          # Example: DATABASE_URL_DEV, DATABASE_URL_PROD, etc.
          
          if [ -n "$missing_secrets" ]; then
            echo "❌ Missing required secrets:$missing_secrets"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All required secrets are present"
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

  determine-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    needs: validate-secrets
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      namespace: ${{ steps.env.outputs.namespace }}
      values-file: ${{ steps.env.outputs.values-file }}
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="production"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          
          if [ "$ENV" = "production" ]; then
            echo "namespace=trading-platform-prod" >> $GITHUB_OUTPUT
            echo "values-file=values-prod.yaml" >> $GITHUB_OUTPUT
            VALUES_FILE="values-prod.yaml"
          else
            echo "namespace=trading-platform-dev" >> $GITHUB_OUTPUT
            echo "values-file=values-dev.yaml" >> $GITHUB_OUTPUT
            VALUES_FILE="values-dev.yaml"
          fi
          
          echo "🎯 Target environment: $ENV"
          echo "📁 Values file: ${VALUES_FILE}"

  buildImage:
    name: Build and Push Container Image
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [validate-secrets, determine-environment]
    steps:
      - name: Check GitHub repository info
        run: |
          response=$(curl -H "Authorization: token ${{ secrets.PERSONAL_ACCESS_TOKEN }}" https://api.github.com/repos/Nwagbara-Group-LLC/DataEngine)
          if echo "$response" | grep -q 'Not Found'; then
            echo "❌ GitHub repository Nwagbara-Group-LLC/DataEngine not found!"
            exit 1
          fi
          echo "✅ GitHub repository info found."
      # Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          
      # Checks out the repository this file is in
      - uses: actions/checkout@v4

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils
      
      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      # Logs in with your Azure credentials
      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
      # Builds and pushes an image up to your Azure Container Registry
      - name: Build and push image to ACR
        run: |
          echo "🏗️ Building container image..."
          az acr build --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} --registry ${{ env.AZURE_CONTAINER_REGISTRY }} -g ${{ env.RESOURCE_GROUP }} .
          echo "✅ Image built and pushed successfully"

  deploy:
    name: Deploy to Kubernetes
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [buildImage, determine-environment]
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      # Checks out the repository this file is in
      - uses: actions/checkout@v4

      # Logs in with your Azure credentials
      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Use kubelogin to configure your kubeconfig for Azure auth
      - name: Set up kubelogin for non-interactive login
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      # Retrieves your Azure Kubernetes Service cluster's kubeconfig file
      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      # Create namespace if it doesn't exist
      - name: Create namespace
        run: |
          kubectl create namespace ${{ needs.determine-environment.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace ${{ needs.determine-environment.outputs.namespace }} ready"
            
      # Deploy using Helm with secure secret injection
      - name: Deploy with Helm (Secure)
        run: |
          echo "🚀 Starting secure deployment to ${{ needs.determine-environment.outputs.environment }} environment..."
          echo "📁 Using values file: ${{ needs.determine-environment.outputs.values-file }}"
          
          helm upgrade --install data-engine ${{ env.CHART_PATH }} \
            --namespace ${{ needs.determine-environment.outputs.namespace }} \
            --create-namespace \
            --values ${{ env.CHART_PATH }}/${{ needs.determine-environment.outputs.values-file }} \
            --set image.repository=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }} \
            --set image.tag=${{ github.sha }} \
            --set-string secrets.database.url="${{ secrets.DATABASE_URL }}" \
            --set-string secrets.redis.password="${{ secrets.REDIS_PASSWORD }}" \
            --set secrets.database.enabled=true \
            --set secrets.redis.enabled=true \
            --timeout 10m \
            --wait
          
          echo "✅ DataEngine deployed successfully to ${{ needs.determine-environment.outputs.environment }}"

      # Verify deployment
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          kubectl get pods -n ${{ needs.determine-environment.outputs.namespace }} -l app=data-engine
          kubectl get services -n ${{ needs.determine-environment.outputs.namespace }} -l app=data-engine
          
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=data-engine -n ${{ needs.determine-environment.outputs.namespace }} --timeout=300s
          
          echo "✅ Deployment verification complete"
