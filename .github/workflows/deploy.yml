name: Deploy DataEngine Micr          Write-Host "[SETUP] Setting up Kubernetes context..." -ForegroundColor Yellowservice

on:
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io/nwagbara-group-llc
  IMAGE_NAME: data-engine
  NAMESPACE: dataengine-prod

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kubernetes Context
        shell: powershell
        run: |
          Write-Host "� Setting up Kubernetes context..." -ForegroundColor Yellow
          
          # Configure Docker Desktop Kubernetes context
          kubectl config set-cluster docker-desktop --server=https://kubernetes.docker.internal:6443 --insecure-skip-tls-verify=true
          kubectl config set-context docker-desktop --cluster=docker-desktop
          kubectl config use-context docker-desktop
          
          # Test Kubernetes connectivity
          $k8sReady = $false
          $attempts = 0
          $maxAttempts = 3
          
          while (-not $k8sReady -and $attempts -lt $maxAttempts) {
            $attempts++
            Write-Host "Testing Kubernetes connectivity (attempt $attempts/$maxAttempts)..." -ForegroundColor Gray
            
            try {
              $result = kubectl get nodes --request-timeout=10s 2>&1
              if ($LASTEXITCODE -eq 0 -and $result -notmatch "error:|EOF") {
                $k8sReady = $true
                Write-Host "[OK] Kubernetes cluster is ready!" -ForegroundColor Green
                break
              }
            } catch { }
            
            if ($attempts -lt $maxAttempts) {
              Start-Sleep 5
            }
          }
          
          if (-not $k8sReady) {
            Write-Host "❌ Cannot connect to Kubernetes cluster" -ForegroundColor Red
            Write-Host "Please ensure Docker Desktop Kubernetes is enabled" -ForegroundColor Red
            exit 1
          }
          
          # Install/Verify Helm
          Write-Host "[SETUP] Checking Helm installation..." -ForegroundColor Yellow
          if (!(Get-Command helm -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Helm..." -ForegroundColor Yellow
            winget install Helm.Helm --silent --accept-package-agreements --accept-source-agreements
          }
          
          helm version --short
          Write-Host "[OK] Kubernetes and Helm are ready!" -ForegroundColor Green

      - name: Create Helm Chart Structure
        shell: powershell
        run: |
          Write-Host "[CREATE] Creating Helm chart structure..." -ForegroundColor Yellow
          
          # Create chart directory
          if (Test-Path "dataengine-chart") {
            Remove-Item -Recurse -Force "dataengine-chart"
          }
          
          mkdir dataengine-chart/templates -Force
          
          # Create Chart.yaml
          $chartYaml = @"
          apiVersion: v2
          name: dataengine
          description: DataEngine Trading Platform Microservice
          version: 1.0.0
          appVersion: "latest"
          dependencies:
          - name: postgresql
            version: 12.x.x
            repository: https://charts.bitnami.com/bitnami
          - name: redis
            version: 18.x.x
            repository: https://charts.bitnami.com/bitnami
          - name: elasticsearch
            version: 19.x.x
            repository: https://helm.elastic.co
          "@
          
          $chartYaml | Out-File -FilePath "dataengine-chart/Chart.yaml" -Encoding UTF8
          
          # Create values.yaml
          $valuesYaml = @"
          global:
            imageRegistry: $env:REGISTRY
            imagePullSecrets:
              - ghcr-secret
          
          dataengine:
            image:
              repository: $env:REGISTRY/data-engine
              tag: latest
              pullPolicy: Always
            service:
              type: LoadBalancer
              port: 8080
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
                
          loggingengine:
            image:
              repository: $env:REGISTRY/logging-engine
              tag: latest
              pullPolicy: Always
            service:
              port: 8081
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          
          postgresql:
            enabled: true
            auth:
              database: trading_platform
              password: "${{ secrets.DATABASE_PASSWORD }}"
            primary:
              persistence:
                size: 20Gi
              resources:
                requests:
                  memory: 2Gi
                  cpu: 1000m
          
          redis:
            enabled: true
            auth:
              password: "${{ secrets.REDIS_PASSWORD }}"
            master:
              persistence:
                size: 8Gi
            replica:
              replicaCount: 1
          
          elasticsearch:
            enabled: true
            replicas: 1
            minimumMasterNodes: 1
            esConfig:
              elasticsearch.yml: |
                xpack.security.enabled: false
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
            volumeClaimTemplate:
              resources:
                requests:
                  storage: 10Gi
          "@
          
          $valuesYaml | Out-File -FilePath "dataengine-chart/values.yaml" -Encoding UTF8
          
          Write-Host "[OK] Helm chart structure created!" -ForegroundColor Green

      - name: Create Helm Templates
        shell: powershell
        run: |
          Write-Host "[CREATE] Creating Helm templates..." -ForegroundColor Yellow
          
          # Create DataEngine deployment template
          $dataEngineDeployment = @"
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ include "dataengine.fullname" . }}-app
            namespace: {{ .Release.Namespace }}
            labels:
              app: data-engine
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: data-engine
            template:
              metadata:
                labels:
                  app: data-engine
              spec:
                imagePullSecrets:
                {{- if .Values.global.imagePullSecrets }}
                {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
                {{- end }}
                containers:
                - name: data-engine
                  image: "{{ .Values.dataengine.image.repository }}:{{ .Values.dataengine.image.tag }}"
                  imagePullPolicy: {{ .Values.dataengine.image.pullPolicy }}
                  ports:
                  - containerPort: {{ .Values.dataengine.service.port }}
                  env:
                  - name: DATABASE_URL
                    value: "postgresql://postgres:{{ .Values.postgresql.auth.password }}@{{ include "dataengine.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
                  - name: REDIS_URL
                    value: "redis://:{{ .Values.redis.auth.password }}@{{ include "dataengine.fullname" . }}-redis-master:6379"
                  - name: LOGGING_ENGINE_URL
                    value: "http://{{ include "dataengine.fullname" . }}-logging:8081"
                  - name: ELASTICSEARCH_URL
                    value: "http://{{ include "dataengine.fullname" . }}-elasticsearch-master:9200"
                  {{- if .Values.dataengine.env.KRAKEN_API_KEY }}
                  - name: KRAKEN_API_KEY
                    value: "{{ .Values.dataengine.env.KRAKEN_API_KEY }}"
                  {{- end }}
                  {{- if .Values.dataengine.env.KRAKEN_SECRET_KEY }}
                  - name: KRAKEN_SECRET_KEY
                    value: "{{ .Values.dataengine.env.KRAKEN_SECRET_KEY }}"
                  {{- end }}
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: {{ .Values.dataengine.service.port }}
                    initialDelaySeconds: 60
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: {{ .Values.dataengine.service.port }}
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  resources:
                    {{- toYaml .Values.dataengine.resources | nindent 12 }}
          "@
          
          $dataEngineDeployment | Out-File -FilePath "dataengine-chart/templates/dataengine-deployment.yaml" -Encoding UTF8
          
          # Create DataEngine service template
          $dataEngineService = @"
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ include "dataengine.fullname" . }}-app
            namespace: {{ .Release.Namespace }}
          spec:
            selector:
              app: data-engine
            ports:
            - port: {{ .Values.dataengine.service.port }}
              targetPort: {{ .Values.dataengine.service.port }}
            type: {{ .Values.dataengine.service.type }}
          "@
          
          $dataEngineService | Out-File -FilePath "dataengine-chart/templates/dataengine-service.yaml" -Encoding UTF8
          
          # Create LoggingEngine deployment template
          $loggingEngineDeployment = @"
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ include "dataengine.fullname" . }}-logging
            namespace: {{ .Release.Namespace }}
            labels:
              app: logging-engine
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: logging-engine
            template:
              metadata:
                labels:
                  app: logging-engine
              spec:
                imagePullSecrets:
                {{- if .Values.global.imagePullSecrets }}
                {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
                {{- end }}
                containers:
                - name: logging-engine
                  image: "{{ .Values.loggingengine.image.repository }}:{{ .Values.loggingengine.image.tag }}"
                  imagePullPolicy: {{ .Values.loggingengine.image.pullPolicy }}
                  ports:
                  - containerPort: {{ .Values.loggingengine.service.port }}
                  env:
                  - name: ELASTICSEARCH_URL
                    value: "http://{{ include "dataengine.fullname" . }}-elasticsearch-master:9200"
                  - name: LOG_LEVEL
                    value: "INFO"
                  - name: SERVICE_NAME
                    value: "LoggingEngine"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: {{ .Values.loggingengine.service.port }}
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: {{ .Values.loggingengine.service.port }}
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  resources:
                    {{- toYaml .Values.loggingengine.resources | nindent 12 }}
          "@
          
          $loggingEngineDeployment | Out-File -FilePath "dataengine-chart/templates/logging-deployment.yaml" -Encoding UTF8
          
          # Create LoggingEngine service template
          $loggingEngineService = @"
          apiVersion: v1
          kind: Service
          metadata:
            name: {{ include "dataengine.fullname" . }}-logging
            namespace: {{ .Release.Namespace }}
          spec:
            selector:
              app: logging-engine
            ports:
            - port: {{ .Values.loggingengine.service.port }}
              targetPort: {{ .Values.loggingengine.service.port }}
          "@
          
          $loggingEngineService | Out-File -FilePath "dataengine-chart/templates/logging-service.yaml" -Encoding UTF8
          
          # Create helpers template
          $helpers = @"
          {{/*
          Expand the name of the chart.
          */}}
          {{- define "dataengine.name" -}}
          {{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" }}
          {{- end }}
          
          {{/*
          Create a default fully qualified app name.
          */}}
          {{- define "dataengine.fullname" -}}
          {{- if .Values.fullnameOverride }}
          {{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
          {{- else }}
          {{- `$name` := default .Chart.Name .Values.nameOverride }}
          {{- if contains `$name` .Release.Name }}
          {{- .Release.Name | trunc 63 | trimSuffix "-" }}
          {{- else }}
          {{- printf "%s-%s" .Release.Name `$name` | trunc 63 | trimSuffix "-" }}
          {{- end }}
          {{- end }}
          {{- end }}
          
          {{/*
          Create chart name and version as used by the chart label.
          */}}
          {{- define "dataengine.chart" -}}
          {{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
          {{- end }}
          "@
          
          $helpers | Out-File -FilePath "dataengine-chart/templates/_helpers.tpl" -Encoding UTF8
          
          Write-Host "[OK] Helm templates created!" -ForegroundColor Green

      - name: Deploy with Helm Chart
        shell: powershell
        run: |
          Write-Host "[DEPLOY] Deploying DataEngine with Helm chart..." -ForegroundColor Green
          
          # Create namespace
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Create GHCR image pull secret
          kubectl create secret docker-registry ghcr-secret `
            --namespace $env:NAMESPACE `
            --docker-server=ghcr.io `
            --docker-username="${{ github.actor }}" `
            --docker-password="${{ secrets.GITHUB_TOKEN }}" `
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Add required Helm repositories for dependencies
          Write-Host "Adding Helm repositories..." -ForegroundColor Yellow
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add elastic https://helm.elastic.co
          helm repo update
          
          # Build dependency charts
          Write-Host "Building Helm dependencies..." -ForegroundColor Yellow
          cd dataengine-chart
          helm dependency build
          cd ..
          
          # Deploy the complete stack with Helm
          Write-Host "[DEPLOY] Deploying complete DataEngine stack..." -ForegroundColor Yellow
          helm upgrade --install dataengine-stack ./dataengine-chart `
            --namespace $env:NAMESPACE `
            --set postgresql.auth.postgresPassword="${{ secrets.DATABASE_PASSWORD }}" `
            --set redis.auth.password="${{ secrets.REDIS_PASSWORD }}" `
            --set dataengine.env.KRAKEN_API_KEY="${{ secrets.KRAKEN_API_KEY }}" `
            --set dataengine.env.KRAKEN_SECRET_KEY="${{ secrets.KRAKEN_SECRET_KEY }}" `
            --wait --timeout=900s
          
          Write-Host "[OK] Helm deployment completed successfully!" -ForegroundColor Green



      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "[VERIFY] Verifying Helm deployment..." -ForegroundColor Yellow
          
          # Check Helm release status
          Write-Host "Checking Helm release status..." -ForegroundColor Gray
          helm list -n $env:NAMESPACE
          helm status dataengine-stack -n $env:NAMESPACE
          
          # Wait for pods to be ready
          Write-Host "Waiting for application pods to be ready..." -ForegroundColor Gray
          kubectl wait --for=condition=ready pod -l app=logging-engine --namespace $env:NAMESPACE --timeout=300s
          kubectl wait --for=condition=ready pod -l app=data-engine --namespace $env:NAMESPACE --timeout=300s
          
          # Show comprehensive deployment status
          Write-Host "`n[STATUS] Complete Deployment Status:" -ForegroundColor Cyan
          Write-Host "Pods:" -ForegroundColor White
          kubectl get pods -n $env:NAMESPACE -o wide
          
          Write-Host "`nServices:" -ForegroundColor White
          kubectl get services -n $env:NAMESPACE
          
          Write-Host "`nPersistent Volume Claims:" -ForegroundColor White
          kubectl get pvc -n $env:NAMESPACE
          
          # Get DataEngine service details
          Write-Host "`n[ACCESS] Service Access Information:" -ForegroundColor Cyan
          $serviceName = "dataengine-stack-app"
          
          try {
            $dataEngineService = kubectl get service $serviceName -n $env:NAMESPACE -o json | ConvertFrom-Json
            $serviceType = $dataEngineService.spec.type
            $servicePort = $dataEngineService.spec.ports[0].port
            
            Write-Host "DataEngine Service Details:" -ForegroundColor Green
            Write-Host "  Name: $serviceName" -ForegroundColor White
            Write-Host "  Type: $serviceType" -ForegroundColor White
            Write-Host "  Port: $servicePort" -ForegroundColor White
            
            if ($serviceType -eq "LoadBalancer") {
              Write-Host "  Internal: http://${serviceName}:${servicePort}" -ForegroundColor White
              Write-Host "  External: http://localhost:${servicePort} (via port-forward)" -ForegroundColor White
              
              # Set up port forwarding for local access
              Write-Host "Setting up port forwarding..." -ForegroundColor Gray
              Start-Process kubectl -ArgumentList "port-forward service/$serviceName ${servicePort}:${servicePort} -n $env:NAMESPACE" -WindowStyle Hidden
              Start-Sleep 15
            }
          } catch {
            Write-Host "Could not get service details: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host "Available services:" -ForegroundColor Gray
            kubectl get services -n $env:NAMESPACE --no-headers
          }
          
          # Health check with retry logic
          Write-Host "`n[HEALTH] Performing health checks..." -ForegroundColor Yellow
          $maxRetries = 3
          $retryCount = 0
          $healthCheckPassed = $false
          
          while ($retryCount -lt $maxRetries -and -not $healthCheckPassed) {
            $retryCount++
            Write-Host "Health check attempt $retryCount/$maxRetries..." -ForegroundColor Gray
            
            try {
              $health = Invoke-RestMethod -Uri "http://localhost:8080/health" -TimeoutSec 20
              Write-Host "`n[OK] DataEngine is healthy!" -ForegroundColor Green
              Write-Host "Response: $($health | ConvertTo-Json -Compress)" -ForegroundColor Gray
              $healthCheckPassed = $true
            } catch {
              Write-Host "`n⚠️ Health check attempt $retryCount failed: $($_.Exception.Message)" -ForegroundColor Yellow
              
              if ($retryCount -eq $maxRetries) {
                Write-Host "Checking pod logs for troubleshooting..." -ForegroundColor Gray
                try {
                  kubectl logs -l app=data-engine -n $env:NAMESPACE --tail=20
                } catch {
                  Write-Host "Could not retrieve logs" -ForegroundColor Red
                }
              } else {
                Start-Sleep 10
              }
            }
          }
          
          # Final deployment summary
          Write-Host "`n[SUCCESS] Helm + Kubernetes deployment completed!" -ForegroundColor Green
          Write-Host "[SUMMARY] Deployment Summary:" -ForegroundColor Cyan
          Write-Host "  • Helm Release: dataengine-stack" -ForegroundColor White
          Write-Host "  • Namespace: $env:NAMESPACE" -ForegroundColor White
          Write-Host "  • DataEngine: http://localhost:8080" -ForegroundColor White
          Write-Host "  • LoggingEngine: http://localhost:8081" -ForegroundColor White
          
          # Show resource usage
          Write-Host "`n[METRICS] Resource Usage:" -ForegroundColor Cyan
          kubectl top pods -n $env:NAMESPACE --no-headers 2>$null || Write-Host "Metrics not available (metrics-server may not be installed)" -ForegroundColor Gray