name: Deploy DataEngine

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/nwagbara-group-llc
  IMAGE_NAME: data-engine

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stub directories
        run: |
          mkdir -p databaseschema redisutils LoggingEngine MessageBrokerEngine
          mkdir -p LoggingEngine/ultra-logger/src
          echo '[package]\nname = "ultra-logger"\nversion = "0.1.0"\nedition = "2021"' > LoggingEngine/ultra-logger/Cargo.toml
          echo 'pub fn init() {}' > LoggingEngine/ultra-logger/src/lib.rs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -f Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
