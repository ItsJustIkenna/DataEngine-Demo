name: Deploy DataEngine with Helm + Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chart_path:
        description: 'Helm Chart Path'
        required: false
        default: './k8s/data-engine-helm/'
        type: string
      chart_override_path:
        description: 'Chart Override Values Path'
        required: false
        type: choice
        default: './k8s/data-engine-helm/values-database-only.yaml'
        options:
          - './k8s/data-engine-helm/values-database-only.yaml'
          - './k8s/data-engine-helm/values-prod.yaml'
          - './k8s/data-engine-helm/values-qa.yaml'
          - './k8s/data-engine-helm/values-dev.yaml'
          - 'none'
      namespace:
        description: 'Kubernetes Namespace'
        required: false
        default: 'dataengine'
        type: string
      release_name:
        description: 'Helm Release Name'
        required: false
        default: 'dataengine'
        type: string

env:
  REGISTRY: ghcr.io/nwagbara-group-llc
  IMAGE_NAME: data-engine
  CHART_PATH: ${{ github.event.inputs.chart_path || './k8s/data-engine-helm/' }}
  CHART_OVERRIDE_PATH: ${{ github.event.inputs.chart_override_path || './k8s/data-engine-helm/values-database-only.yaml' }}
  NAMESPACE: ${{ github.event.inputs.namespace || 'dataengine' }}
  RELEASE_NAME: ${{ github.event.inputs.release_name || 'dataengine' }}

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Checkout databaseschema (public)
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout redisutils (public)
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils

      - name: Checkout LoggingEngine (optional - requires PERSONAL_ACCESS_TOKEN)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Checkout MessageBrokerEngine (optional - requires PERSONAL_ACCESS_TOKEN)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Deploy Filebeat to Elastic Cloud
        shell: powershell
        env:
          ELASTIC_CLOUD_ID: ${{ secrets.ELASTIC_CLOUD_ID }}
          ELASTIC_CLOUD_AUTH: ${{ secrets.ELASTIC_CLOUD_AUTH }}
        run: |
          Write-Host "Deploying Filebeat to send logs to Elastic Cloud..." -ForegroundColor Yellow
          
          if (-not $env:ELASTIC_CLOUD_ID -or -not $env:ELASTIC_CLOUD_AUTH) {
            Write-Host "WARNING: ELASTIC_CLOUD_ID or ELASTIC_CLOUD_AUTH not set. Skipping Filebeat deployment." -ForegroundColor Yellow
            Write-Host "To enable logging to Elastic Cloud, add these secrets to your repository:" -ForegroundColor Gray
            Write-Host "  - ELASTIC_CLOUD_ID: Your Elastic Cloud ID" -ForegroundColor Gray
            Write-Host "  - ELASTIC_CLOUD_AUTH: username:password (e.g., elastic:yourpassword)" -ForegroundColor Gray
            exit 0
          }
          
          # Add Elastic Helm repository
          helm repo add elastic https://helm.elastic.co 2>&1 | Out-Null
          helm repo update 2>&1 | Out-Null
          
          # Create logging namespace
          kubectl create namespace logging --dry-run=client -o yaml | kubectl apply -f -
          
          # Deploy Filebeat configured for Elastic Cloud
          Write-Host "Deploying Filebeat..." -ForegroundColor Cyan
          helm upgrade --install filebeat elastic/filebeat `
            --namespace logging `
            --set config.cloud.id="$env:ELASTIC_CLOUD_ID" `
            --set config.cloud.auth="$env:ELASTIC_CLOUD_AUTH" `
            --set resources.requests.cpu=100m `
            --set resources.requests.memory=128Mi `
            --set resources.limits.cpu=200m `
            --set resources.limits.memory=256Mi `
            --timeout 5m `
            --wait
          
          Write-Host "Filebeat deployed successfully! Logs will appear in your Elastic Cloud Kibana." -ForegroundColor Green

      - name: Clean Existing Deployment (Remove Bitnami Resources)
        shell: powershell
        run: |
          Write-Host "Cleaning existing deployment and Bitnami resources..." -ForegroundColor Yellow
          
          # Check if release exists
          $releaseExists = helm list -n $env:NAMESPACE 2>&1 | Select-String -Pattern $env:RELEASE_NAME
          
          if ($releaseExists) {
            Write-Host "Found existing Helm release '$env:RELEASE_NAME'. Deleting..." -ForegroundColor Yellow
            
            # CRITICAL: Delete the namespace entirely to purge ALL Helm release history stored in secrets
            Write-Host "PURGING namespace to remove Helm release history from Kubernetes..." -ForegroundColor Red
            kubectl delete namespace $env:NAMESPACE --ignore-not-found=true 2>&1 | Out-Null
            
            # Wait for namespace to be fully deleted
            Write-Host "Waiting for namespace deletion to complete..." -ForegroundColor Yellow
            $maxWait = 60
            $waited = 0
            while ($waited -lt $maxWait) {
              $ErrorActionPreference = 'SilentlyContinue'
              $nsCheck = kubectl get namespace $env:NAMESPACE 2>&1
              $ErrorActionPreference = 'Continue'
              
              if ($nsCheck -match "NotFound" -or $nsCheck -match "not found") {
                break
              }
              
              Start-Sleep -Seconds 2
              $waited += 2
              Write-Host "." -NoNewline -ForegroundColor Gray
            }
            Write-Host ""
            Write-Host "Namespace deleted - ALL Helm history purged!" -ForegroundColor Green
            
            # Recreate the namespace fresh
            kubectl create namespace $env:NAMESPACE 2>&1 | Out-Null
            Write-Host "Fresh namespace created" -ForegroundColor Green
          } else {
            Write-Host "No existing Helm release found" -ForegroundColor Gray
          }
          
          # Force delete any remaining Bitnami StatefulSets
          Write-Host "Checking for Bitnami StatefulSets..." -ForegroundColor Yellow
          try {
            $statefulsets = kubectl get statefulsets -n $env:NAMESPACE -o json 2>&1 | ConvertFrom-Json
            if ($statefulsets.items -and $statefulsets.items.Count -gt 0) {
              foreach ($sts in $statefulsets.items) {
                $name = $sts.metadata.name
                if ($name -match "postgresql|redis") {
                  Write-Host "Force deleting StatefulSet: $name" -ForegroundColor Yellow
                  kubectl delete statefulset $name -n $env:NAMESPACE --force --grace-period=0 --ignore-not-found=true 2>&1 | Out-Null
                }
              }
            } else {
              Write-Host "No StatefulSets found to delete" -ForegroundColor Gray
            }
          } catch {
            Write-Host "No StatefulSets found or error checking (this is OK)" -ForegroundColor Gray
          }
          
          # Force delete any remaining pods
          Write-Host "Checking for remaining pods..." -ForegroundColor Yellow
          try {
            $ErrorActionPreference = 'SilentlyContinue'
            $pods = kubectl get pods -n $env:NAMESPACE --no-headers 2>&1 | Where-Object { $_ -notmatch "No resources found" }
            $ErrorActionPreference = 'Continue'
            
            if ($pods -and $pods.Count -gt 0) {
              Write-Host "Deleting remaining pods..." -ForegroundColor Gray
              kubectl delete pods --all -n $env:NAMESPACE --force --grace-period=0 --ignore-not-found=true 2>&1 | Out-Null
            } else {
              Write-Host "No pods found to delete" -ForegroundColor Gray
            }
          } catch {
            Write-Host "No pods found or error checking (this is OK)" -ForegroundColor Gray
          }
          
          # Clean PVCs (optional - comment out if you want to preserve data)
          Write-Host "Cleaning PersistentVolumeClaims..." -ForegroundColor Yellow
          try {
            kubectl delete pvc --all -n $env:NAMESPACE --ignore-not-found=true 2>&1 | Out-Null
          } catch {
            Write-Host "No PVCs found or error deleting (this is OK)" -ForegroundColor Gray
          }
          
          # Clean secrets (to avoid Helm ownership conflicts)
          Write-Host "Cleaning existing secrets..." -ForegroundColor Yellow
          try {
            kubectl delete secret "$env:RELEASE_NAME-postgresql" -n $env:NAMESPACE --ignore-not-found=true 2>&1 | Out-Null
            kubectl delete secret "$env:RELEASE_NAME-redis" -n $env:NAMESPACE --ignore-not-found=true 2>&1 | Out-Null
          } catch {
            Write-Host "No secrets found or error deleting (this is OK)" -ForegroundColor Gray
          }
          
          Write-Host "Waiting for cleanup to complete..." -ForegroundColor Gray
          Start-Sleep -Seconds 15
          
          # Clean Helm chart cache
          Write-Host "Cleaning Helm chart cache..." -ForegroundColor Yellow
          $chartDir = "DataEngine/$env:CHART_PATH"
          if (Test-Path "$chartDir/charts") {
            Remove-Item "$chartDir/charts" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed entire charts directory" -ForegroundColor Green
          }
          if (Test-Path "$chartDir/Chart.lock") {
            Remove-Item "$chartDir/Chart.lock" -Force
            Write-Host "Removed Chart.lock" -ForegroundColor Green
          }
          
          # Also clean global Helm cache (AGGRESSIVE CLEANUP)
          Write-Host "Cleaning global Helm cache..." -ForegroundColor Yellow
          
          # Clean all possible Helm cache locations
          $helmCachePaths = @(
            "$env:LOCALAPPDATA\Temp\helm",
            "$env:LOCALAPPDATA\Temp\2\helm",
            "$env:TEMP\helm",
            "$env:TEMP\2\helm"
          )
          
          foreach ($cachePath in $helmCachePaths) {
            if (Test-Path $cachePath) {
              Write-Host "Removing cache at: $cachePath" -ForegroundColor Gray
              Remove-Item "$cachePath\*" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Remove Bitnami repository from Helm (if it exists)
          Write-Host "Removing Bitnami repository from Helm..." -ForegroundColor Yellow
          try {
            $helmRepos = helm repo list 2>&1 | Out-String
            if ($helmRepos -match "bitnami") {
              helm repo remove bitnami 2>&1 | Out-Null
              Write-Host "Removed Bitnami repository" -ForegroundColor Green
            } else {
              Write-Host "Bitnami repository not found (already removed)" -ForegroundColor Gray
            }
          } catch {
            Write-Host "No Helm repositories found or error checking (this is OK)" -ForegroundColor Gray
          }
          
          # Force rebuild Helm cache
          Write-Host "Rebuilding Helm repository cache..." -ForegroundColor Yellow
          helm repo update 2>&1 | Out-Null
          
          Write-Host "Cleanup complete! Ready for fresh deployment." -ForegroundColor Green

      - name: Deploy DataEngine with Helm
        shell: powershell
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'dataengine123' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}
          GHCR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          Write-Host "Deploying DataEngine to Kubernetes..." -ForegroundColor Yellow
          Write-Host "Chart Path: $env:CHART_PATH" -ForegroundColor Cyan
          Write-Host "Namespace: $env:NAMESPACE" -ForegroundColor Cyan
          Write-Host "Release Name: $env:RELEASE_NAME" -ForegroundColor Cyan
          
          # Create namespace if it doesn't exist
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Create image pull secret for GHCR
          Write-Host "Creating image pull secret for GitHub Container Registry..." -ForegroundColor Yellow
          
          # Delete existing secret first to avoid stale credentials
          kubectl delete secret ghcr-secret --namespace $env:NAMESPACE --ignore-not-found=true 2>&1 | Out-Null
          
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username=${{ github.actor }} `
            --docker-password=$env:GHCR_TOKEN `
            --docker-email=${{ github.actor }}@users.noreply.github.com `
            --namespace $env:NAMESPACE
          
          # Verify the secret was created
          Write-Host "Verifying image pull secret..." -ForegroundColor Yellow
          kubectl get secret ghcr-secret -n $env:NAMESPACE -o yaml | Select-String -Pattern "\.dockerconfigjson"
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Image pull secret created successfully" -ForegroundColor Green
          } else {
            Write-Host "ERROR: Failed to create image pull secret" -ForegroundColor Red
            exit 1
          }
          
          # Note: We don't create secrets manually anymore - Helm will manage them
          # This avoids the "invalid ownership metadata" error
          
          # Check for stuck Helm operations and clean them up
          Write-Host "Checking for stuck Helm operations..." -ForegroundColor Yellow
          try {
            $ErrorActionPreference = 'SilentlyContinue'
            $helmStatus = helm status $env:RELEASE_NAME --namespace $env:NAMESPACE 2>&1 | Out-String
            $ErrorActionPreference = 'Continue'
            
            if ($LASTEXITCODE -eq 0 -and $helmStatus -match "STATUS:\s*(pending-install|pending-upgrade|pending-rollback)") {
              Write-Host "WARNING: Found stuck Helm operation. Deleting release..." -ForegroundColor Yellow
              helm delete $env:RELEASE_NAME --namespace $env:NAMESPACE 2>&1 | Out-Null
              Start-Sleep -Seconds 5
              Write-Host "Release deleted. Proceeding with fresh installation..." -ForegroundColor Green
            } else {
              Write-Host "No stuck Helm operations found" -ForegroundColor Gray
            }
          } catch {
            Write-Host "No existing release or error checking (this is OK)" -ForegroundColor Gray
          }
          
          # Build Helm command
          $imageRepository = "$env:REGISTRY/$env:IMAGE_NAME"
          
          # CRITICAL: Remove charts directory RIGHT BEFORE deployment
          Write-Host "`nCRITICAL: Final cleanup of charts directory..." -ForegroundColor Magenta
          $chartPath = "DataEngine/$env:CHART_PATH"
          if (Test-Path "$chartPath/charts") {
            Write-Host "Removing charts/ directory..." -ForegroundColor Yellow
            Remove-Item "$chartPath/charts" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Charts directory removed!" -ForegroundColor Green
          } else {
            Write-Host "Charts directory does not exist (GOOD!)" -ForegroundColor Green
          }
          
          if (Test-Path "$chartPath/Chart.lock") {
            Write-Host "Removing Chart.lock..." -ForegroundColor Yellow
            Remove-Item "$chartPath/Chart.lock" -Force -ErrorAction SilentlyContinue
            Write-Host "Chart.lock removed!" -ForegroundColor Green
          } else {
            Write-Host "Chart.lock does not exist (GOOD!)" -ForegroundColor Green
          }
          
          # DEBUG: Show what Chart.yaml actually contains
          Write-Host "`nDEBUG: Checking Chart.yaml contents..." -ForegroundColor Magenta
          if (Test-Path "$chartPath/Chart.yaml") {
            Write-Host "Chart.yaml contents:" -ForegroundColor Gray
            Get-Content "$chartPath/Chart.yaml" | Write-Host
          } else {
            Write-Host "ERROR: Chart.yaml not found at $chartPath/Chart.yaml" -ForegroundColor Red
          }
          
          # DEBUG: Check Helm dependency list
          Write-Host "`nDEBUG: Checking Helm dependencies..." -ForegroundColor Magenta
          try {
            helm dependency list "$chartPath" 2>&1 | Write-Host
          } catch {
            Write-Host "No dependencies or error listing" -ForegroundColor Gray
          }
          
          # DEBUG: List all templates
          Write-Host "`nDEBUG: Listing templates directory..." -ForegroundColor Magenta
          if (Test-Path "$chartPath/templates") {
            Get-ChildItem "$chartPath/templates" | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          }
          
          # DEBUG: Check if custom StatefulSet templates exist
          Write-Host "`nDEBUG: Checking for custom database templates..." -ForegroundColor Magenta
          if (Test-Path "$chartPath/templates/postgresql-deployment.yaml") {
            Write-Host "FOUND: postgresql-deployment.yaml" -ForegroundColor Green
            Write-Host "First 10 lines:" -ForegroundColor Gray
            Get-Content "$chartPath/templates/postgresql-deployment.yaml" -First 10 | Write-Host
          } else {
            Write-Host "MISSING: postgresql-deployment.yaml" -ForegroundColor Red
          }
          if (Test-Path "$chartPath/templates/redis-deployment.yaml") {
            Write-Host "FOUND: redis-deployment.yaml" -ForegroundColor Green  
            Write-Host "First 10 lines:" -ForegroundColor Gray
            Get-Content "$chartPath/templates/redis-deployment.yaml" -First 10 | Write-Host
          } else {
            Write-Host "MISSING: redis-deployment.yaml" -ForegroundColor Red
          }
          
          # DEBUG: Show current values for customPostgresql and customRedis
          Write-Host "`nDEBUG: Checking values that will be passed to Helm..." -ForegroundColor Magenta
          Write-Host "customPostgresql.enabled will be set to: true" -ForegroundColor Cyan
          Write-Host "customRedis.enabled will be set to: true" -ForegroundColor Cyan
          
          # DEBUG: Check if charts directory gets created DURING helm command
          Write-Host "`nDEBUG: Chart directory state BEFORE helm command:" -ForegroundColor Magenta
          if (Test-Path "$chartPath/charts") {
            Write-Host "WARNING: charts/ directory EXISTS before helm command!" -ForegroundColor Red
            Get-ChildItem "$chartPath/charts" -Recurse | Select-Object FullName | Write-Host
          } else {
            Write-Host "GOOD: No charts/ directory before helm command" -ForegroundColor Green
          }
          
          $helmArgs = @(
            "upgrade", "--install", $env:RELEASE_NAME
            $env:CHART_PATH
            "--namespace", $env:NAMESPACE
            "--create-namespace"
            "--dependency-update=false"
            "--timeout", "5m"
            "--set", "image.repository=${imageRepository}"
            "--set", "image.tag=latest"
            "--set", "image.pullPolicy=Always"
            "--set", "image.pullSecrets[0].name=ghcr-secret"
            "--set", "migration.enabled=true"
            "--set", "migration.image.repository=ghcr.io/nwagbara-group-llc/databaseschema"
            "--set", "migration.image.tag=latest"
            "--set", "migration.imagePullSecrets[0].name=ghcr-secret"
            "--set", "customRedis.enabled=true"
            "--set", "customRedis.image.registry=ghcr.io"
            "--set", "customRedis.image.repository=nwagbara-group-llc/redis-utils"
            "--set", "customRedis.image.tag=latest"
            "--set", "customRedis.image.pullSecrets[0].name=ghcr-secret"
            "--set", "customPostgresql.enabled=true"
            "--set", "customPostgresql.image.registry=ghcr.io"
            "--set", "customPostgresql.image.repository=baosystems/postgis"
            "--set", "customPostgresql.image.tag=15-3.3"
            "--set", "customPostgresql.image.pullSecrets[0].name=ghcr-secret"
            "--set", "customPostgresql.auth.username=dataengine"
            "--set", "customPostgresql.auth.password=$env:POSTGRES_PASSWORD"
            "--set", "customPostgresql.auth.database=dataengine"
            "--set", "monitoring.prometheus.enabled=false"
            "--set", "monitoring.grafana.enabled=false"
            "--set", "replicaCount=1"
          )
          
          # Add override file if specified and not 'none'
          # TEMPORARILY DISABLED: Override file conflicts with custom deployments
          # $overrideFile = $env:CHART_OVERRIDE_PATH
          # if ($overrideFile -and $overrideFile -ne "none" -and (Test-Path $overrideFile)) {
          #   Write-Host "Using override file: $overrideFile" -ForegroundColor Cyan
          #   $helmArgs += @("-f", $overrideFile)
          # } elseif ($overrideFile -and $overrideFile -ne "none") {
          #   Write-Host "WARNING: Override file not found: $overrideFile" -ForegroundColor Yellow
          #   Write-Host "Continuing with default values..." -ForegroundColor Gray
          # }
          Write-Host "Using inline --set values instead of override file" -ForegroundColor Cyan
          
          # Execute Helm deployment
          Write-Host "Executing: helm $($helmArgs -join ' ')" -ForegroundColor Gray
          & helm @helmArgs
          
          # DEBUG: Check if charts directory was created AFTER helm command
          Write-Host "`nDEBUG: Chart directory state AFTER helm command:" -ForegroundColor Magenta
          if (Test-Path "$chartPath/charts") {
            Write-Host "WARNING: charts/ directory was CREATED by helm command!" -ForegroundColor Red
            Write-Host "Listing contents:" -ForegroundColor Yellow
            Get-ChildItem "$chartPath/charts" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host "GOOD: No charts/ directory created" -ForegroundColor Green
          }
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS: Helm chart deployed" -ForegroundColor Green
            
            # DEBUG: Show what Helm actually generated
            Write-Host "`nDEBUG: Showing Helm manifest to verify StatefulSets..." -ForegroundColor Magenta
            Write-Host "Counting StatefulSets in manifest:" -ForegroundColor Yellow
            $manifest = helm get manifest $env:RELEASE_NAME -n $env:NAMESPACE
            $statefulSetCount = ($manifest | Select-String -Pattern "kind:\s*StatefulSet" -AllMatches).Matches.Count
            Write-Host "Found $statefulSetCount StatefulSet(s) in manifest" -ForegroundColor Cyan
            
            if ($statefulSetCount -eq 0) {
              Write-Host "WARNING: NO StatefulSets found in Helm manifest!" -ForegroundColor Red
              Write-Host "This means the templates did not render. Checking values..." -ForegroundColor Yellow
              helm get values $env:RELEASE_NAME -n $env:NAMESPACE
            } else {
              Write-Host "StatefulSets found in manifest:" -ForegroundColor Green
              $manifest | Select-String -Pattern "kind:\s*StatefulSet" -Context 3 | Write-Host
            }
            
            # Wait and check pod status
            Write-Host "`nWaiting for pods to be ready..." -ForegroundColor Yellow
            Start-Sleep -Seconds 10
            
            Write-Host "`nPod Status:" -ForegroundColor Cyan
            kubectl get pods -n $env:NAMESPACE -o wide
            
            Write-Host "`nChecking for ImagePullBackOff errors..." -ForegroundColor Yellow
            $imagePullErrors = kubectl get pods -n $env:NAMESPACE -o json | ConvertFrom-Json | 
              Select-Object -ExpandProperty items | 
              Where-Object { $_.status.containerStatuses.state.waiting.reason -match "ImagePull" }
            
            if ($imagePullErrors) {
              Write-Host "WARNING: Found ImagePullBackOff errors!" -ForegroundColor Red
              kubectl describe pods -n $env:NAMESPACE | Select-String -Pattern "Failed to pull image" -Context 2
            }
            
          } else {
            Write-Host "ERROR: Helm deployment failed" -ForegroundColor Red
            Write-Host "`nDiagnostic Information:" -ForegroundColor Yellow
            Write-Host "Pods status:" -ForegroundColor Cyan
            kubectl get pods -n $env:NAMESPACE -o wide
            Write-Host "`nEvents:" -ForegroundColor Cyan
            kubectl get events -n $env:NAMESPACE --sort-by='.lastTimestamp' | Select-Object -Last 20
            exit 1
          }

      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "Verifying deployment..." -ForegroundColor Yellow
          
          # List Helm releases
          Write-Host "`nHelm releases:" -ForegroundColor Cyan
          helm list -n $env:NAMESPACE
          helm status $env:RELEASE_NAME -n $env:NAMESPACE
          
          # Check Kubernetes resources
          Write-Host "`nKubernetes resources:" -ForegroundColor Cyan
          kubectl get deployments -n $env:NAMESPACE -l app.kubernetes.io/instance=$env:RELEASE_NAME
          kubectl get pods -n $env:NAMESPACE -l app.kubernetes.io/instance=$env:RELEASE_NAME
          kubectl get services -n $env:NAMESPACE -l app.kubernetes.io/instance=$env:RELEASE_NAME
          
          Write-Host "SUCCESS: Deployment verification complete" -ForegroundColor Green
