name: Deploy DataEngine with Helm + Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chart_path:
        description: 'Helm Chart Path'
        required: false
        default: './k8s/data-engine-helm/'
        type: string
      chart_override_path:
        description: 'Chart Override Values Path'
        required: false
        type: choice
        default: './k8s/data-engine-helm/values-database-only.yaml'
        options:
          - './k8s/data-engine-helm/values-database-only.yaml'
          - './k8s/data-engine-helm/values-prod.yaml'
          - './k8s/data-engine-helm/values-qa.yaml'
          - './k8s/data-engine-helm/values-dev.yaml'
          - 'none'
      namespace:
        description: 'Kubernetes Namespace'
        required: false
        default: 'dataengine'
        type: string
      release_name:
        description: 'Helm Release Name'
        required: false
        default: 'dataengine'
        type: string

env:
  REGISTRY: ghcr.io/nwagbara-group-llc
  IMAGE_NAME: data-engine
  CHART_PATH: ${{ github.event.inputs.chart_path || './k8s/data-engine-helm/' }}
  CHART_OVERRIDE_PATH: ${{ github.event.inputs.chart_override_path || './k8s/data-engine-helm/values-database-only.yaml' }}
  NAMESPACE: ${{ github.event.inputs.namespace || 'dataengine' }}
  RELEASE_NAME: ${{ github.event.inputs.release_name || 'dataengine' }}

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils

      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: LoggingEngine

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: MessageBrokerEngine

      - name: Add Bitnami Helm Repository
        shell: powershell
        run: |
          Write-Host "Adding Bitnami Helm repository..." -ForegroundColor Yellow
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          Write-Host "SUCCESS: Helm repositories updated" -ForegroundColor Green

      - name: Deploy DataEngine with Helm
        shell: powershell
        run: |
          
          Write-Host "Deploying DataEngine to Kubernetes..." -ForegroundColor Yellow
          Write-Host "Chart Path: $env:CHART_PATH" -ForegroundColor Cyan
          Write-Host "Namespace: $env:NAMESPACE" -ForegroundColor Cyan
          Write-Host "Release Name: $env:RELEASE_NAME" -ForegroundColor Cyan
          
          # Create namespace if it doesn't exist
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Check for stuck Helm operations and clean them up
          Write-Host "Checking for stuck Helm operations..." -ForegroundColor Yellow
          $helmStatus = helm status $env:RELEASE_NAME --namespace $env:NAMESPACE 2>&1
          if ($LASTEXITCODE -eq 0) {
            $statusOutput = $helmStatus | Out-String
            if ($statusOutput -match "STATUS:\s*(pending-install|pending-upgrade|pending-rollback)") {
              Write-Host "WARNING: Found stuck Helm operation. Rolling back..." -ForegroundColor Yellow
              helm rollback $env:RELEASE_NAME --namespace $env:NAMESPACE --wait 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) {
                Write-Host "Rollback failed, attempting to delete release..." -ForegroundColor Yellow
                helm delete $env:RELEASE_NAME --namespace $env:NAMESPACE 2>&1 | Out-Null
                Start-Sleep -Seconds 5
              }
            }
          }
          
          # Build Helm command
          $imageRepository = "$env:REGISTRY/$env:IMAGE_NAME"
          
          $helmArgs = @(
            "upgrade", "--install", $env:RELEASE_NAME
            $env:CHART_PATH
            "--namespace", $env:NAMESPACE
            "--create-namespace"
            "--wait"
            "--timeout", "15m"
            "--set", "image.repository=${imageRepository}"
            "--set", "image.tag=latest"
            "--set", "image.pullPolicy=Always"
            "--set", "redis.enabled=true"
            "--set", "postgresql.enabled=true"
            "--set", "monitoring.prometheus.enabled=true"
            "--set", "monitoring.grafana.enabled=true"
            "--set", "replicaCount=2"
          )
          
          # Add override file if specified and not 'none'
          $overrideFile = $env:CHART_OVERRIDE_PATH
          if ($overrideFile -and $overrideFile -ne "none" -and (Test-Path $overrideFile)) {
            Write-Host "Using override file: $overrideFile" -ForegroundColor Cyan
            $helmArgs += @("-f", $overrideFile)
          } elseif ($overrideFile -and $overrideFile -ne "none") {
            Write-Host "WARNING: Override file not found: $overrideFile" -ForegroundColor Yellow
            Write-Host "Continuing with default values..." -ForegroundColor Gray
          }
          
          # Execute Helm deployment
          Write-Host "Executing: helm $($helmArgs -join ' ')" -ForegroundColor Gray
          & helm @helmArgs
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SUCCESS: DataEngine deployed successfully" -ForegroundColor Green
          } else {
            Write-Host "ERROR: Deployment failed" -ForegroundColor Red
            exit 1
          }

      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "Verifying deployment..." -ForegroundColor Yellow
          
          # List Helm releases
          Write-Host "`nHelm releases:" -ForegroundColor Cyan
          helm list -n $env:NAMESPACE
          helm status $env:RELEASE_NAME -n $env:NAMESPACE
          
          # Check Kubernetes resources
          Write-Host "`nKubernetes resources:" -ForegroundColor Cyan
          kubectl get deployments -n $env:NAMESPACE -l app.kubernetes.io/instance=$env:RELEASE_NAME
          kubectl get pods -n $env:NAMESPACE -l app.kubernetes.io/instance=$env:RELEASE_NAME
          kubectl get services -n $env:NAMESPACE -l app.kubernetes.io/instance=$env:RELEASE_NAME
          
          Write-Host "SUCCESS: Deployment verification complete" -ForegroundColor Green
