name: Deploy DataEngine (Clean)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NAMESPACE: dataengine
  RELEASE_NAME: dataengine

jobs:
  deploy:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Namespace
        shell: powershell
        run: |
          # Create namespace if it doesn't exist
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Setup Image Pull Secret
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          # Recreate image pull secret with fresh credentials
          kubectl delete secret ghcr-secret -n $env:NAMESPACE --ignore-not-found=true
          
          kubectl create secret docker-registry ghcr-secret `
            --docker-server=ghcr.io `
            --docker-username=${{ github.actor }} `
            --docker-password=$env:GHCR_TOKEN `
            --namespace $env:NAMESPACE

      - name: Deploy with Helm
        shell: powershell
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'dataengine123' }}
        run: |
          cd k8s/data-engine-helm
          
          # Simple helm upgrade with ALL values in values.yaml (no --set spam)
          helm upgrade --install $env:RELEASE_NAME . `
            --namespace $env:NAMESPACE `
            --create-namespace `
            --timeout 10m `
            --wait `
            --atomic `
            --set customPostgresql.enabled=true `
            --set customPostgresql.auth.password=$env:POSTGRES_PASSWORD `
            --set customRedis.enabled=true `
            --set image.pullSecrets[0].name=ghcr-secret `
            --set customPostgresql.image.pullSecrets[0].name=ghcr-secret `
            --set customRedis.image.pullSecrets[0].name=ghcr-secret

      - name: Verify Deployment
        shell: powershell
        run: |
          Write-Host "Deployment Status:" -ForegroundColor Cyan
          helm status $env:RELEASE_NAME -n $env:NAMESPACE
          
          Write-Host "`nResources:" -ForegroundColor Cyan
          kubectl get all -n $env:NAMESPACE
          
          Write-Host "`nStatefulSets:" -ForegroundColor Cyan
          kubectl get statefulsets -n $env:NAMESPACE
