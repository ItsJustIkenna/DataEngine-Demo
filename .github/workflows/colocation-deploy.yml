name: Deploy DataEngine to Colocation Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE_NAME: DataEngine
  SERVICE_PORT: 8080

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DataEngine
        uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Checkout databaseschema
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/databaseschema
          path: databaseschema

      - name: Checkout redisutils
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/redisutils
          path: redisutils
      
      - name: Checkout LoggingEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          path: LoggingEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Checkout MessageBrokerEngine
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/MessageBrokerEngine
          path: MessageBrokerEngine
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            DataEngine
            databaseschema
            redisutils
            LoggingEngine
            MessageBrokerEngine
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libpq-dev

      - name: Run cargo test on all workspaces
        run: |
          echo "🧪 Running cargo test on DataEngine workspace (excluding performance)..."
          cd DataEngine && cargo test --verbose --workspace --exclude performance
          
          echo "🧪 Running cargo test on databaseschema..."
          cd ../databaseschema && cargo test --verbose
          
          echo "🧪 Running cargo test on redisutils..."
          cd ../redisutils && cargo test --verbose
          
          echo "🧪 Running cargo test on LoggingEngine..."
          cd ../LoggingEngine && cargo test --verbose
          
          echo "🧪 Running cargo test on MessageBrokerEngine..."
          cd ../MessageBrokerEngine/publisher && cargo test --verbose

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: DataEngine

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        working-directory: DataEngine
        run: |
          echo "🔒 Running security audit..."
          cargo audit

      - name: Check for vulnerabilities
        working-directory: DataEngine
        run: |
          echo "🛡️ Checking for known vulnerabilities..."
          cargo audit --deny warnings

  deploy:
    name: Deploy to Colocation
    runs-on: [self-hosted, windows, x64]
    needs: [test, security-audit]
    if: github.ref == 'refs/heads/main'
    # environment: production  # Add when environment is configured
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Checkout Dependencies
        shell: powershell
        run: |
          Write-Host "📦 Checking out dependencies..." -ForegroundColor Yellow
          $deps = @("databaseschema", "redisutils", "LoggingEngine", "MessageBrokerEngine")
          foreach ($dep in $deps) {
            if (Test-Path $dep) { Remove-Item $dep -Recurse -Force }
          }
          git clone https://github.com/Nwagbara-Group-LLC/databaseschema.git
          git clone https://github.com/Nwagbara-Group-LLC/redisutils.git
          git clone https://github.com/Nwagbara-Group-LLC/LoggingEngine.git
          git clone https://github.com/Nwagbara-Group-LLC/MessageBrokerEngine.git

      - name: Build DataEngine
        shell: powershell
        run: |
          Write-Host "🏗️ Building DataEngine..." -ForegroundColor Green
          $env:RUSTFLAGS = "-C target-cpu=native -C opt-level=3"
          cargo build --release --verbose
          if (Test-Path "target\release\dataengine.exe") {
            Write-Host "✅ Build successful" -ForegroundColor Green
          } else {
            Write-Host "❌ Build failed" -ForegroundColor Red
            exit 1
          }

      - name: Deploy Service
        shell: powershell
        run: |
          Write-Host "🚀 Deploying DataEngine..." -ForegroundColor Green
          $result = & "C:\Services\Scripts\Deploy-Microservice.ps1" -ServiceName "${{ env.SERVICE_NAME }}" -BinaryPath "$PWD\target\release\dataengine.exe" -Port ${{ env.SERVICE_PORT }}
          if ($result -eq 0) {
            Write-Host "✅ Deployment successful" -ForegroundColor Green
          } else {
            exit 1
          }

      - name: Verify Health
        shell: powershell
        run: |
          Start-Sleep -Seconds 10
          try {
            Invoke-RestMethod -Uri "http://localhost:${{ env.SERVICE_PORT }}/health" -TimeoutSec 10
            Write-Host "✅ Health check passed" -ForegroundColor Green
          } catch {
            Write-Host "⚠️ Health check failed" -ForegroundColor Yellow
          }