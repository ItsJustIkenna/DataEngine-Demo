[package]
name = "program"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "program"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"

[features]
default = ["database"]
database = ["hostbuilder/database"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
mimalloc = "0.1"
fastrand = "2.0"
num_cpus = "1.16"
libc = "0.2"

# Ultra-high performance logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }

# Local dependencies
hostbuilder = { path = "../hostbuilder", default-features = false }
performance = { path = "../performance" }
config = { path = "../config" }

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_Threading"] }
