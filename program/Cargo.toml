[package]
name = "program"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "program"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/benchmark.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
mimalloc = "0.1"
fastrand = "2.0"
num_cpus = "1.16"

# Local dependencies
hostbuilder = { path = "../hostbuilder" }
performance = { path = "../performance" }
config = { path = "../config" }

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_Threading"] }
